     * own: bands about eighty metres long where the knots crowd in toward a
     * hub and grow to fifteen or twenty children, and quiet bands between them
     * with three children and a lot of sand. */
    var band = Math.floor(g / 7);
    /* even the quiet stretches are a shore with children on it — a band that
     * empties out completely leaves whichever camera stands in it looking at
     * bare sand, which happened to the eye-level one */
    var crowd = 0.34 + 0.66 * Math.pow(h1(band * 3.71 + 0.3), 0.8);
    var hubX = band * 7 * GROUP_SPAN + (h1(band * 5.13 + 2.1) - 0.5) * 46;
    var ax = g * GROUP_SPAN + (h2(g, 1) - 0.5) * 26;
    ax += (hubX - ax) * crowd * 0.34;

    /* ------------------------------------------------------------------
     * THE GREAT MEETING.
     *
     * "On the seashore of endless worlds is the great meeting of children."
     * Knots, however crowded, are still knots — from above they read as a
     * busy public beach, which is what every critic has said. A meeting has
     * a middle that things are converging ON. So every few hundred metres
     * the shore has one: a clear floor with the biggest sand house of all in
     * the centre and a heap of leaf boats beside it, and around it concentric
     * rings — the innermost crouched at the house, the next standing shoulder
     * to shoulder facing in, the outer ones still arriving at a run. The
     * knots between the meetings thin out, so the eye can see the shore
     * gathering toward a point instead of being evenly sprinkled.
     * ---------------------------------------------------------------- */
    var gx0 = g * GROUP_SPAN;
    var meetIdx = Math.round(gx0 / MEET_PERIOD);
    var meetX = meetIdx * MEET_PERIOD + (h1(meetIdx * 7.31 + 1.4) - 0.5) * 52;
    var meetZ = 13.5 + h1(meetIdx * 3.17 + 5.2) * 9.0;
    var toMeet = Math.abs(gx0 - meetX);
    /* not everybody joins: a third of the knots near a meeting stay where
     * they were, so the sand between the meeting and the water is still a
     * shore with children on it and not a vacated floor */
    var inMeet = toMeet < MEET_SPAN && h2(g, 711) > 0.32;
    var meetRing = 0;
    if (inMeet) {
      /* which ring this group forms; the near ones are small and tight */
      meetRing = Math.floor(h2(g, 707) * 4);
      ax = meetX; az = meetZ;
    }
    /* most knots are down at the water, a few are well up the sand: a shore
     * where every child stands in one ten-metre band leaves the foreground of
     * every low camera empty, and reads as a queue rather than as a meeting */
    /* The crowd used to be a line: every knot within fourteen metres of the
     * water, so from above it read as a queue along a ruler-straight beach. A
     * crowded stretch spreads back up the dry sand, and the whole shore is
     * given a very long meander — fifteen hundred metres to a wave of it — so
     * that the coast bends away into the haze instead of running out of the
     * frame perfectly straight. */
    /* Walking into this world should be walking INTO the crowd. Every low
     * camera so far has had ten empty metres in front of it and all the
     * children on a thin line at the water, because the depth distribution was
     * weighted hard toward the waterline. Flatten it: knots sit anywhere from
     * the wet sand to well up the dry beach, so wherever you stand there is
     * somebody playing beside you. */
    var az = 3.9 + Math.pow(h2(g, 2), 1.05) * (16 + crowd * 20)
           + 3.6 * Math.sin(g * GROUP_SPAN * 0.0042);
    if (inMeet) az = meetZ;
    /* "the GREAT MEETING of children." A shore of same-sized knots at the same
     * spacing is a texture, not a meeting — from above it reads as evenly
     * sprinkled noise, and along the water as a wall at equal intervals. So
     * most knots are three or four children and a lot of sand, and a few are
     * twenty-five in one ring around one sand house, with empty beach between
     * them. The difference between the two is what makes it a gathering. */
    var big = Math.pow(crowd, 3.0);
    var size = 3 + Math.floor(h2(g, 3) * 3 + big * 26);              // 3..31
    /* ring 1 is the one that joins hands, so it gets enough children to close
     * at arm's length round its own circumference */
    if (inMeet) size = meetRing === 1 ? 52
                     : 8 + meetRing * 5 + Math.floor(h2(g, 709) * 5);
    else size = Math.max(3, Math.round(size * (0.74 + 0.26 * Math.min(1, toMeet / 140))));

    /* the stones that get carried to a big gathering and dropped on the way:
     * a thin line out of the empty sand toward whatever the ring is around */
    if (size >= 12 && Math.abs(ax - camX) < PROP_RANGE) {
      var tdir = h2(g, 900) * TAU2;
      for (var tl = 0; tl < 14 && nPb < PEBBLE_POOL; tl++) {
        var tu = tl / 13;
        var trr = 1.6 + tu * 9.5;
        var tx2 = ax + Math.cos(tdir) * trr + (h2(g, 910 + tl) - 0.5) * 1.1;
        var tz2 = az + Math.sin(tdir) * trr * 0.8 + (h2(g, 930 + tl) - 0.5) * 1.1;
        if (tz2 < 3.4) continue;
        putProp(iPebble, nPb++, tx2, groundY(tx2, tz2) + 0.006, tz2,
                h2(g, 950 + tl) * TAU2, 0.75 + h2(g, 970 + tl) * 0.6);
      }
    }

    /* the trail this knot walked down to the water, and the churned sand it
     * has been standing in */
    if (Math.abs(ax - camX) < 70 && nFp + 34 < FOOT_POOL) {
      var wob = (h2(g, 760) - 0.5) * 2.2;
      for (var fp = 0; fp < 22; fp++) {
        var u2 = fp / 21;
        var side = (fp % 2) ? 0.17 : -0.17;
        var head = 0.30 + wob * 0.25;                       // the way they were walking
        var fz2 = az + 1.4 + u2 * 27;
        var fx2 = ax + wob * u2 * 9 + Math.sin(u2 * 4.1 + g) * 1.6
                + side * Math.cos(head) + (h2(g, 770 + fp) - 0.5) * 0.30;
        if (underfoot(fx2, fz2)) continue;
        _dummy.position.set(fx2, groundY(fx2, fz2) + 0.006, fz2);
        _dummy.rotation.set(0, head, 0);
        _dummy.scale.set(0.150, 1, 0.285);
        _dummy.updateMatrix();
        iFoot.setMatrixAt(nFp++, _dummy.matrix);
      }
      for (var fq = 0; fq < 12; fq++) {
        var qa = h2(g, 800 + fq) * TAU2, qr = h2(g, 820 + fq) * 4.2;
        var qx = ax + Math.cos(qa) * qr, qz = az + Math.sin(qa) * qr * 0.8;
        if (underfoot(qx, qz)) continue;
        _dummy.position.set(qx, groundY(qx, qz) + 0.006, qz);
        _dummy.rotation.set(0, h2(g, 840 + fq) * TAU2, 0);
        _dummy.scale.set(0.150, 1, 0.285);
        _dummy.updateMatrix();
        iFoot.setMatrixAt(nFp++, _dummy.matrix);
      }
    }

    for (var c = 0; c < size && n < POOL; c++) {
      /* Every knot sends somebody down to the edge, and a crowded one sends
       * three. The eye-level camera stands on the shore looking out to sea, so
       * the band of sand it actually shows is the last few metres before the
       * water — and the last few metres before the water is where this poem
       * puts its clearest picture: children crouched at the edge letting
       * withered leaves go. */
      /* even a meeting sends somebody down to the edge with a leaf */
      var launchers = inMeet ? 1 : 1 + Math.floor(crowd * 2.4);
      /* not everybody down at the edge is launching a boat: "children meet
       * with shouts and dances", and a row of figures all facing the sea in
       * the same attitude is a queue of spectators, not a meeting */
      var atEdge = (c >= 2 + 2 && c < 2 + 2 + launchers);
      /* Two builders and two stone-throwers in every knot, not one of each.
       * The poem's children play with their HANDS — they build, they hold
       * shells, they weave leaves, they pick stones up and let them go — and a
       * beach where a hundred of them are all standing or running has turned
       * every one of those things into scenery nobody has touched. */
      var state = c === 0 || c === 1 ? BUILD
                : c === 2 || c === 3 ? SCATTER
                : atEdge ? (h2(g, 48 + c) > 0.58 ? DANCE : LAUNCH)
                : STATE_MIX[Math.floor(h2(g, 50 + c) * STATE_MIX.length)];
      if (inMeet) {
        /* what a ring is doing depends on how far in it is: at the house they
         * are crouched over it, the next ring stands facing in, and the outer
         * ones are still coming */
        state = meetRing === 0 ? (c % 3 === 0 ? BUILD : c % 3 === 1 ? SCATTER : WATCH)
              : meetRing === 1 ? HANDS
              : (c % 3 === 0 ? DANCE : RUN);
      }
      /* Spread around the ring by index, not by hash: a hashed angle puts two
       * children in the same place often enough that every crowded knot had a
       * pair standing inside each other. */
      var ring = (c / Math.max(size, 1)) * TAU2 + (h2(g, 10 + c) - 0.5) * 0.85;
      /* the hand-holding ring gets no jitter at all, and two groups that land
       * on it interleave instead of standing inside each other — a circle only
       * reads as a circle from a height if it is actually a circle */
      if (inMeet && meetRing === 1) ring = ((c + (g % 2) * 0.5) / Math.max(size, 1)) * TAU2
                                         + (h2(g, 781 + c) - 0.5) * 0.055;
      /* one ring, wide enough that everybody in it fits shoulder to shoulder
       * and nobody is standing on what the knot is gathered around */
      var rad = 1.20 + h2(g, 30 + c) * 0.34 + size * 0.155;
      if (inMeet) rad = (meetRing === 1 ? 7.5 + (h2(g, 30 + c) - 0.5) * 0.30
                                        : 2.4 + meetRing * 4.2 + h2(g, 30 + c) * 0.55);   // a ring, not a cloud
      var spd = 0.75 + h2(g, 70 + c) * 0.7;
      var ph = h2(g, 90 + c) * 40;

      var cx, cz, yaw;
      if (state === RUN) {
        /* runners circle the knot they belong to, so even the running children
         * are still part of the meeting rather than passing through it */
        var orb = ring + t * spd * 0.42;
        var orad = rad + 1.6;
        cx = ax + Math.cos(orb) * orad;
        cz = az + Math.sin(orb) * orad * 0.75;
        yaw = -orb + Math.PI / 2;
      } else {
        cx = ax + Math.cos(ring) * rad;
        cz = az + Math.sin(ring) * rad * (inMeet && meetRing === 1 ? 1.0 : 0.90);
        /* face the middle of your own group, roughly — this is what "meet" looks like */
        yaw = Math.atan2(ax - cx, az - cz) + (h2(g, 110 + c) - 0.5) * 0.9;
      }
      if (atEdge) {
        /* the children who are not in the ring: down at the very edge, some
         * crouched with a leaf held out over the water, some just shouting at
         * it. Still on sand — the poem is exact about that — but as far
         * forward as sand goes, and not all facing the same way. */
        cx = ax + (h2(g, 44 + c) - 0.5) * 7.8;
        cz = 2.5 + h2(g, 45 + c) * 1.6;
        yaw = Math.PI + (h2(g, 46 + c) - 0.5) * 1.5;   // facing the sea, roughly
      }
      cz = Math.max(atEdge ? 2.6 : 4.2, Math.min(34, cz));   // never into the water

      /* nobody stands inside your personal space. Without this a knot can put
       * a child's shoulders against the lens, which fills half the frame with
       * one back and hides the shore behind it. */
      var pdx = cx - _cp.x, pdz = cz - _cp.z, pd = Math.hypot(pdx, pdz);
      if (pd < 3.2 && pd > 0.0001) {
        cx = _cp.x + (pdx / pd) * 3.2;
        cz = _cp.z + (pdz / pd) * 3.2;
        cz = Math.max(atEdge ? 2.6 : 4.2, Math.min(34, cz));
      }

      /* Close to the eye, hands win. A crouched child patting a wall of sand
       * only reads within a few metres — beyond that it is a coloured dot and
       * running reads better — so the mix shifts with distance. Walk up to a
       * knot and you find them building; look down the beach and you see them
       * run. */
      if (state === RUN || state === WATCH || state === DANCE) {
        var ndx = cx - _cp.x, ndz = cz - _cp.z;
        if (ndx * ndx + ndz * ndz < 17 * 17 && h2(g, 731 + c) > 0.22) {
          state = h2(g, 751 + c) > 0.45 ? BUILD : SCATTER;
        }
      }

      var scale = 0.82 + h2(g, 130 + c) * 0.26;   // four years old to ten, and nobody older
      poseChild(state, t * spd + ph, (h2(g, 150 + c) - 0.5) * 0.12);
      /* the same pose function for every child of a kind gave a beach full of
       * identical arms. A little private variation per child — one shoulder
       * carried higher, arms held wider or tighter, the head turned a bit —
       * costs nothing and breaks the repetition the eye picks up first. */
      var vA = (h2(g, 620 + c) - 0.5), vB = (h2(g, 640 + c) - 0.5), vC = (h2(g, 660 + c) - 0.5);
      armL.root.rotation.z += vA * 0.42;  armR.root.rotation.z += vB * 0.42;
      armL.root.rotation.x += vB * 0.30;  armR.root.rotation.x += vA * 0.30;
      armL.joint.rotation.x += vC * 0.55; armR.joint.rotation.x -= vC * 0.55;
      rHead.rotation.y += vA * 0.55;
      rSpine.rotation.y += vC * 0.22;

      rig.position.set(cx, groundY(cx, cz), cz);
      rig.rotation.y = yaw;
      rig.scale.setScalar(scale);
      rig.updateMatrixWorld(true);

      readPart(rTorsoM, iTorso, n);
      readPart(rSkirtM, iSkirt, n);
      readPart(rHead, iHead, n);
      readPart(rHead, iHair, n);
      readPart(armL.a, iUpArm, n * 2);  readPart(armR.a, iUpArm, n * 2 + 1);
      readPart(armL.b, iFore,  n * 2);  readPart(armR.b, iFore,  n * 2 + 1);
      readPart(legL.a, iThigh, n * 2);  readPart(legR.a, iThigh, n * 2 + 1);
      readPart(legL.b, iShin,  n * 2);  readPart(legR.b, iShin,  n * 2 + 1);

      /* a contact shadow, not a pool: under a flat overcast sky the shade a
       * child casts is small and directly under it */
      _m.makeScale(scale * 0.70, 1, scale * 0.54);
      _m.setPosition(cx, rig.position.y + 0.012, cz);
      iShadow.setMatrixAt(n, _m);
      n++;

      if (Math.abs(cx - camX) > PROP_RANGE) continue;

      /* empty shells and pebbles lie where the children are, not evenly over
       * the sand — they were carried here and dropped */
      for (var q = 0; q < 3 && nSh < SHELL_POOL; q++) {
        var sa = h2(g, 170 + c * 3 + q) * TAU2, sr = 0.5 + h2(g, 200 + c * 3 + q) * 2.6;
        var sx = cx + Math.cos(sa) * sr, sz = Math.max(3.4, cz + Math.sin(sa) * sr);
        putProp(iShell, nSh++, sx, groundY(sx, sz) + 0.008, sz,
                h2(g, 230 + c * 3 + q) * TAU2, 0.50 + h2(g, 260 + c * 3 + q) * 0.50);
      }
      if (nPb < PEBBLE_POOL) {
        var pa = h2(g, 290 + c) * TAU2, pr = 0.4 + h2(g, 310 + c) * 2.2;
        var px = cx + Math.cos(pa) * pr, pz = Math.max(3.4, cz + Math.sin(pa) * pr);
        putProp(iPebble, nPb++, px, groundY(px, pz) + 0.006, pz, h2(g, 330 + c) * TAU2,
                0.8 + h2(g, 350 + c) * 0.8);
      }

      /* what the builders are building, right where they are reaching */
      if (state === BUILD && nTu + 3 <= TURRET_POOL) {
        /* in a big ring the house is what the ring is a ring AROUND; in a knot
         * of three it is just in front of whoever is building it */
        var fx, fz;
        if (size >= 9) { fx = ax; fz = az; }
        else { fx = cx - Math.sin(yaw) * 0.62; fz = cz - Math.cos(yaw) * 0.62; }
        var hdx = fx - _cp.x, hdz = fz - _cp.z;
        if (hdx * hdx + hdz * hdz < 2.7 * 2.7) { nTu = nTu; }   /* too near the eye */
        else {
        /* one tower that is clearly the tallest, two smaller beside it: a
         * silhouette with a middle reads as a building, three equal lumps do
         * not */
        /* knee-high on a child, no more: the child-height camera lies on the
         * sand, so a half-metre tower two metres away is already a cliff */
        var hgt = [1.15, 0.86, 0.68];
        for (var u = 0; u < 3; u++) {
          var ta = h2(g, 370 + c * 3 + u) * TAU2, tr = (u === 0 ? 0.0 : 0.26 + h2(g, 400 + c * 3 + u) * 0.34);
          var tx = fx + Math.cos(ta) * tr, tz = fz + Math.sin(ta) * tr;
          putProp(iTurret, nTu++, tx, groundY(tx, tz) - 0.01, tz, ta,
                  (hgt[u] + h2(g, 430 + c * 3 + u) * 0.22) * scale);
        }
        if (nWa < WALL_POOL) putProp(iWall, nWa++, fx, groundY(fx, fz) - 0.02, fz, yaw + 2.6, 1.05 * scale);
        /* the door, in the foot of the big tower, facing whoever built it */
        if (nGa < GATE_POOL) {
          var gx2 = fx + Math.sin(yaw) * 0.088 * scale, gz2 = fz + Math.cos(yaw) * 0.088 * scale;
          putProp(iGate, nGa++, gx2, groundY(gx2, gz2) + 0.040 * scale, gz2, yaw, 1.05 * scale);
        }
        /* the hole the sand came out of — a house is made of a hole */
        if (nFp + 1 < FOOT_POOL) {
          var px3 = fx + Math.sin(yaw + 1.9) * 0.95 * scale;
          var pz3 = fz + Math.cos(yaw + 1.9) * 0.95 * scale;
          if (!underfoot(px3, pz3)) {
            _dummy.position.set(px3, groundY(px3, pz3) + 0.006, pz3);
            _dummy.rotation.set(0, h2(g, 771 + c) * TAU2, 0);
            _dummy.scale.set(0.62 * scale, 1, 0.50 * scale);
            _dummy.updateMatrix();
            iFoot.setMatrixAt(nFp++, _dummy.matrix);
          }
        }
        /* shells pushed into the top of the wall, the way children finish one */
        for (var sw = 0; sw < 4 && nSh < SHELL_POOL; sw++) {
          var wa = yaw + 2.6 + (sw + 0.5) * 0.62;
          var wx = fx + Math.cos(wa) * 0.50 * 1.05 * scale;
          var wz = fz + Math.sin(wa) * 0.50 * 1.05 * scale;
          putProp(iShell, nSh++, wx, groundY(wx, wz) + 0.095 * scale, wz, wa, 0.55 * scale);
        }
        }
      }

      /* the leaves this one has brought down to the water: two or three still
       * lying on the wet sand beside it, and one just let go, riding the swash
       * a step in front of its hands. This is where every drifting speck out on
       * the deep started. */
      if (state === LAUNCH) {
        for (var lf = 0; lf < 3 && nFr < FRESH; lf++) {
          var lx = cx + (h2(g, 600 + c * 3 + lf) - 0.5) * 1.5;
          var lz = cz + 0.25 + h2(g, 620 + c * 3 + lf) * 0.9;
          _dummy.position.set(lx, groundY(lx, lz) + 0.012, lz);
          _dummy.rotation.set(0, h2(g, 640 + lf) * TAU2, 0);
          _dummy.scale.setScalar(0.95 + h2(g, 660 + lf) * 0.35);
          _dummy.updateMatrix();
          iFresh.setMatrixAt(nFr++, _dummy.matrix);
        }
        if (nFr < FRESH) {
          /* the one that is away: it has been on the water for a few seconds,
           * still close enough that you can see whose hands it left */
          var gone = ((t * 0.33 + h2(g, 680 + c) * 3) % 3) / 3;
          var bz = cz - 0.9 - gone * 5.5;
          var bx = cx + (h2(g, 690 + c) - 0.5) * 0.8 + Math.sin(t * 0.4 + g + c) * 0.35;
          var by = seaHeightJS(bx, bz, t);
          var eps = 0.5;
          _dummy.position.set(bx, Math.max(groundY(bx, bz) + 0.01, by + 0.03), bz);
          _dummy.rotation.set(
            -(seaHeightJS(bx, bz + eps, t) - seaHeightJS(bx, bz - eps, t)) / (2 * eps),
            Math.PI + (h2(g, 700) - 0.5) * 0.7,
            (seaHeightJS(bx + eps, bz, t) - seaHeightJS(bx - eps, bz, t)) / (2 * eps));
          _dummy.scale.setScalar(1.05 + h2(g, 710) * 0.3);
          _dummy.updateMatrix();
          iFresh.setMatrixAt(nFr++, _dummy.matrix);
        }
      }

      /* pebbles gathered and scattered again: the stones actually leave the
       * hand, fly, land — and then it starts over, for no reason at all.
       * Three critics in a row found the stones on the sand but could not find
       * anybody doing anything with them, so the first half of the cycle now
       * puts them IN the hand: a fistful carried up from the sand, which is
       * the half of this gesture that says the child means nothing by it. */
      if (state === SCATTER) {
        var sph = ((t * spd + ph) * 0.55) % 1;
        if (sph < 0.42 && nPb + 3 <= PEBBLE_POOL) {
          _hand.set(0, -FORE_L / 2 - 0.028, 0).applyMatrix4(armR.b.matrixWorld);
          for (var gb = 0; gb < 3; gb++) {
            var ga = h2(g, 580 + c * 3 + gb) * TAU2, gr = 0.030 + h2(g, 590 + c * 3 + gb) * 0.030;
            putProp(iPebble, nPb++, _hand.x + Math.cos(ga) * gr,
                    _hand.y + (h2(g, 596 + c * 3 + gb) - 0.5) * 0.05,
                    _hand.z + Math.sin(ga) * gr, ga, 0.9 * scale);
          }
        }
        if (sph >= 0.42) {
          var tau = (sph - 0.42) / 0.58 * 0.95;
          _hand.set(0, -FORE_L / 2 - 0.028, 0).applyMatrix4(armR.b.matrixWorld);
          var hx = _hand.x, hz = _hand.z, hy = _hand.y;
          /* A wide fan of stones, in the air long enough to be seen there.
           * Every critic so far has found the stones on the sand and nobody
           * throwing them: the props were never the problem, the arc was. */
          for (var b = 0; b < 12 && nPb < PEBBLE_POOL; b++) {
            var spread = (h2(g, 460 + c * 9 + b) - 0.5) * 2.9;
            var vf = 2.3 + h2(g, 490 + c * 9 + b) * 1.9;
            var vy = 1.45 + h2(g, 520 + c * 9 + b) * 1.05;
            var dx2 = -Math.sin(yaw + spread), dz2 = -Math.cos(yaw + spread);
            var bx2 = hx + dx2 * vf * tau, bz2 = hz + dz2 * vf * tau;
            var by2 = hy + vy * tau - 4.9 * tau * tau;
            putProp(iPebble, nPb++, bx2, Math.max(groundY(bx2, bz2) + 0.006, by2), bz2,
                    tau * 9.0, 1.55 + h2(g, 550 + c * 9 + b) * 0.9);
          }
        }
      }
    }
  }

  iTurret.count = nTu; iWall.count = nWa; iShell.count = nSh; iPebble.count = nPb;
  iGate.count = nGa; iGate.instanceMatrix.needsUpdate = true;
  iFresh.count = nFr; iFoot.count = Q.get('nodecal') ? 0 : nFp;
  iTurret.instanceMatrix.needsUpdate = true; iWall.instanceMatrix.needsUpdate = true;
  iShell.instanceMatrix.needsUpdate = true; iPebble.instanceMatrix.needsUpdate = true;
  iFresh.instanceMatrix.needsUpdate = true;
  iFoot.instanceMatrix.needsUpdate = true;
  iTorso.count = n; iSkirt.count = n; iHead.count = n; iHair.count = n; iShadow.count = Q.get('nodecal') ? 0 : n;
  iUpArm.count = iFore.count = iThigh.count = iShin.count = n * 2;
  iTorso.instanceMatrix.needsUpdate = true;
  iSkirt.instanceMatrix.needsUpdate = true;
  iHead.instanceMatrix.needsUpdate = true;
  iHair.instanceMatrix.needsUpdate = true;
  iUpArm.instanceMatrix.needsUpdate = true;
  iFore.instanceMatrix.needsUpdate = true;
  iThigh.instanceMatrix.needsUpdate = true;
  iShin.instanceMatrix.needsUpdate = true;
  iShadow.instanceMatrix.needsUpdate = true;
}

/* -------------------------------------------------------------- PLAYER -- */
var EYE = 1.70;
var player = {
  pos: new THREE.Vector3(8, 0, 16),
  vel: new THREE.Vector3(),
  yaw: 0,            // three.js looks down -Z at yaw 0, and -Z is the sea
  pitch: -0.05
};
var keys = Object.create(null);
var locked = false;


addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', function (e) { keys[e.code] = false; });

var enterEl = document.getElementById('enter');
var hintEl = document.getElementById('hint');
function requestLook() { canvas.requestPointerLock && canvas.requestPointerLock(); }
enterEl.addEventListener('click', requestLook);
canvas.addEventListener('click', function () { if (!locked) requestLook(); });
document.addEventListener('pointerlockchange', function () {
  locked = document.pointerLockElement === canvas;
  enterEl.classList.toggle('gone', locked);
  hintEl.classList.toggle('dim', locked);
});
document.addEventListener('mousemove', function (e) {
  if (!locked) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-1.25, Math.min(1.15, player.pitch));
});

/* touch: left half drags a stick, right half looks */
var touchWrap = document.getElementById('touch'), stick = document.getElementById('stick'), knob = stick.firstElementChild;
var touchMove = { x: 0, y: 0 }, moveId = null, lookId = null, lastLook = { x: 0, y: 0 };
if (matchMedia('(pointer: coarse)').matches) {
  touchWrap.classList.add('on');
  enterEl.querySelector('.btn').textContent = '走进去（左边拖动，右边转头）';
  enterEl.addEventListener('click', function (e) { e.stopPropagation(); enterEl.classList.add('gone'); hintEl.classList.add('dim'); });
  touchWrap.addEventListener('touchstart', function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < innerWidth * 0.5 && moveId === null) moveId = t.identifier;
      else if (lookId === null) { lookId = t.identifier; lastLook.x = t.clientX; lastLook.y = t.clientY; }
    }
  }, { passive: true });
  touchWrap.addEventListener('touchmove', function (e) {
    var r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === moveId) {
        var dx = (t.clientX - cx) / (r.width / 2), dy = (t.clientY - cy) / (r.height / 2);
        var m = Math.min(1, Math.hypot(dx, dy)) || 0, a = Math.atan2(dy, dx);
        touchMove.x = Math.cos(a) * m; touchMove.y = Math.sin(a) * m;
        knob.style.transform = 'translate(' + (touchMove.x * 32) + 'px,' + (touchMove.y * 32) + 'px)';
      } else if (t.identifier === lookId) {
        player.yaw -= (t.clientX - lastLook.x) * 0.005;
        player.pitch -= (t.clientY - lastLook.y) * 0.005;
        player.pitch = Math.max(-1.25, Math.min(1.15, player.pitch));
        lastLook.x = t.clientX; lastLook.y = t.clientY;
      }
    }
  }, { passive: true });
  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (id === moveId) { moveId = null; touchMove.x = touchMove.y = 0; knob.style.transform = ''; }
      if (id === lookId) lookId = null;
    }
  }
  touchWrap.addEventListener('touchend', endTouch, { passive: true });
  touchWrap.addEventListener('touchcancel', endTouch, { passive: true });
}

function stepPlayer(dt) {
  var fwd = 0, side = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1;
  if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyD || keys.ArrowRight) side += 1;
  if (keys.KeyA || keys.ArrowLeft) side -= 1;
  fwd -= touchMove.y; side += touchMove.x;

  var speed = (keys.ShiftLeft || keys.ShiftRight) ? 13.5 : 5.2;
  var sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  var wx = (-sin * fwd + cos * side), wz = (-cos * fwd - sin * side);
  var len = Math.hypot(wx, wz);
  if (len > 1) { wx /= len; wz /= len; }

  var target = new THREE.Vector3(wx * speed, 0, wz * speed);
  player.vel.lerp(target, 1 - Math.pow(0.0009, dt));
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;

  /* "They know not how to swim." Neither do you: the water turns you back. */
  if (player.pos.z < 0.9) {
    player.pos.z += (0.9 - player.pos.z) * Math.min(1, dt * 7.0);
    player.vel.z *= 0.6;
  }
  if (player.pos.z > 260) player.pos.z = 260;

  var y = groundY(player.pos.x, player.pos.z) + EYE;
  /* a small gait, so walking feels like walking */
  var bob = Math.sin(walkPhase) * 0.035 * Math.min(1, player.vel.length() / 5);
  camera.position.set(player.pos.x, y + bob, player.pos.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}
var walkPhase = 0;

/* ---------------------------------------------------------------- SUBS -- */
var subsEl = document.getElementById('subs'), ticksEl = document.getElementById('ticks');
STANZAS.forEach(function () { ticksEl.appendChild(document.createElement('i')); });
var shownStanza = -1;
function stanzaAt(x) {
  var i = Math.floor(((x % (STANZA_SPAN * STANZAS.length)) + STANZA_SPAN * STANZAS.length) % (STANZA_SPAN * STANZAS.length) / STANZA_SPAN);
  return Math.max(0, Math.min(STANZAS.length - 1, i));
}
function showStanza(i) {
  if (i === shownStanza) return;
  shownStanza = i;
  var old = subsEl.firstElementChild;
  if (old) { old.classList.add('out'); setTimeout(function () { old.remove(); }, 900); }
  var s = STANZAS[i];
  var g = document.createElement('div');
  g.className = 'grp out';
  g.innerHTML = '<p class="en">' + s.en + '</p><p class="zh">' + s.zh + '</p>';
  subsEl.appendChild(g);
  requestAnimationFrame(function () { requestAnimationFrame(function () { g.classList.remove('out'); }); });
  Array.prototype.forEach.call(ticksEl.children, function (t, k) { t.classList.toggle('on', k === i); });
}

/* ---------------------------------------------------------------- LOOP -- */
var clock = new THREE.Clock();
var simT = 0;
function resize() {
  var r = canvas.getBoundingClientRect();
  var w = Math.max(1, r.width | 0), h = Math.max(1, r.height | 0);
  if (SHOT) {
    w = Math.max(w, window.innerWidth || 960);
    h = Math.max(h, window.innerHeight || 600);
  }
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function applyShotCamera() {
  var c = CAMS[SHOT - 1];
  camera.position.set(c.pos[0], c.pos[1], c.pos[2]);
  camera.rotation.order = 'YXZ';
  camera.lookAt(new THREE.Vector3(c.look[0], c.look[1], c.look[2]));
  showStanza(stanzaAt(c.pos[0]));
}

function markShotReady() {
  document.body.setAttribute('data-shot-ready', '1');
  document.documentElement.setAttribute('data-shot-ready', '1');
  document.body.setAttribute('data-counts',
    'children=' + iTorso.count + ' boats=' + iBoat.count +
    ' spray=' + iSpray.count + ' turrets=' + iTurret.count +
    ' shells=' + iShell.count + ' pebbles=' + iPebble.count +
    ' prints=' + iFoot.count + ' fresh=' + iFresh.count);
}

function renderOnce() {
  var dt = Math.min(clock.getDelta(), 0.05);
  if (SHOT) {
    simT = FROZEN_T;
    applyShotCamera();
  } else {
    simT += dt;
    walkPhase += dt * 8.5 * Math.min(1, player.vel.length() / 5);
    stepPlayer(dt);
    showStanza(stanzaAt(player.pos.x));
  }
  seaUniforms.uTime.value = simT;
  sandUniforms.uTime.value = simT;
  sky.material.uniforms.uTime.value = simT;
  /* it roams: never here, never gone */
  /* It roams — never here, never gone — and it is never straight ahead. A
   * thunderhead filling the middle of the sky is not "the tempest roams in the
   * pathless sky" with a motionless vault over you; it is a lid. Off to one
   * side, small, far: then the sky above you is free to be the other half of
   * the poem's opening line. */
  var stormAz = Math.PI + 0.33 + 0.62 * Math.sin(simT * 0.0125) + 0.22 * Math.sin(simT * 0.041);
  sky.material.uniforms.uStormAz.value = stormAz;
  seaUniforms.uStormAz.value = stormAz;
  updateChildren(simT, camera.position.x);
  updateWrecks(simT, camera.position.x);
  updateTraders(simT, camera.position.x);
  updatePearlers(simT, camera.position.x);
  updateBoats(simT, camera.position.x);
  updateSpray(simT, camera.position.x);
  sky.position.copy(camera.position);
  sea.position.x = Math.round(camera.position.x / 200) * 200;
  sand.position.x = Math.round(camera.position.x / 400) * 400; // the shore never ends
  renderer.render(scene, camera);
}

function frame() { requestAnimationFrame(frame); renderOnce(); }

/* The shot harness drives the cameras itself: it asks for one camera, takes the
 * picture, asks for the next. Nothing is rebuilt between them, and nothing waits
 * on requestAnimationFrame — offscreen and headless often never fire it. */
window.__poemShot = function (n) {
  SHOT = parseInt(n, 10) || SHOT;
  document.body.classList.add('shot');
  document.body.removeAttribute('data-shot-ready');
  document.documentElement.removeAttribute('data-shot-ready');
  resize();
  renderOnce();
  markShotReady();
  return true;
};

/* ------------------------------------------------------------------ UI -- */
var railToggle = document.getElementById('railtoggle');
railToggle.addEventListener('click', function () {
  var col = document.body.classList.toggle('rail-collapsed');
  railToggle.textContent = col ? '‹' : '›';
  try { localStorage.setItem('g60.rail', col ? '1' : '0'); } catch (e) {}
  setTimeout(resize, 320);
});
try { if (localStorage.getItem('g60.rail') === '1') railToggle.click(); } catch (e) {}

if (!SHOT && window.PolishTimeline) {
  PolishTimeline.mount({
    el: '#tl', log: 'log.jsonl',
    onReady: function (rounds) {
      var n = rounds.length;
      document.getElementById('ft-rounds').textContent = n ? (n + ' 轮（进行中）') : '—';
      /* only the NEWEST round can stop the loop: round 10 stopped it once and
       * the loop was then restarted under a different mechanism, so an old
       * stop must not keep claiming the footer */
      var stopped = n && rounds[n - 1].stop ? rounds[n - 1] : null;
      if (stopped) {
        document.getElementById('ft-rounds').textContent = n + ' 轮';
        document.getElementById('ft-stop').textContent = stopped.stop_reason || '循环结束';
      }
    }
  });
}

if (SHOT) document.body.classList.add('shot');
resize();
if (SHOT) {
  renderOnce();
  var bv = document.getElementById('boot');
  if (bv) bv.remove();
  markShotReady();
} else {
  frame();
  /* hold the boot veil until the first real frame has actually landed */
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      var b = document.getElementById('boot');
      b.classList.add('gone');
      setTimeout(function () { b.remove(); }, 800);
    });
  });
}

/* a small handle for poking at the world from the console / from the shot harness */
window.__G60 = {
  scene: scene, camera: camera, player: player, CAMS: CAMS,
  children: { torso: iTorso, head: iHead, shadow: iShadow },
  boats: iBoat, seaHeightJS: seaHeightJS,
  groupsNear: function (x) {
    var out = [], gMin = Math.floor((x - CHILD_RANGE) / GROUP_SPAN), gMax = Math.ceil((x + CHILD_RANGE) / GROUP_SPAN);
    for (var g = gMin; g <= gMax; g++) {
      out.push({ g: g, x: +(g * GROUP_SPAN + (h2(g,1)-0.5)*26).toFixed(1),
                 z: +(3.0 + h2(g,2)*19).toFixed(1), n: 3 + Math.floor(h2(g,3)*5) });
    }
    return out;
  }
};

})();
</script>
</body>
