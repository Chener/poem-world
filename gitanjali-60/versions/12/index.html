<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>无尽世界的海岸 · Gitanjali 60</title>
<meta name="description" content="泰戈尔《吉檀迦利》第 60 首，做成一个可以走进去的世界；右侧是它被打磨出来的完整过程。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🐚%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="../shared/timeline.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; background: var(--bg-sink); }

  /* ---------- left: the world ---------- */
  #stage { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; background: #0b0d10; }
  #view  { display: block; width: 100%; height: 100%; }

  #boot {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; justify-items: center;
    background: #0b0d10; color: var(--ink-dim); font-family: var(--serif); text-align: center; padding: 24px;
    transition: opacity .7s ease; z-index: 6;
  }
  #boot .t { font-size: 19px; color: var(--ink); letter-spacing: .02em; }
  #boot .s { font-size: 13px; font-family: var(--mono); color: var(--ink-faint); }
  #boot.gone { opacity: 0; pointer-events: none; }

  /* poem subtitles, bottom-centre, the way a film carries a voice */
  /* the world is pale by design, so the words need their own weather */
  #stage::before, #stage::after {
    content: ""; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 2;
  }
  #stage::before { top: 0; height: 130px; background: linear-gradient(to bottom, rgba(8,10,13,.42), transparent); }
  #stage::after  { bottom: 0; height: 40%; background: linear-gradient(to top, rgba(8,10,13,.55), rgba(8,10,13,.16) 42%, transparent); }
  body.shot #stage::before, body.shot #stage::after { display: none; }

  #subs {
    position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
    width: min(720px, 86%); text-align: center; pointer-events: none; z-index: 4;
    text-shadow: 0 2px 22px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.6);
  }
  #subs .en {
    font-family: var(--serif); font-style: italic; font-size: clamp(14px, 1.55vw, 19px);
    line-height: 1.6; color: #f3efe6; margin: 0 0 7px;
  }
  #subs .zh {
    font-family: var(--serif); font-size: clamp(12.5px, 1.25vw, 15.5px);
    line-height: 1.8; color: #ddd5c6; margin: 0;
  }
  #subs .grp { transition: opacity .9s ease, transform .9s ease; }
  #subs .grp.out { opacity: 0; transform: translateY(8px); }

  /* stanza ticks: where you are inside the poem, along an endless shore */
  #ticks {
    position: absolute; left: 50%; bottom: 3.4%; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 4; pointer-events: none;
  }
  #ticks i {
    width: 26px; height: 2px; background: rgba(255,255,255,.22); border-radius: 2px;
    transition: background .5s, width .5s;
  }
  #ticks i.on { background: rgba(243,239,230,.9); width: 40px; }

  #hint {
    position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px; z-index: 5;
    font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,.62);
    text-shadow: 0 1px 8px rgba(0,0,0,.7); display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    transition: opacity .5s; pointer-events: none;
  }
  #hint kbd {
    font: inherit; border: 1px solid rgba(255,255,255,.25); border-radius: 3px;
    padding: 1px 5px; color: rgba(255,255,255,.72);
  }
  #hint.dim { opacity: 0; }

  #enter {
    position: absolute; inset: 0; display: grid; place-content: center; z-index: 5;
    background: radial-gradient(60% 60% at 50% 50%, rgba(6,8,10,.25), rgba(6,8,10,.72));
    cursor: pointer; transition: opacity .45s;
  }
  #enter .btn {
    font-family: var(--serif); font-size: 17px; color: #f3efe6; letter-spacing: .06em;
    border: 1px solid rgba(243,239,230,.45); border-radius: 999px; padding: 12px 30px;
    background: rgba(0,0,0,.28); backdrop-filter: blur(3px); transition: border-color .25s, background .25s;
  }
  #enter:hover .btn { border-color: rgba(243,239,230,.95); background: rgba(0,0,0,.45); }
  #enter.gone { opacity: 0; pointer-events: none; }

  /* touch: left thumb moves, right thumb looks */
  #touch { position: absolute; inset: 0; z-index: 3; display: none; }
  #touch.on { display: block; }
  #stick {
    position: absolute; left: 22px; bottom: 22px; width: 104px; height: 104px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.18);
  }
  #stick b { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px;
    border-radius: 50%; background: rgba(243,239,230,.35); }

  /* ---------- right: the polish timeline ---------- */
  #rail {
    flex: 0 0 var(--rail, 372px); width: var(--rail, 372px); height: 100%;
    display: flex; flex-direction: column; background: var(--bg-raise);
    border-left: 1px solid var(--line); overflow: hidden; transition: flex-basis .28s ease, width .28s ease;
  }
  body.rail-collapsed #rail { flex-basis: 42px; width: 42px; }
  body.rail-collapsed #rail > *:not(#railbar) { display: none; }
  body.rail-collapsed #railbar .rb-txt { display: none; }

  #railbar {
    flex: none; display: flex; align-items: center; gap: 9px; padding: 11px 12px;
    border-bottom: 1px solid var(--line); background: var(--bg-raise);
  }
  #railbar button {
    flex: none; width: 20px; height: 20px; border: 1px solid var(--line); border-radius: 4px;
    background: transparent; color: var(--ink-dim); cursor: pointer; font-family: var(--mono);
    font-size: 11px; line-height: 1; display: grid; place-items: center; padding: 0;
  }
  #railbar button:hover { color: var(--ink); border-color: var(--ink-faint); }
  .rb-txt { min-width: 0; }
  .rb-txt .a {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .rb-txt .b { font-family: var(--serif); font-size: 14px; color: var(--ink); margin-top: 1px; }

  #tl { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
  #tl::-webkit-scrollbar { width: 9px; }
  #tl::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px; }

  #railfoot {
    flex: none; border-top: 1px solid var(--line); padding: 12px 16px 14px;
    background: var(--bg-sink);
  }
  #railfoot .rows { display: grid; gap: 2px; }
  #railfoot .row { display: flex; gap: 8px; font-family: var(--mono); font-size: 10.5px; line-height: 1.7; }
  #railfoot .row .k { flex: none; width: 5.2em; color: var(--ink-faint); }
  #railfoot .row .v { color: var(--ink); min-width: 0; }
  #railfoot .row .v.sand { color: var(--sand); }
  #railfoot .lnks { margin-top: 10px; display: flex; gap: 12px; font-family: var(--mono); font-size: 10.5px; }
  #railfoot .lnks a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  #railfoot .lnks a:hover { color: var(--sand); border-color: var(--sand); }

  /* screenshot mode: only the world, at a known camera, at a frozen time */
  body.shot #rail, body.shot #hint, body.shot #enter, body.shot #boot,
  body.shot #ticks, body.shot #touch, body.shot #subs { display: none !important; }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    #stage { flex: 1 1 58%; }
    #rail { flex: 0 0 42%; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
    body.rail-collapsed #rail { flex-basis: 42px; width: 100%; }
  }
</style>

<script>
/* =========================================================================
 * 无尽世界的海岸 — Gitanjali 60
 * One file, no build, three.js from CDN.
 * Sections: POEM → CAMS → SKY → SEA → SAND → PLAYER → SUBS → LOOP → UI
 * ========================================================================= */
(function () {
'use strict';

var Q = new URLSearchParams(location.search);
var SHOT = parseInt(Q.get('shot') || '0', 10) || 0;   // 1..6 → fixed camera, frozen time, no UI
var FROZEN_T = 14.0;                                   // deterministic clock for shots
var SHOT_FRAMES = 4;                                   // shot mode renders this many, then stops
var shotFrames = 0;

/* ---------------------------------------------------------------- POEM -- */
/* Five stanzas. Walking the endless shore walks the poem. */
var STANZAS = [
  { en: 'On the seashore of endless worlds children meet.<br>The infinite sky is motionless overhead and the restless water is boisterous.',
    zh: '在无尽世界的海岸上，孩子们相聚。<br>头顶是无垠的天，一动不动；脚下是不安的水，喧哗不止。' },
  { en: 'They build their houses with sand and they play with empty shells.<br>With withered leaves they weave their boats and smilingly float them on the vast deep.',
    zh: '他们用沙筑起自己的屋子，他们拿空贝壳做游戏。<br>他们把枯叶编成小船，笑着，把它们放到深不可测的海上去。' },
  { en: 'They know not how to swim, they know not how to cast nets.<br>Pearl fishers dive for pearls, merchants sail in their ships, while children gather pebbles and scatter them again.',
    zh: '他们不会游泳，他们不会撒网。<br>采珠人潜下去取珠，商人们扬帆远行；孩子们只是拾起石子，又把石子撒开。' },
  { en: 'The sea surges up with laughter and pale gleams the smile of the sea beach.<br>Death-dealing waves sing meaningless ballads to the children, even like a mother while rocking her baby’s cradle.',
    zh: '海涌起来，大笑；海滩的微笑，苍白地亮着。<br>那些带来死亡的浪，对孩子们唱着没有意思的歌谣——像一个母亲，摇着她婴儿的摇篮时那样。' },
  { en: 'Tempest roams in the pathless sky, ships get wrecked in the trackless water, death is abroad and children play.<br>On the seashore of endless worlds is the great meeting of children.',
    zh: '风暴在没有路的天上游荡，船在没有航迹的水上碎裂，死亡在外面走着，而孩子们游戏。<br>在无尽世界的海岸上，是孩子们盛大的相聚。' }
];
var STANZA_SPAN = 150; // metres of shore per stanza

/* ---------------------------------------------------------------- CAMS -- */
/* Six fixed cameras, frozen at round 1. Never change these — cross-round
 * screenshots are only comparable because the eye does not move. */
var CAMS = [
  { name: 'arrival',    pos: [  8, 1.70,  14], look: [  3, 1.20, -60] },
  { name: 'children',   pos: [ 14, 0.95,  25], look: [ 22, 0.75,  12] },
  { name: 'boats',      pos: [ -6, 0.55,  -4], look: [ -9, 0.95, -70] },
  { name: 'horizon',    pos: [  0, 2.30,  16], look: [-30, 3.60,-260] },
  { name: 'shore-line', pos: [-40, 0.42,  12], look: [180, 1.10,  -6] },
  { name: 'above',      pos: [ 10,26.00,  78], look: [  0, 0.00, -90] }
];

/* ----------------------------------------------------------- RENDERER -- */
var canvas = document.getElementById('view');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(55, 1, 0.1, 6000);

/* The palette of a pale, luminous, slightly overcast hour: the beach smiles,
 * but the smile is pale. Everything else is tuned to these five colours. */
var PAL = {
  skyTop:  new THREE.Color(0x6a8dac),
  skyHaze: new THREE.Color(0xd7d1c2),
  sun:     new THREE.Color(0xfff2dc),
  seaDeep: new THREE.Color(0x1d3b4b),
  seaShal: new THREE.Color(0x38787b),
  sand:    new THREE.Color(0xbcaa89),
  sandWet: new THREE.Color(0x7c7263)
};
var FOG = new THREE.Color(0xc0c1bb);
scene.fog = new THREE.Fog(FOG, 300, 2600);

var SUNDIR = new THREE.Vector3(-0.34, 0.20, -0.92).normalize(); // low, ahead-left, over the sea

/* ----------------------------------------------------------------- SKY -- */
/* "The infinite sky is motionless overhead." So: no clouds move up there.
 * A dome, a gradient, one pale sun-smear near the horizon. Nothing animates. */
var sky = new THREE.Mesh(
  new THREE.SphereGeometry(3000, 48, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop:  { value: PAL.skyTop }, uHaze: { value: PAL.skyHaze },
      uSun:  { value: PAL.sun },    uSunDir: { value: SUNDIR },
      uTime: { value: 0 },          uStormAz: { value: Math.PI }
    },
    vertexShader: [
      'varying vec3 vDir;',
      'void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vDir; uniform vec3 uTop,uHaze,uSun,uSunDir; uniform float uTime,uStormAz;',
      'float hs(vec2 p){ return fract(sin(dot(p, vec2(41.7, 289.1)))*43758.5453); }',
      'float ns(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
      '  return mix(mix(hs(i),hs(i+vec2(1,0)),f.x), mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x), f.y); }',
      'float fbm(vec2 p){ float v=0.0, a=0.5;',
      '  for(int i=0;i<5;i++){ v += a*ns(p); p *= 2.03; a *= 0.5; } return v; }',
      'void main(){',
      /* A vault, not a backdrop. The old gradient was written in terms of
       * half-sphere height, which put nearly all of its range above 30 degrees -
       * and these cameras almost never look up there, so every frame got the
       * flat pale bottom of the ramp and the sky read as blank paper. Elevation
       * to a fractional power puts the gradient where the eye actually is, low
       * down, so the dome has depth from the first metre above the horizon. */
      '  float el = vDir.y;',
      '  float elc = clamp(el, 0.0, 1.0);',
      '  float t = pow(elc, 0.42);',
      '  vec3 col = mix(uHaze, uTop, t);',
      /* and it keeps deepening overhead, so there is a weight above you */
      '  col = mix(col, uTop * 0.74, pow(elc, 2.0) * 0.62);',
      /* the sun does not burn here; it soaks */
      '  float d = max(dot(normalize(vDir), normalize(uSunDir)), 0.0);',
      '  col += uSun * pow(d, 12.0) * 0.26;',
      '  col += uSun * pow(d, 2.5) * 0.045;',
      /* a light that is simply everywhere, the way an overcast noon is */
      '  col += uSun * pow(elc, 1.4) * 0.055;',
      /* a seam at the horizon so sky and sea meet without a cut - but a narrow
       * one: the old band was six degrees wide and swallowed the horizon */
      '  col = mix(col, uHaze, pow(1.0 - clamp(abs(vDir.y)*16.0,0.0,1.0), 2.0)*0.32);',
      /* --------------------------------------------------------------------
       * "Tempest roams in the pathless sky."  Two lines of this poem look like
       * a contradiction — the sky is motionless overhead, AND a tempest roams
       * it — and they are not. The stillness is what is over YOU. The tempest
       * is always somewhere else, far out, drifting along the horizon, never
       * arriving. So the storm lives in a band that never climbs past about
       * twelve degrees, and its bearing wanders forever. Look up and nothing
       * is happening. Look out and something is.
       * ------------------------------------------------------------------ */
      '  float az = atan(vDir.x, vDir.z);',
      '  float da = mod(az - uStormAz + 3.14159, 6.28318) - 3.14159;',
      '  float across = 1.0 - smoothstep(0.0, 0.78, abs(da));',
      '  float top = 0.055 + 0.265 * across;',                 /* an anvil, tallest at its heart */
      /* domain-warp the noise first, or the cloud comes out a smooth lens
       * instead of weather */
      '  vec2 q = vec2(da*3.4, el*13.0);',
      '  float warp = fbm(q*1.7 + vec2(uTime*0.010, 0.0));',
      '  float n = fbm(q + vec2(warp*1.6 + uTime*0.009, warp*1.1));',
      '  float bulge = top * (0.62 + 0.55*n);',
      '  float body = (1.0 - smoothstep(bulge*0.72, bulge, el)) * step(-0.02, el);',
      '  float mass = smoothstep(0.20, 0.62, clamp(across*1.25, 0.0, 1.0) * body);',
      /* rain hanging out of the base, straight down into the water */
      '  float base = top * 0.42;',
      '  float veil = (1.0 - smoothstep(base*0.55, base*1.5, el)) * step(-0.02, el) * clamp(across*1.3,0.0,1.0);',
      '  float streak = fbm(vec2(da*46.0, el*26.0 - uTime*0.30));',
      '  veil *= smoothstep(0.26, 0.74, streak);',
      '  col = mix(col, vec3(0.235,0.250,0.282), veil);',
      '  vec3 stormCol = mix(vec3(0.078,0.084,0.100), vec3(0.330,0.342,0.372), n*n);',
      /* a little light still gets in under the anvil, but only a little */
      '  stormCol += vec3(0.20,0.20,0.19) * pow(1.0 - clamp(el/max(top,0.001),0.0,1.0), 4.0) * 0.30;',
      '  col = mix(col, stormCol, mass * 0.96);',
      /* lightning, for whoever is standing there when it happens */
      '  float bolt = fract(sin(floor(uTime*0.62)*91.37)*43758.5453);',
      '  float flash = step(0.86, bolt) * pow(1.0 - fract(uTime*0.62), 14.0);',
      '  col += vec3(0.85,0.86,0.95) * mass * flash * 1.5;',
      '  gl_FragColor = vec4(col, 1.0);',
      '  #include <tonemapping_fragment>',
      '  #include <colorspace_fragment>',
      '}'
    ].join('\n')
  })
);
sky.frustumCulled = false;
scene.add(sky);

/* The sand paints itself in its own shader and comes out bright; the children
 * are ordinary lit meshes, and under one low sun out over the sea every child
 * facing the water was backlit into a brown cut-out that looked pasted onto
 * the beach. The sky on an overcast shore is a light source the size of the
 * sky, so: much more of it, and a little less of the sun. */
scene.add(new THREE.HemisphereLight(0xe9eff3, 0xc6b494, 1.72));
var sun = new THREE.DirectionalLight(0xfff0d8, 0.92);
sun.position.copy(SUNDIR).multiplyScalar(300);
scene.add(sun);

/* ----------------------------------------------------------------- SEA -- */
/* Restless, boisterous, and it laughs. Gerstner-ish sum of four waves, normals
 * derived analytically, foam where crests break and where the water is thin. */
var SEA_SIZE = 4200;
var seaUniforms = {
  uTime:     { value: 0 },
  uDeep:     { value: PAL.seaDeep },
  uShal:     { value: PAL.seaShal },
  uSky:      { value: PAL.skyHaze },
  uSunDir:   { value: SUNDIR },
  uSunCol:   { value: PAL.sun },
  uFogCol:   { value: FOG },
  uFogNear:  { value: 900 },
  uFogFar:   { value: 5200 },
  uStormAz:  { value: Math.PI }
};
/* One source of truth for the wave field. The GLSL below is generated from
 * these numbers, and seaHeightJS() reads the same array, so the shader and the
 * things floating on the water can never drift apart again.
 *
 * Calibrated to a shore break, roughly a metre of face. The previous values ran
 * to an 8.5m trough-to-crest range at the break line, and the result was the
 * opposite of dramatic: a 1.6m crest six metres from a 1.7m eye is a wall seen
 * edge-on, and it flattens into a featureless sheet that hides every wave
 * behind it. A wave you can see over is a wave you can see.
 *   dir x, dir z, amplitude (m), wavelength (m) */
var WAVES = [
  [ 0.00, -1.00, 0.86, 42.0],
  [ 0.26, -0.97, 0.43, 23.0],
  [-0.19, -0.98, 0.23, 12.5],
  [ 0.44, -0.90, 0.12,  6.2]
];
var WAVE_SPEED = 0.62;   // sets the rhythm: the big swell arrives every ~8.5s
var WAVE_STEEP = 1.20;   // horizontal Gerstner pull — this is what rears the face up

/* shoal(): the whole difference between a swell and a breaker. A wave that
 * feels the bottom does not fade out politely; it slows, stacks up on itself,
 * rears, and falls over.
 *
 * Round 12 moved the rearing in and split it in two. One broad hump fourteen
 * metres out reads, from the sand, as a wide pale shelf — which is exactly the
 * "glassy lagoon" every critic has complained about. Two narrow break lines,
 * one ten metres off the wet sand and one thirty out, give the eye-level view
 * a near wall of water with a second roller stacked behind it, which is what
 * a restless sea looks like from a beach. The near one is tall enough to come
 * up past a standing child's head. */
var SHOAL_GLSL = [
  /* Where a wave feels the bottom depends on the bottom, and no beach has a
   * bottom that is the same all the way along it. The bar wanders, so the
   * break line wanders with it: one stretch of shore is rearing while the next
   * has already fallen over and the one after that is still flat. Without this
   * the whole endless coast breaks in the same instant, and any frozen frame
   * catches either a wall of white everywhere or a lagoon everywhere. */
  'float breakAt(float x){',
  '  return 10.5 + 3.2 * sin(x * 0.0455) + 1.7 * sin(x * 0.0171 + 2.1);',
  '}',
  'float shoal(float d, float x){',
  '  float runUp = smoothstep(-1.0, 5.0, d);',
  '  float deep  = mix(0.55, 1.0, smoothstep(0.0, 80.0, d));',
  /* Keep the amplification honest. Push it much past this and the Gerstner
   * pull folds the surface over itself and the slope term saturates. */
  '  float rear  = 1.0 + 2.45 * exp(-pow((d - breakAt(x)) / 3.8, 2.0))',
  '                    + 0.95 * exp(-pow((d - 29.0) / 8.0, 2.0));',
  '  return runUp * deep * rear;',
  '}'
].join('\n');

var WAVE_GLSL = (function () {
  var out = ['const float WSPEED = ' + WAVE_SPEED.toFixed(3) + ';',
             'const float WSTEEP = ' + WAVE_STEEP.toFixed(3) + ';'];
  WAVES.forEach(function (w, i) {
    var L = Math.hypot(w[0], w[1]);
    out.push('const vec4 W' + i + ' = vec4(' +
      (w[0] / L).toFixed(4) + ', ' + (w[1] / L).toFixed(4) + ', ' +
      w[2].toFixed(3) + ', ' + w[3].toFixed(2) + ');');
  });
  out.push(SHOAL_GLSL);
  out.push('float wavePhase(vec4 w, vec2 p, float t){');
  out.push('  float k = 6.28318 / w.w;');
  out.push('  return k * dot(w.xy, p) - sqrt(9.8 / k) * k * t * WSPEED;');
  out.push('}');
  /* One pass over the wave field that hands back height, the analytic surface
   * slope, and the full Gerstner displacement at once. It replaces the five
   * finite-difference evaluations the vertex stage used to do and the four the
   * fragment stage did per pixel — which is the difference between this scene
   * being renderable in software and not. Sampled in UNDISPLACED coordinates,
   * which is where the height field is actually defined. */
  /* White water does not blink out the instant the wave that made it moves on.
   * Foam as a pure function of the current phase left the surf zone empty most
   * of the time - one roller every 8.4 seconds - so any frozen frame was likely
   * to catch flat water. This jumps to 1 as the crest topples and thins over the
   * rest of the cycle. */
  out.push('float foamTrail(vec4 w, vec2 p, float t){');
  out.push('  float u = fract((wavePhase(w, p, t) - 0.85) / 6.28318);');
  out.push('  return exp(-u * 1.70);');
  out.push('}');
  out.push('void seaField(vec2 p, float t, out float h, out vec2 dh, out vec3 disp){');
  out.push('  float d = -p.y;');
  out.push('  float f = shoal(d, p.x);');
  out.push('  float fz = shoal(d - 0.5, p.x) - shoal(d + 0.5, p.x);');
  out.push('  float H = 0.0; vec2 dH = vec2(0.0); vec2 pull = vec2(0.0);');
  WAVES.forEach(function (w, i) {
    out.push('  { float k = 6.28318 / W' + i + '.w;');
    out.push('    float ph = k * dot(W' + i + '.xy, p) - sqrt(9.8 / k) * k * t * WSPEED;');
    out.push('    float sn = sin(ph), cs = cos(ph);');
    out.push('    H += W' + i + '.z * sn;');
    out.push('    dH += W' + i + '.z * k * W' + i + '.xy * cs;');
    out.push('    pull += W' + i + '.xy * (W' + i + '.z * WSTEEP * cs); }');
  });
  out.push('  h = H * f;');
  out.push('  dh = dH * f; dh.y += fz * H;');
  /* the horizontal term is what sharpens a crest into a face instead of
   * leaving it a rounded hump */
  out.push('  disp = vec3(pull.x * f, h, pull.y * f);');
  out.push('}');
  return out.join('\n');
})();

/* The sea used to be a uniform 620x620 grid over 4200 metres: one vertex every
 * 6.8 metres. The wave trains are 6.2 and 12.5 metres long, so in the surf zone
 * — the only part of this sea anybody ever stands next to — the grid could not
 * carry them at all, and every roller arrived at the beach already flattened
 * into a coloured band. Six rounds of critics wrote "the sea is a pastel
 * plane", and this grid is why.
 *
 * So the rows are no longer evenly spaced. Depth grows roughly as the cube of
 * the row index: quarter-metre rows in the surf, three-metre rows a hundred
 * metres out, tens of metres at the horizon where one pixel covers a whole
 * wavelength anyway. Fewer vertices than before, all of them spent where the
 * eye actually is. */
var seaGeo = (function () {
  var NX = 700, NZ = 420, pos = [], idx = [], i, j;
  for (j = 0; j <= NZ; j++) {
    var v = j / NZ;
    /* 0.3m rows at the water's edge, 0.8m where it breaks, 7m six hundred
     * metres out — still finer out there than the old uniform 6.8m grid, so
     * nothing is lost at distance to pay for the surf. */
    var z = 30 - SEA_SIZE * (0.03 * v + 0.97 * Math.pow(v, 2.2));
    for (i = 0; i <= NX; i++) pos.push(-SEA_SIZE / 2 + SEA_SIZE * (i / NX), 0, z);
  }
  /* Rows run seaward, so z DECREASES with j: winding the quads the same way a
   * PlaneGeometry does would face them at the sea bed and the whole ocean gets
   * back-face culled — leaving the sky dome showing through where the water is,
   * which looks enough like a pale flat sea to waste an afternoon on. */
  for (j = 0; j < NZ; j++) for (i = 0; i < NX; i++) {
    var a = j * (NX + 1) + i, b = a + NX + 1;
    idx.push(a, a + 1, b, a + 1, b + 1, b);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
})();
var sea = new THREE.Mesh(seaGeo, new THREE.ShaderMaterial({
  uniforms: seaUniforms,
  vertexShader: [
    'uniform float uTime; varying vec3 vW; varying vec2 vP0; varying float vFoam;',
    WAVE_GLSL,
    'void main(){',
    '  vec4 wp0 = modelMatrix * vec4(position, 1.0);',
    '  vec2 p0 = wp0.xz;',
    '  vP0 = p0;',
    '  float h; vec2 dh; vec3 disp;',
    '  seaField(p0, uTime, h, dh, disp);',
    '  vec3 wp = wp0.xyz + disp;',
    '  float d = -p0.y;',
    /* Inshore of the swash the wave field is damped to nothing, so the water
     * plane and the sand ramp lie within a few millimetres of each other for
     * tens of metres and the depth buffer cannot separate them. With the new
     * quarter-metre rows that showed up as a stack of hard stripes across the
     * wet sand. Sink the water under the beach where it no longer has any
     * height of its own; the run-up is painted by the sand shader anyway. */
    '  wp.y -= 0.34 * smoothstep(2.0, -4.0, d);',
    /* foam has three sources: crests that are genuinely toppling, the band
     * where the shoaling wave is breaking, and the sheet of white left on the
     * sand behind it */
    '  float slope = length(dh);',
/* The old 6.8-metre grid sampled this test about four times across the whole
 * surf zone, so most crests were simply never seen and the water came out
 * glassy. On the new grid every crest is found — and with the old thresholds
 * that turned the entire zone into one sheet of white. Foam is the toppling
 * top of a wave and nothing else, so both thresholds move up to where a wave
 * is genuinely falling over. */
    '  float crest = smoothstep(0.55, 1.25, disp.y) * smoothstep(0.26, 0.62, slope);',
    /* two trains of different period break at different distances, so there is
     * always white water somewhere in the surf zone */
    '  float outer = exp(-pow((d - 28.0) / 8.0, 2.0));',
    '  float inner = exp(-pow((d - 10.0) /  5.5, 2.0));',
/* Round 12: the surf zone had been pushed so white that the sea read as a
 * bank of fog with a beach in front of it. White water is the TOP of a wave,
 * not the wave; the wave is the dark green wall underneath it. So: much less
 * foam, concentrated where a crest is actually toppling. */
/* A shore break is never clean. Even between rollers the water over the bar is
 * aerated and white, so each break line carries a standing band of foam that
 * does not depend on the phase, plus the bright pulse of the crest going over.
 * Without the standing part a frozen frame can catch the surf between waves
 * and the sea looks like a lagoon. */
    '  float surf = outer * (0.26 + 0.52 * foamTrail(W0, p0, uTime))',
    '             + inner * (0.40 + 0.80 * foamTrail(W1, p0, uTime));',
    /* the sheet at the very edge advances and retreats on the same surge the
     * sand paints its swash from, so the two agree about where the water is */
    '  float surge = pow(max(sin(uTime*0.735 + p0.x*0.021), 0.0), 0.70);',
    '  float wash = smoothstep(1.2 + 3.4*surge, -1.2, d) * 0.42;',
    '  vFoam = clamp(crest + surf + wash, 0.0, 1.0);',
    '  vW = wp;',
    '  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);',
    '}'
  ].join('\n'),
  fragmentShader: [
    'uniform vec3 uDeep,uShal,uSky,uSunDir,uSunCol,uFogCol; uniform float uFogNear,uFogFar,uTime,uStormAz;',
    'float hw(vec2 p){ return fract(sin(dot(p, vec2(41.7, 289.1)))*43758.5453); }',
    'float nw(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
    '  return mix(mix(hw(i),hw(i+vec2(1,0)),f.x), mix(hw(i+vec2(0,1)),hw(i+vec2(1,1)),f.x), f.y); }',
    'varying vec3 vW; varying vec2 vP0; varying float vFoam;',
    WAVE_GLSL,
    'void main(){',
    '  float dist = length(cameraPosition - vW);',
    '  float lod = clamp(dist / 300.0, 0.0, 1.0);',
    /* normals come from the UNDISPLACED domain, which is where the height
     * field is actually defined; sampling at the displaced position was an
     * approximation that got worse the steeper the waves became */
    '  float h; vec2 dh; vec3 disp;',
    '  seaField(vP0, uTime, h, dh, disp);',
    '  vec3 n = normalize(vec3(-dh.x, 1.0, -dh.y));',
    /* flatten the normal with distance: near the horizon one pixel covers many
     * wavelengths, and keeping the detail there only produces moire */
    '  n = normalize(mix(n, vec3(0.0,1.0,0.0), lod * lod * 0.80));',
    '  vec3 v = normalize(cameraPosition - vW);',
    '  float depth = clamp((-vP0.y) / 210.0, 0.0, 1.0);',
    '  vec3 base = mix(uShal, uDeep, pow(depth, 0.55));',
    /* a breaking wave is lit through: the thin water at the crest glows */
    '  float thin = smoothstep(0.35, 1.25, vW.y) * pow(max(dot(-v, normalize(uSunDir)), 0.0) * 0.5 + 0.5, 2.0);',
    '  base += vec3(0.10, 0.26, 0.24) * thin;',
    /* A breaking wave has a face, and the face is in its own shadow: it leans
     * away from the light and the water behind it is deep. Without this the
     * swell had no volume, and white spray in front of a white sky had nothing
     * to be seen against. */
    '  float steep = smoothstep(0.20, 0.78, length(dh));',
    '  float face = steep * smoothstep(-0.2, 0.9, disp.y);',
    '  base *= 1.0 - 0.60 * face;',
    '  base = mix(base, uDeep * 0.66, steep * 0.46);',
    '  float fres = pow(1.0 - max(dot(n, v), 0.0), 4.2);',
    '  vec3 refl = uSky * 0.80 + vec3(0.03, 0.05, 0.07);',
    '  vec3 col = mix(base, refl, clamp(fres*0.62, 0.0, 0.46));',
    '  vec3 hv = normalize(normalize(uSunDir) + v);',
    '  col += uSunCol * pow(max(dot(n, hv), 0.0), 190.0) * 1.35;',
    '  col += uSunCol * pow(max(dot(n, hv), 0.0), 18.0) * 0.10;',
    '  float foam = clamp(vFoam, 0.0, 1.0) * (1.0 - lod * 0.78);',
    /* Foam is not paint. It sits ON the water and is lit by the same light, so
     * it has to keep the shading underneath it - otherwise every wave it covers
     * flattens into a white shelf, which is exactly what was happening. And it
     * is made of bubbles, so it breaks up rather than covering evenly. */
    '  float ftex = nw(vP0 * 1.7) * 0.50 + nw(vP0 * 5.5) * 0.32 + nw(vP0 * 17.0) * 0.18;',
    '  foam = smoothstep(0.36, 0.90, foam * 0.75 + ftex * foam);',
    '  float lam = max(dot(n, normalize(uSunDir)), 0.0);',
    '  vec3 foamCol = vec3(0.97,0.97,0.95) * (0.58 + 0.50 * lam);',
    '  col = mix(col, foamCol, foam * 0.90);',
    '  float fa = atan(vW.x - cameraPosition.x, vW.z - cameraPosition.z);',
    '  float dda = mod(fa - uStormAz + 3.14159, 6.28318) - 3.14159;',
    '  float under = (1.0 - smoothstep(0.10, 0.70, abs(dda))) * smoothstep(320.0, 1500.0, dist);',
    '  col = mix(col, col * vec3(0.44, 0.47, 0.56), under * 0.80);',
    '  col = mix(col, uFogCol, smoothstep(uFogNear, uFogFar, dist));',
    '  gl_FragColor = vec4(col, 1.0);',
    '  #include <tonemapping_fragment>',
    '  #include <colorspace_fragment>',
    '}'
  ].join('\n')
}));
sea.position.set(0, 0, 0);   // the rows already carry their own world z
sea.frustumCulled = false;
scene.add(sea);

/* ---------------------------------------------------------------- SAND -- */
/* The beach runs along +X and -X without end; the sea is at -Z.
 * A gentle ramp down into the water, a darker wet band the tide keeps polished. */
var SAND_W = 4200, SAND_D = 1000;
var TAU = Math.PI * 2;
function sandHeight(x, z) {
  // z = 0 is the waterline; +z walks inland and rises, -z is the shelf going under
  // seaward the bottom must fall faster than the waves trough: the deepest
  // deepest trough is under 2m at the break line, so 0.55/m clears it
  var ramp = z > 0 ? z * 0.030 : z * 0.55;
  var dune = Math.max(0, z - 120) * 0.055;
  // periods of 80m / 400m / 20m all divide the 400m re-tile step, so the shore
  // can repeat forever without the dunes jumping under your feet
  var ripple = Math.sin(x * (TAU / 80)) * 0.07 + Math.sin(x * (TAU / 400) + z * 0.02) * 0.14
             + Math.sin(x * (TAU / 25) + z * 0.31) * 0.035;
  var grain = Math.sin(x * (TAU / 20) + z * 0.17) * 0.012;
  return ramp + dune + ripple * Math.min(1, Math.max(0, z) / 26) + grain;
}
var sandGeo = new THREE.PlaneGeometry(SAND_W, SAND_D, 520, 150);
sandGeo.rotateX(-Math.PI / 2);
(function shapeSand() {
  var pos = sandGeo.attributes.position, off = SAND_D / 2 - 160; // 160m of shelf under the water
  for (var i = 0; i < pos.count; i++) {
    var x = pos.getX(i), z = pos.getZ(i) + off;
    pos.setZ(i, z);
    pos.setY(i, sandHeight(x, z));
  }
  sandGeo.computeVertexNormals();
})();
var sandUniforms = {
  uSand:    { value: PAL.sand },
  uWet:     { value: PAL.sandWet },
  uTime:    { value: 0 },
  uSunDir:  { value: SUNDIR },
  uFogCol:  { value: FOG },
  uFogNear: { value: 420 },
  uFogFar:  { value: 2800 }
};
var sand = new THREE.Mesh(sandGeo, new THREE.ShaderMaterial({
  uniforms: sandUniforms,
  vertexShader: [
    'varying vec3 vW; varying vec3 vN;',
    'void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; vN = normalize(normalMatrix*normal);',
    '  gl_Position = projectionMatrix*viewMatrix*wp; }'
  ].join('\n'),
  fragmentShader: [
    'uniform vec3 uSand,uWet,uSunDir,uFogCol; uniform float uTime,uFogNear,uFogFar;',
    'varying vec3 vW; varying vec3 vN;',
    'float hash(vec2 p){ return fract(sin(dot(p, vec2(41.7, 289.1)))*43758.5453); }',
    'float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }',
    'float surgeAt(float x, float t){',
    '  return pow(max(sin(t*0.735 + x*0.021), 0.0), 0.70);',
    '}',
    'float swashEdge(float x, float t){',
    '  return 2.6 + 5.4*surgeAt(x, t) + 1.0*sin(t*0.29 - x*0.0145);',
    '}',
/* ------------------------------------------------------------------
 * The sand mesh is 520x150 quads over 4200x1000 metres: one vertex every
 * eight metres. The ripple terms in sandHeight have periods of twenty and
 * twenty-five metres, so sampling them at the vertices aliases them into
 * enormous smooth lumps, and the interpolated vertex normal then shades
 * those lumps as ten-metre dark lenses lying on an otherwise flat beach.
 * One of them sat in the middle of the child-height camera for ten rounds.
 *
 * So the shading normal is not interpolated any more: it is the analytic
 * derivative of the same height field, evaluated per pixel. That kills the
 * lenses, and it also lets the sand finally have a surface - wind ripples
 * at half a metre, which no vertex grid this size could ever carry.
 * ------------------------------------------------------------------ */
    'const float TAU = 6.2831853;',
    'vec3 sandNormal(vec2 p, float ripAmp){',
    '  float x = p.x, z = p.y;',
    '  float lift = clamp(z/26.0, 0.0, 1.0);',
    '  float dLift = (z > 0.0 && z < 26.0) ? (1.0/26.0) : 0.0;',
    '  float r1 = sin(x*(TAU/80.0))*0.07;',
    '  float r2 = sin(x*(TAU/400.0) + z*0.02)*0.14;',
    '  float r3 = sin(x*(TAU/25.0) + z*0.31)*0.035;',
    '  float ripple = r1 + r2 + r3;',
    '  float dRx = cos(x*(TAU/80.0))*0.07*(TAU/80.0)',
    '            + cos(x*(TAU/400.0) + z*0.02)*0.14*(TAU/400.0)',
    '            + cos(x*(TAU/25.0) + z*0.31)*0.035*(TAU/25.0);',
    '  float dRz = cos(x*(TAU/400.0) + z*0.02)*0.14*0.02',
    '            + cos(x*(TAU/25.0) + z*0.31)*0.035*0.31;',
    '  float dx = dRx*lift + cos(x*(TAU/20.0) + z*0.17)*0.012*(TAU/20.0);',
    '  float dz = dRz*lift + ripple*dLift + cos(x*(TAU/20.0) + z*0.17)*0.012*0.17',
    '           + (z > 0.0 ? 0.030 : 0.55) + (z > 120.0 ? 0.055 : 0.0);',
    /* wind ripples: too fine for any vertex grid, and the only thing that has
     * ever made this sand read as a surface rather than as a gradient */
    '  float a = 0.0030 * ripAmp;',
    '  dx += cos(x*7.3 + z*2.1)*a*7.3 + cos(x*2.2 - z*9.4)*a*0.55*2.2;',
    '  dz += cos(x*7.3 + z*2.1)*a*2.1 - cos(x*2.2 - z*9.4)*a*0.55*9.4;',
    '  return normalize(vec3(-dx, 1.0, -dz));',
    '}',
    'void main(){',
    '  float g = noise(vW.xz*2.6)*0.5 + noise(vW.xz*11.0)*0.26 + noise(vW.xz*46.0)*0.14;',
    /* ------------------------------------------------------------------
     * "pale gleams the smile of the sea beach."
     *
     * A beach does not have a wet part and a dry part. It has a band that the
     * last wave reached and left behind, mirror-bright while the film of water
     * is still on it, dulling as it drains. So instead of asking "is this point
     * under the water line", we ask "how long ago did the water last reach it",
     * by walking the swash back through the past few seconds. That gives a
     * bright leading edge with a fading apron behind it, which is the smile.
     * ---------------------------------------------------------------- */
    '  float edge = swashEdge(vW.x, uTime);',
    /* how recently the water last stood here: 1 = still wet, 0 = long dry */
    '  float wet = 0.0;',
    '  for (int i = 0; i < 8; i++) {',
    '    float back = float(i) * 1.05;',
    '    float reach = smoothstep(swashEdge(vW.x, uTime - back) + 0.45,',
    '                             swashEdge(vW.x, uTime - back) - 0.45, vW.z);',
    '    wet = max(wet, reach * (1.0 - back / 9.5));',
    '  }',
    '  wet = clamp(wet + (1.0 - smoothstep(0.0, 1.6, vW.z)) * 0.35, 0.0, 1.0);',
    /* the swash irons the sand it covers flat, and at a grazing angle the
     * fresnel term multiplies any ripple left there into hard stripes */
    '  vec3 n = sandNormal(vW.xz, 1.0 - 0.92 * wet);',
    '  vec3 col = mix(uSand, uWet, wet * 0.88);',
    '  col *= 0.80 + g*0.44;',
    '  vec3 v = normalize(cameraPosition - vW);',
    /* wet sand at a grazing angle is a mirror, and what it mirrors is the sky */
    '  float fres = pow(1.0 - max(dot(n, v), 0.0), 3.4);',
    '  vec3 sheen = vec3(0.855, 0.872, 0.892);',
    '  col = mix(col, sheen, clamp(fres * pow(wet, 0.85) * 0.95, 0.0, 0.76));',
    '  float lam = max(dot(n, normalize(uSunDir)), 0.0);',
    '  col *= 0.68 + lam*0.58;',
    /* the thin lace at the top of each run-up, where the water gives out */
    '  float lace = smoothstep(1.1, 0.0, abs(vW.z - edge)) * smoothstep(0.0, 1.0, vW.z);',
    '  col = mix(col, vec3(0.965,0.965,0.945), lace * 0.85);',
    '  float sp = step(0.9975, hash(floor(vW.xz*26.0)));',
    '  col = mix(col, vec3(0.95,0.93,0.88), sp*(1.0-wet)*0.45);',
    '  float d = length(cameraPosition - vW);',
    '  col = mix(col, uFogCol, smoothstep(uFogNear, uFogFar, d));',
    '  gl_FragColor = vec4(col,1.0);',
    '  #include <tonemapping_fragment>',
    '  #include <colorspace_fragment>',
    '}'
  ].join('\n')
}));
sand.frustumCulled = false;
scene.add(sand);

/* -------------------------------------------------------------- SPRAY -- */
/* "The sea surges up with laughter."
 *
 * Every frame of this world had empty air in it. A wave that breaks and throws
 * nothing is a wave you have to be told about; the spray is the part you can
 * actually see from the sand. Each puff is launched when the crest at its own
 * stretch of shore topples - the same wave phase the foam uses, so the spray
 * and the white water belong to the same wave - then follows a plain ballistic
 * arc and fades. No simulation state: position is a pure function of (which
 * stretch of shore, what time), so the fixed cameras see the same spray every
 * time they are pointed here. */

function wavePhaseJS(w, x, z, t) {
  var L = Math.hypot(w[0], w[1]), k = 6.28318 / w[3];
  return k * ((w[0] / L) * x + (w[1] / L) * z) - Math.sqrt(9.8 / k) * k * t * WAVE_SPEED;
}
/* Spray timing runs off the OBLIQUE train, not the head-on one. W0 travels
 * straight at the beach, so its phase does not vary along x at all: every
 * metre of shore breaks in the same instant, and spray was therefore either
 * everywhere or nowhere - and at the frozen instant, nowhere. W1 comes in at
 * an angle, so the break runs along the shore the way a real one does. */
var SPRAY_WAVE = WAVES[1];
var SPRAY_PERIOD = (function () {
  var k = 6.28318 / SPRAY_WAVE[3];
  return 6.28318 / (Math.sqrt(9.8 / k) * k * WAVE_SPEED);
})();

var SPRAY_CELLS = 150, SPRAY_PER_CELL = 8, SPRAY_TILE = 240;
var SPRAY_N = SPRAY_CELLS * SPRAY_PER_CELL;
var SPRAY_LIFE = 1.70, SPRAY_Z = -13.0;

var sprayTex = (function () {
  var c = document.createElement('canvas'); c.width = c.height = 64;
  var x = c.getContext('2d');
  var g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,0.95)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.40)');

})();

var sprayGeo = new THREE.PlaneGeometry(1, 1);

  transparent: true, depthWrite: false,
  vertexShader: [
    'attribute float aOpacity; varying float vO; varying vec2 vUv;',
    'void main(){ vO = aOpacity; vUv = uv;',
    '  gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0); }'
  ].join('\n'),
  fragmentShader: [
    'uniform sampler2D uMap; varying float vO; varying vec2 vUv;',
    'void main(){',
    '  float a = texture2D(uMap, vUv).a * vO;',

iSpray.count = 0;

function updateSpray(t, camX) {
  var n = 0;
  var cell = SPRAY_TILE / SPRAY_CELLS;
  var x0 = Math.round(camX / SPRAY_TILE) * SPRAY_TILE - SPRAY_TILE / 2;
  for (var c = 0; c < SPRAY_CELLS; c++) {
    var x = x0 + (c + 0.5) * cell;
    /* seconds since the crest at this stretch of shore toppled */
    var zc = SPRAY_Z + 3.0 - h1(c * 1.31) * 6.8;
    var u = wavePhaseJS(SPRAY_WAVE, x, zc, t) / 6.28318
          + 0.13 * Math.sin(x * 0.09) + 0.21 * Math.sin(x * 0.031 + 1.7)
          + 0.08 * Math.sin(x * 0.27);
    u = u - Math.floor(u);
    var age = u * SPRAY_PERIOD;
    if (age > SPRAY_LIFE) continue;
    var surf = seaHeightJS(x, zc, t);
    for (var k = 0; k < SPRAY_PER_CELL; k++) {
      var j = c * SPRAY_PER_CELL + k;
      var vy = 4.4 + h1(j * 1.7) * 4.6;
      var vz = 1.2 + h1(j * 2.9 + 5) * 2.4;      // carried shoreward as it flies
      var jx = (h1(j * 4.1 + 11) - 0.5) * cell * 2.4;
      var y = surf + 0.35 + vy * age - 4.9 * age * age;
      var gy = -0.15;
      if (y < gy) continue;                       // it has fallen back into the sea
      _dummy.position.set(x + jx, y, zc + vz * age);
      _dummy.quaternion.copy(camera.quaternion);  // face the eye
      var grow = 0.60 + age * 1.70 + h1(j * 3.3 + 2) * 0.70;
      _dummy.scale.set(grow, grow, grow);
      _dummy.updateMatrix();
      iSpray.setMatrixAt(n, _dummy.matrix);
      sprayOpacity.array[n] = Math.max(0, 1 - age / SPRAY_LIFE) * 0.95;
      n++;
    }
  }
  iSpray.count = n;
  iSpray.instanceMatrix.needsUpdate = true;
  sprayOpacity.needsUpdate = true;
}

/* ------------------------------------------------------------- WRECKS -- */
/* "ships get wrecked in the trackless water, death is abroad and children play."
 * The children never look at these. That is the whole point of the poem, so the
 * wrecks sit far out where you have to choose to look for them. */

/* The JS side of the same wave field. It reads WAVES and mirrors shoal(), so
 * anything floated on the water sits on the surface the shader actually draws.
 * (It carries only the vertical term; the horizontal Gerstner pull moves a
 * floating thing sideways by under a metre, which nothing here would notice.) */
function seaHeightJS(x, z, t) {
  var d = -z;
  var ru = Math.min(1, Math.max(0, (d + 1.0) / 6.0));   // smoothstep(-1.0, 5.0, d)
  var runUp = ru * ru * (3 - 2 * ru);
  var dp = Math.min(1, Math.max(0, d / 80));
  var deep = 0.55 + 0.45 * (dp * dp * (3 - 2 * dp));
  /* MUST stay identical to breakAt()/shoal() in SHOAL_GLSL: this mirror is what
   * floats the leaf boats and the wrecks. When it drifts from the shader, the
   * boats sail under the water. */
  var brk = 10.5 + 3.2 * Math.sin(x * 0.0455) + 1.7 * Math.sin(x * 0.0171 + 2.1);
  var rear = 1 + 2.45 * Math.exp(-Math.pow((d - brk) / 3.8, 2))
               + 0.95 * Math.exp(-Math.pow((d - 29.0) / 8.0, 2));
  var f = runUp * deep * rear;
  var h = 0;
  for (var i = 0; i < WAVES.length; i++) {
    var w = WAVES[i], L = Math.hypot(w[0], w[1]);
    var k = 6.28318 / w[3];
    h += w[2] * Math.sin(k * ((w[0] / L) * x + (w[1] / L) * z) - Math.sqrt(9.8 / k) * k * t * WAVE_SPEED);
  }
  return h * f;
}

/* a hull as a parametric U-section that tapers to a prow and stops, torn off,
 * partway down its own length */
function hullGeometry(len, beam, depth, uEnd) {
  var NU = 26, NT = 14, pos = [], idx = [];
  function half(u) { return (beam / 2) * Math.pow(Math.sin(Math.PI * Math.min(u, 0.999)), 0.62); }
  function dep(u) { return depth * (0.34 + 0.66 * Math.pow(Math.sin(Math.PI * Math.min(u, 0.999)), 0.5)); }
  for (var i = 0; i <= NU; i++) {
    var u = (i / NU) * uEnd;
    for (var j = 0; j <= NT; j++) {
      var t = -1 + 2 * (j / NT);
      pos.push(half(u) * t, -dep(u) * (1 - t * t), len * (u - 0.5));
    }
  }
  for (i = 0; i < NU; i++) for (var j2 = 0; j2 < NT; j2++) {
    var a = i * (NT + 1) + j2, b = a + NT + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return { geo: g, half: half, dep: dep };
}

var WOOD = new THREE.MeshLambertMaterial({ color: 0x4a3f33, side: THREE.DoubleSide });
var WOOD_DARK = new THREE.MeshLambertMaterial({ color: 0x332c24 });

function buildWreck(len, list) {
  var w = new THREE.Object3D();
  var h = hullGeometry(len, len * 0.20, len * 0.135, 0.64);
  var hull = new THREE.Mesh(h.geo, WOOD);
  w.add(hull);

  /* the ribs the missing stern left behind */
  for (var i = 0; i < 5; i++) {
    var u = 0.645 + i * 0.048;
    var hb = h.half(u), dp = h.dep(u), reach = 1 - i * 0.16;
    var pts = [];
    for (var k = 0; k <= 8; k++) {
      var t = -reach + 2 * reach * (k / 8);
      pts.push(new THREE.Vector3(hb * t, -dp * (1 - t * t), len * (u - 0.5)));
    }
    var rib = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, len * 0.009, 5, false), WOOD_DARK);
    w.add(rib);
  }

  /* a mast snapped off short, and the spar still hanging from it */
  var mast = new THREE.Mesh(new THREE.CylinderGeometry(len * 0.007, len * 0.013, len * 0.52, 7), WOOD_DARK);
  mast.position.set(0, len * 0.20, -len * 0.10);
  mast.rotation.z = 0.62; mast.rotation.x = -0.17;
  w.add(mast);
  var spar = new THREE.Mesh(new THREE.CylinderGeometry(len * 0.005, len * 0.006, len * 0.30, 6), WOOD_DARK);
  spar.position.set(-len * 0.14, len * 0.30, -len * 0.10);
  spar.rotation.z = Math.PI / 2 - 0.35; spar.rotation.y = 0.5;
  w.add(spar);

  /* torn canvas, still caught on the spar */
  var sailGeo = new THREE.PlaneGeometry(len * 0.26, len * 0.30, 7, 7);
  (function tear() {
    var p = sailGeo.attributes.position;
    for (var v = 0; v < p.count; v++) {
      var sx = p.getX(v), sy = p.getY(v);
      var slack = (1 - Math.abs(sx) / (len * 0.13)) * (0.5 - sy / (len * 0.30));
      p.setZ(v, Math.sin(sx * 1.4) * len * 0.02 * slack);
      /* the lower corner is gone */
      if (sy < -len * 0.06 && sx > len * 0.03) p.setY(v, sy + (sx / (len * 0.13)) * len * 0.09);
    }
    sailGeo.computeVertexNormals();
  })();
  var sail = new THREE.Mesh(sailGeo, CANVAS_MAT);
  sail.position.set(-len * 0.16, len * 0.17, -len * 0.105);
  sail.rotation.set(0.2, 0.55, -0.3);
  w.add(sail);

  w.userData.len = len;
  scene.add(w);
  list.push(w);
  return w;
}

/* Three of them, re-tiled along an endless shore with a long period so a wreck
 * never pops into being anywhere near you. */
var WRECK_PERIOD = 3000;
var wrecks = [];
var WRECK_SPOTS = [
  { x: -105, z: -385,  len: 44, list: 0.52, yaw: 0.9,  sink: 1.05 },
  { x:  420, z: -880,  len: 46, list: -0.70, yaw: -2.1, sink: 0.55 },
  { x: -760, z: -1650, len: 52, list: 0.34, yaw: 1.9,  sink: 0.20 }
];
WRECK_SPOTS.forEach(function (sp) { sp.obj = buildWreck(sp.len, wrecks); });

function updateWrecks(t, camX) {
  for (var i = 0; i < WRECK_SPOTS.length; i++) {
    var sp = WRECK_SPOTS[i], o = sp.obj;
    var x = sp.x + Math.round((camX - sp.x) / WRECK_PERIOD) * WRECK_PERIOD;
    var bob = seaHeightJS(x, sp.z, t + i * 7.0);
    o.position.set(x, sp.sink + bob * 0.55, sp.z);
    /* it does not sail; it is worked on by the water */
    o.rotation.set(Math.sin(t * 0.21 + i) * 0.035, sp.yaw, sp.list + Math.sin(t * 0.17 + i * 2.1) * 0.045);
  }
}

/* ------------------------------------------------------------ CHILDREN -- */
/* "On the seashore of endless worlds children meet." They are the subject of
 * the poem, so they are the subject of the world: everything else here is the
 * room they are playing in.
 *
 * Three rules shape this code:
 *   - they MEET. Not scattered evenly along the sand — gathered into knots,
 *     mostly facing each other.
 *   - they never enter the water. Every child is clamped landward of the
 *     waterline, because "they know not how to swim".
 *   - where they stand must be DETERMINISTIC. A child's position comes from a
 *     hash of which group it belongs to, never from runtime randomness, so the
 *     six fixed cameras frame the same children in round 2 and round 9. */

function groundY(x, z) { return sandHeight(x, Math.max(z, 0.2)); }

var TAU2 = Math.PI * 2;
function h1(n) { var v = Math.sin(n * 127.1) * 43758.5453; return v - Math.floor(v); }
function h2(a, b) { return h1(a * 311.7 + b * 269.5 + 0.7); }

/* "On the seashore of endless worlds is the great meeting of children." A
 * meeting is crowded. Until round 11 the knots were sixteen metres apart and
 * the pool ran out after forty of them, so the shore read as a thin queue with
 * a lot of empty sand around it. */
var GROUP_SPAN = 11;     // metres of shore between one gathering and the next
var CHILD_RANGE = 430;   // how far down the shore children are drawn
var POOL = 560;          // instances held ready; groups are mapped into it each frame

var SKIN  = [0x9a7051, 0xb08a64, 0xc29a71, 0x845a3f, 0xbe9469];
var CLOTH = [0xf0ece1, 0xc95a4e, 0x4a6fa5, 0xe0b04a, 0xf6f4ee, 0x7a9e7e, 0xd8d3c4, 0xb0553f];
var HAIR  = [0x33271d, 0x40311f, 0x2a211a, 0x4c3a25, 0x372a1e];

/* ------------------------------------------------------ THE CHILD FIGURE -- */
/* Round 11 threw the old figure away. Until then a child was a cylinder with a
 * big ball on top: close up the head was a third of the body, and at a hundred
 * metres the whole thing read as a skittle. What makes a small figure read as a
 * CHILD rather than as a post is its outline, so the outline is what this
 * geometry and this skeleton are for:
 *
 *   - 4.5 heads tall instead of 3.5. Still child proportions — big head, short
 *     legs — but no longer a lollipop.
 *   - a neck, so the head is carried instead of stacked.
 *   - dark hair as its own cap. It gives the head a shape and a facing, and it
 *     is the one high-contrast mark on a child that survives to the horizon.
 *   - KNEES AND ELBOWS. The old rig had neither, so a squatting child shot both
 *     legs straight out in front of it and reached for the sand with a plank.
 *     A limb that can only pivot at its root does not read as a limb.
 *   - a spine the head and the shoulders hang from, not just a leaning tunic.
 *     When a child bends over its sandcastle, its head and arms go with it.
 *   - hands and feet, welded into the forearm and the shin so they cost no
 *     extra draw call and can never drift off the limb they belong to.
 *   - a tunic that flares, so the body is not a tube and the legs come out of
 *     something.
 *
 * Deliberately NO face, and deliberately low-poly and flat-shaded: one style
 * everywhere. At this scale a face is either invisible or uncanny, and this
 * poem does not need one — it needs a shape you recognise as a child from the
 * far end of an endless beach. */

/* three r157's core UMD build has no BufferGeometryUtils, so: concatenate a few
 * tiny geometries into one non-indexed buffer. Used to weld hand to forearm,
 * foot to shin and neck to head. */
function mergeGeos(list) {
  var pos = [], nor = [];
  for (var i = 0; i < list.length; i++) {
    var g = list[i].index ? list[i].toNonIndexed() : list[i];
    var p = g.attributes.position.array, nn = g.attributes.normal.array;
    for (var k = 0; k < p.length; k++) { pos.push(p[k]); nor.push(nn[k]); }
  }
  var out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  return out;
}

var THIGH_L = 0.215, SHIN_L = 0.215, LEG_L = THIGH_L + SHIN_L;
var UPARM_L = 0.155, FORE_L  = 0.170, ARM_L = UPARM_L + FORE_L;

var HEAD_Y = TORSO_L + NECK_L + HEAD_R * 0.86;    // head centre above the hips
var SHO_Y = TORSO_L - 0.052;

/* one rig, re-posed once per child per frame, read out into instanced meshes */

var rHips = new THREE.Object3D();   rig.add(rHips);
var rSpine = new THREE.Object3D();  rHips.add(rSpine);      // the joint that bends
var rTorsoM = new THREE.Object3D(); rSpine.add(rTorsoM);    // the tunic hangs on it

rHead.position.y = HEAD_Y;

  var mA = new THREE.Object3D(); mA.position.y = -segA / 2; root.add(mA);
  var joint = new THREE.Object3D(); joint.position.y = -segA; root.add(joint);
  var mB = new THREE.Object3D(); mB.position.y = -segB / 2; joint.add(mB);

var armL = limb(rSpine,  0.122, SHO_Y, UPARM_L, FORE_L);
var armR = limb(rSpine, -0.122, SHO_Y, UPARM_L, FORE_L);

var legR = limb(rHips,  -0.066, 0,     THIGH_L, SHIN_L);

var matCloth = new THREE.MeshLambertMaterial({ flatShading: true });

  var hp = new THREE.SphereGeometry(0.055, 6, 5); hp.translate(0,  THIGH_L / 2, 0);

var iHair  = inst(hairGeo, matHair, POOL);
var iUpArm = inst(upArmGeo, matSkin, POOL * 2);

/* footprints. The sand between the knots was the emptiest thing in this world,

var FOOT_POOL = 3400;

 * sand from six metres away. */
var footTex = (function () {

         * a leaf held out over the water. Still on sand — the poem is exact
         * about that — but as far forward as sand goes. */
        cx = ax + (h2(g, 44) - 0.5) * 5.4;
        cz = 2.6 + h2(g, 45) * 1.1;
        yaw = Math.PI;                            // facing the sea (forward is +z)
      }
      cz = Math.max(state === LAUNCH ? 2.6 : 4.2, Math.min(34, cz));  // never into the water

      var scale = 0.80 + h2(g, 130 + c) * 0.44;   // a range of ages, four years old to ten
      poseChild(state, t * spd + ph, (h2(g, 150 + c) - 0.5) * 0.12);

      rig.position.set(cx, groundY(cx, cz), cz);
      rig.rotation.y = yaw;
      rig.scale.setScalar(scale);
      rig.updateMatrixWorld(true);

      readPart(rTorsoM, iTorso, n);
      readPart(rHead, iHead, n);
      readPart(rHead, iHair, n);
      readPart(armL.a, iUpArm, n * 2);  readPart(armR.a, iUpArm, n * 2 + 1);
      readPart(armL.b, iFore,  n * 2);  readPart(armR.b, iFore,  n * 2 + 1);
      readPart(legL.a, iThigh, n * 2);  readPart(legR.a, iThigh, n * 2 + 1);
      readPart(legL.b, iShin,  n * 2);  readPart(legR.b, iShin,  n * 2 + 1);

      /* a contact shadow, not a pool: under a flat overcast sky the shade a
       * child casts is small and directly under it */
      _m.makeScale(scale * 0.56, 1, scale * 0.44);
      _m.setPosition(cx, rig.position.y + 0.012, cz);
      iShadow.setMatrixAt(n, _m);
      n++;

      if (Math.abs(cx - camX) > PROP_RANGE) continue;

      /* empty shells and pebbles lie where the children are, not evenly over
       * the sand — they were carried here and dropped */
      for (var q = 0; q < 3 && nSh < SHELL_POOL; q++) {
        var sa = h2(g, 170 + c * 3 + q) * TAU2, sr = 0.5 + h2(g, 200 + c * 3 + q) * 2.6;
        var sx = cx + Math.cos(sa) * sr, sz = Math.max(3.4, cz + Math.sin(sa) * sr);
        putProp(iShell, nSh++, sx, groundY(sx, sz) + 0.008, sz,
                h2(g, 230 + c * 3 + q) * TAU2, 0.7 + h2(g, 260 + c * 3 + q) * 0.7);
      }
      if (nPb < PEBBLE_POOL) {
        var pa = h2(g, 290 + c) * TAU2, pr = 0.4 + h2(g, 310 + c) * 2.2;
        var px = cx + Math.cos(pa) * pr, pz = Math.max(3.4, cz + Math.sin(pa) * pr);
        putProp(iPebble, nPb++, px, groundY(px, pz) + 0.006, pz, h2(g, 330 + c) * TAU2,
                0.8 + h2(g, 350 + c) * 0.8);
      }

      /* what the builders are building, right where they are reaching */
      if (state === BUILD && nTu + 3 <= TURRET_POOL) {
        var fx = cx - Math.sin(yaw) * 0.62, fz = cz - Math.cos(yaw) * 0.62;
        for (var u = 0; u < 3; u++) {
          var ta = h2(g, 370 + c * 3 + u) * TAU2, tr = h2(g, 400 + c * 3 + u) * 0.42;
          var tx = fx + Math.cos(ta) * tr, tz = fz + Math.sin(ta) * tr;
          putProp(iTurret, nTu++, tx, groundY(tx, tz) - 0.01, tz, ta,
                  (0.95 + h2(g, 430 + c * 3 + u) * 0.80) * scale);
        }
        if (nWa < WALL_POOL) putProp(iWall, nWa++, fx, groundY(fx, fz) - 0.02, fz, yaw + 2.6, 0.95 * scale);
      }

      /* the leaves this one has brought down to the water: two or three still
       * lying on the wet sand beside it, and one just let go, riding the swash
       * a step in front of its hands. This is where every drifting speck out on
       * the deep started. */
      if (state === LAUNCH) {
        for (var lf = 0; lf < 3 && nFr < FRESH; lf++) {
          var lx = cx + (h2(g, 600 + lf) - 0.5) * 1.5;
          var lz = cz + 0.25 + h2(g, 620 + lf) * 0.9;
          _dummy.position.set(lx, groundY(lx, lz) + 0.012, lz);
          _dummy.rotation.set(0, h2(g, 640 + lf) * TAU2, 0);
          _dummy.scale.setScalar(0.95 + h2(g, 660 + lf) * 0.35);
          _dummy.updateMatrix();
          iFresh.setMatrixAt(nFr++, _dummy.matrix);
        }
        if (nFr < FRESH) {
          /* the one that is away: it has been on the water for a few seconds,
           * still close enough that you can see whose hands it left */
          var gone = ((t * 0.33 + h2(g, 680) * 3) % 3) / 3;
          var bz = cz - 0.9 - gone * 5.5;
          var bx = cx + (h2(g, 690) - 0.5) * 0.8 + Math.sin(t * 0.4 + g) * 0.35;
          var by = seaHeightJS(bx, bz, t);
          var eps = 0.5;
          _dummy.position.set(bx, Math.max(groundY(bx, bz) + 0.01, by + 0.03), bz);
          _dummy.rotation.set(
            -(seaHeightJS(bx, bz + eps, t) - seaHeightJS(bx, bz - eps, t)) / (2 * eps),
            Math.PI + (h2(g, 700) - 0.5) * 0.7,
            (seaHeightJS(bx + eps, bz, t) - seaHeightJS(bx - eps, bz, t)) / (2 * eps));
          _dummy.scale.setScalar(1.05 + h2(g, 710) * 0.3);
          _dummy.updateMatrix();
          iFresh.setMatrixAt(nFr++, _dummy.matrix);
        }
      }

      /* pebbles gathered and scattered again: the stones actually leave the
       * hand, fly, land — and then it starts over, for no reason at all */
      if (state === SCATTER) {
        var sph = ((t * spd + ph) * 0.55) % 1;
        if (sph >= 0.42) {
          var tau = (sph - 0.42) / 0.58 * 0.95;
          var hx = cx - Math.sin(yaw) * 0.22, hz = cz - Math.cos(yaw) * 0.22;
          var hy = groundY(cx, cz) + 0.64 * scale;
          for (var b = 0; b < 5 && nPb < PEBBLE_POOL; b++) {
            var spread = (h2(g, 460 + c * 5 + b) - 0.5) * 1.5;
            var vf = 2.0 + h2(g, 490 + c * 5 + b) * 1.6;
            var vy = 2.1 + h2(g, 520 + c * 5 + b) * 1.5;
            var dx2 = -Math.sin(yaw + spread), dz2 = -Math.cos(yaw + spread);
            var bx2 = hx + dx2 * vf * tau, bz2 = hz + dz2 * vf * tau;
            var by2 = hy + vy * tau - 4.9 * tau * tau;
            putProp(iPebble, nPb++, bx2, Math.max(groundY(bx2, bz2) + 0.006, by2), bz2,
                    tau * 9.0, 0.8 + h2(g, 550 + c * 5 + b) * 0.7);
          }
        }
      }
    }
  }

  iTurret.count = nTu; iWall.count = nWa; iShell.count = nSh; iPebble.count = nPb;
  iFresh.count = nFr; iFoot.count = Q.get('nodecal') ? 0 : nFp;
  iTurret.instanceMatrix.needsUpdate = true; iWall.instanceMatrix.needsUpdate = true;
  iShell.instanceMatrix.needsUpdate = true; iPebble.instanceMatrix.needsUpdate = true;
  iFresh.instanceMatrix.needsUpdate = true;
  iFoot.instanceMatrix.needsUpdate = true;
  iTorso.count = n; iHead.count = n; iHair.count = n; iShadow.count = Q.get('nodecal') ? 0 : n;
  iUpArm.count = iFore.count = iThigh.count = iShin.count = n * 2;
  iTorso.instanceMatrix.needsUpdate = true;
  iHead.instanceMatrix.needsUpdate = true;
  iHair.instanceMatrix.needsUpdate = true;
  iUpArm.instanceMatrix.needsUpdate = true;
  iFore.instanceMatrix.needsUpdate = true;
  iThigh.instanceMatrix.needsUpdate = true;
  iShin.instanceMatrix.needsUpdate = true;
  iShadow.instanceMatrix.needsUpdate = true;
}

/* -------------------------------------------------------------- PLAYER -- */
var EYE = 1.70;
var player = {
  pos: new THREE.Vector3(8, 0, 16),
  vel: new THREE.Vector3(),
  yaw: 0,            // three.js looks down -Z at yaw 0, and -Z is the sea
  pitch: -0.05
};
var keys = Object.create(null);
var locked = false;


addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', function (e) { keys[e.code] = false; });

var enterEl = document.getElementById('enter');
var hintEl = document.getElementById('hint');
function requestLook() { canvas.requestPointerLock && canvas.requestPointerLock(); }
enterEl.addEventListener('click', requestLook);
canvas.addEventListener('click', function () { if (!locked) requestLook(); });
document.addEventListener('pointerlockchange', function () {
  locked = document.pointerLockElement === canvas;
  enterEl.classList.toggle('gone', locked);
  hintEl.classList.toggle('dim', locked);
});
document.addEventListener('mousemove', function (e) {
  if (!locked) return;
  player.yaw   -= e.movementX * 0.0022;
  player.pitch -= e.movementY * 0.0022;
  player.pitch = Math.max(-1.25, Math.min(1.15, player.pitch));
});

/* touch: left half drags a stick, right half looks */
var touchWrap = document.getElementById('touch'), stick = document.getElementById('stick'), knob = stick.firstElementChild;
var touchMove = { x: 0, y: 0 }, moveId = null, lookId = null, lastLook = { x: 0, y: 0 };
if (matchMedia('(pointer: coarse)').matches) {
  touchWrap.classList.add('on');
  enterEl.querySelector('.btn').textContent = '走进去（左边拖动，右边转头）';
  enterEl.addEventListener('click', function (e) { e.stopPropagation(); enterEl.classList.add('gone'); hintEl.classList.add('dim'); });
  touchWrap.addEventListener('touchstart', function (e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < innerWidth * 0.5 && moveId === null) moveId = t.identifier;
      else if (lookId === null) { lookId = t.identifier; lastLook.x = t.clientX; lastLook.y = t.clientY; }
    }
  }, { passive: true });
  touchWrap.addEventListener('touchmove', function (e) {
    var r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === moveId) {
        var dx = (t.clientX - cx) / (r.width / 2), dy = (t.clientY - cy) / (r.height / 2);
        var m = Math.min(1, Math.hypot(dx, dy)) || 0, a = Math.atan2(dy, dx);
        touchMove.x = Math.cos(a) * m; touchMove.y = Math.sin(a) * m;
        knob.style.transform = 'translate(' + (touchMove.x * 32) + 'px,' + (touchMove.y * 32) + 'px)';
      } else if (t.identifier === lookId) {
        player.yaw -= (t.clientX - lastLook.x) * 0.005;
        player.pitch -= (t.clientY - lastLook.y) * 0.005;
        player.pitch = Math.max(-1.25, Math.min(1.15, player.pitch));
        lastLook.x = t.clientX; lastLook.y = t.clientY;
      }
    }
  }, { passive: true });
  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (id === moveId) { moveId = null; touchMove.x = touchMove.y = 0; knob.style.transform = ''; }
      if (id === lookId) lookId = null;
    }
  }
  touchWrap.addEventListener('touchend', endTouch, { passive: true });
  touchWrap.addEventListener('touchcancel', endTouch, { passive: true });
}

function stepPlayer(dt) {
  var fwd = 0, side = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1;
  if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyD || keys.ArrowRight) side += 1;
  if (keys.KeyA || keys.ArrowLeft) side -= 1;
  fwd -= touchMove.y; side += touchMove.x;

  var speed = (keys.ShiftLeft || keys.ShiftRight) ? 13.5 : 5.2;
  var sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  var wx = (-sin * fwd + cos * side), wz = (-cos * fwd - sin * side);
  var len = Math.hypot(wx, wz);
  if (len > 1) { wx /= len; wz /= len; }

  var target = new THREE.Vector3(wx * speed, 0, wz * speed);
  player.vel.lerp(target, 1 - Math.pow(0.0009, dt));
  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;

  /* "They know not how to swim." Neither do you: the water turns you back. */
  if (player.pos.z < 0.9) {
    player.pos.z += (0.9 - player.pos.z) * Math.min(1, dt * 7.0);
    player.vel.z *= 0.6;
  }
  if (player.pos.z > 260) player.pos.z = 260;

  var y = groundY(player.pos.x, player.pos.z) + EYE;
  /* a small gait, so walking feels like walking */
  var bob = Math.sin(walkPhase) * 0.035 * Math.min(1, player.vel.length() / 5);
  camera.position.set(player.pos.x, y + bob, player.pos.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;
}
var walkPhase = 0;

/* ---------------------------------------------------------------- SUBS -- */
var subsEl = document.getElementById('subs'), ticksEl = document.getElementById('ticks');
STANZAS.forEach(function () { ticksEl.appendChild(document.createElement('i')); });
var shownStanza = -1;
function stanzaAt(x) {
  var i = Math.floor(((x % (STANZA_SPAN * STANZAS.length)) + STANZA_SPAN * STANZAS.length) % (STANZA_SPAN * STANZAS.length) / STANZA_SPAN);
  return Math.max(0, Math.min(STANZAS.length - 1, i));
}
function showStanza(i) {
  if (i === shownStanza) return;
  shownStanza = i;
  var old = subsEl.firstElementChild;
  if (old) { old.classList.add('out'); setTimeout(function () { old.remove(); }, 900); }
  var s = STANZAS[i];
  var g = document.createElement('div');
  g.className = 'grp out';
  g.innerHTML = '<p class="en">' + s.en + '</p><p class="zh">' + s.zh + '</p>';
  subsEl.appendChild(g);
  requestAnimationFrame(function () { requestAnimationFrame(function () { g.classList.remove('out'); }); });
  Array.prototype.forEach.call(ticksEl.children, function (t, k) { t.classList.toggle('on', k === i); });
}

/* ---------------------------------------------------------------- LOOP -- */
var clock = new THREE.Clock();
var simT = 0;
function resize() {
  var r = canvas.getBoundingClientRect();
  var w = Math.max(1, r.width | 0), h = Math.max(1, r.height | 0);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

function applyShotCamera() {
  var c = CAMS[SHOT - 1];
  camera.position.set(c.pos[0], c.pos[1], c.pos[2]);
  camera.rotation.order = 'YXZ';
  camera.lookAt(new THREE.Vector3(c.look[0], c.look[1], c.look[2]));
  showStanza(stanzaAt(c.pos[0]));
}

function frame() {
  if (!SHOT || shotFrames < SHOT_FRAMES) requestAnimationFrame(frame);
  if (SHOT) shotFrames++;
  var dt = Math.min(clock.getDelta(), 0.05);
  if (SHOT) {
    simT = FROZEN_T;
    applyShotCamera();
  } else {
    simT += dt;
    walkPhase += dt * 8.5 * Math.min(1, player.vel.length() / 5);
    stepPlayer(dt);
    showStanza(stanzaAt(player.pos.x));
  }
  seaUniforms.uTime.value = simT;
  sandUniforms.uTime.value = simT;
  sky.material.uniforms.uTime.value = simT;
  /* it roams: never here, never gone */
  var stormAz = Math.PI + 0.62 * Math.sin(simT * 0.0125) + 0.22 * Math.sin(simT * 0.041);
  sky.material.uniforms.uStormAz.value = stormAz;
  seaUniforms.uStormAz.value = stormAz;
  updateChildren(simT, camera.position.x);
  updateWrecks(simT, camera.position.x);
  updateBoats(simT, camera.position.x);
  updateSpray(simT, camera.position.x);
  sky.position.copy(camera.position);
  sea.position.x = Math.round(camera.position.x / 200) * 200;
  sand.position.x = Math.round(camera.position.x / 400) * 400; // the shore never ends
  renderer.render(scene, camera);
}

/* ------------------------------------------------------------------ UI -- */
var railToggle = document.getElementById('railtoggle');
railToggle.addEventListener('click', function () {
  var col = document.body.classList.toggle('rail-collapsed');
  railToggle.textContent = col ? '‹' : '›';
  try { localStorage.setItem('g60.rail', col ? '1' : '0'); } catch (e) {}
  setTimeout(resize, 320);
});
try { if (localStorage.getItem('g60.rail') === '1') railToggle.click(); } catch (e) {}

if (window.PolishTimeline) {
  PolishTimeline.mount({
    el: '#tl', log: 'log.jsonl',
    onReady: function (rounds) {
      var n = rounds.length;
      document.getElementById('ft-rounds').textContent = n ? (n + ' 轮（进行中）') : '—';
      var stopped = rounds.filter(function (r) { return r.stop; }).pop();
      if (stopped) {
        document.getElementById('ft-rounds').textContent = n + ' 轮';
        document.getElementById('ft-stop').textContent = stopped.stop_reason || '循环结束';
      }
    }
  });
}

if (SHOT) document.body.classList.add('shot');
resize();
frame();

/* hold the boot veil until the first real frame has actually landed */
requestAnimationFrame(function () {
  requestAnimationFrame(function () {
    var b = document.getElementById('boot');
    b.classList.add('gone');
    setTimeout(function () { b.remove(); }, 800);
    if (SHOT) {
      document.body.setAttribute('data-shot-ready', '1');
      /* so a headless --dump-dom can report what the frame contained */
      document.body.setAttribute('data-counts',
        'children=' + iTorso.count + ' boats=' + iBoat.count +
        ' spray=' + iSpray.count + ' turrets=' + iTurret.count +
        ' shells=' + iShell.count + ' pebbles=' + iPebble.count +
        ' prints=' + iFoot.count + ' fresh=' + iFresh.count);
    }
  });
});

/* a small handle for poking at the world from the console / from the shot harness */
window.__G60 = {
  scene: scene, camera: camera, player: player, CAMS: CAMS,
  children: { torso: iTorso, head: iHead, shadow: iShadow },
  boats: iBoat, seaHeightJS: seaHeightJS,
  groupsNear: function (x) {
    var out = [], gMin = Math.floor((x - CHILD_RANGE) / GROUP_SPAN), gMax = Math.ceil((x + CHILD_RANGE) / GROUP_SPAN);
    for (var g = gMin; g <= gMax; g++) {
      out.push({ g: g, x: +(g * GROUP_SPAN + (h2(g,1)-0.5)*26).toFixed(1),
                 z: +(3.0 + h2(g,2)*19).toFixed(1), n: 3 + Math.floor(h2(g,3)*5) });
    }
    return out;
  }
};

})();
</script>
</body>
