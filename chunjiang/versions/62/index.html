<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🌕%3C/text%3E%3C/svg%3E">

<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; background: var(--bg-sink); }

  #stage { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; background: #070a12; }
  #view  { display: block; width: 100%; height: 100%; }

  #stage::before, #stage::after {
    content: ""; position: absolute; left: 0; right: 0; pointer-events: none; z-index: 2;
  }
  #stage::before { top: 0; height: 120px; background: linear-gradient(to bottom, rgba(6,9,16,.40), transparent); }
  #stage::after  { bottom: 0; height: 38%; background: linear-gradient(to top, rgba(6,9,16,.60), rgba(6,9,16,.16) 44%, transparent); }
  /* The bottom scrim stays in shot mode. It is what the subtitle is set against on the
   * live page, and hiding it for screenshots meant the lines lay directly on the white
   * sand of the bar and stopped being readable in exactly the frames people look at. */
  body.shot #stage::before { display: none; }
  body.shot #stage::after { height: 26%;
    background: linear-gradient(to top, rgba(6,9,16,.46), rgba(6,9,16,.14) 48%, transparent); }

  #subs {
    position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%);
    width: min(760px, 88%); text-align: center; pointer-events: none; z-index: 4;
    text-shadow: 0 2px 22px rgba(0,0,0,.75), 0 1px 3px rgba(0,0,0,.6);
    transition: opacity .9s ease;
  }
  #subs .zh { font-family: var(--serif); font-size: clamp(15px,1.75vw,21px); line-height: 1.95;
    color: #f2eee4; margin: 0; letter-spacing: .04em; white-space: pre-line; }
  #subs .en { font-family: var(--serif); font-style: italic; font-size: clamp(11.5px,1.1vw,14px);
    line-height: 1.7; color: #b9c6cf; margin: 9px 0 0; white-space: pre-line; }

  #ticks { position: absolute; left: 50%; bottom: 3.6%; transform: translateX(-50%);
    display: flex; gap: 7px; z-index: 4; pointer-events: none; }
  #ticks i { width: 22px; height: 2px; background: rgba(255,255,255,.18); border-radius: 2px;
    transition: background .5s, width .5s; }
  #ticks i.on { background: rgba(226,232,240,.72); width: 30px; }

  #hint { position: absolute; left: 22px; bottom: 20px; z-index: 3; display: flex; gap: 14px;
    flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  #hint kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 2px; }
  #where { position: absolute; right: 16px; top: 16px; z-index: 3; font-family: var(--mono);
    font-size: 11px; color: var(--ink-faint); letter-spacing: .1em; }
  body.shot #hint, body.shot #where, body.shot #touch, body.shot #enter,
  body.shot #rail { display: none !important; }

  #enter { position: absolute; inset: 0; z-index: 6; display: grid; place-content: center; gap: 12px;
    justify-items: center; background: rgba(5,8,14,.88); cursor: pointer; padding: 24px;
    text-align: center; transition: opacity .8s ease; font-family: var(--serif); }
  #enter .t { font-size: clamp(19px,3.4vw,27px); color: var(--ink); letter-spacing: .1em; }
  #enter .s { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); line-height: 2; }
  #enter .btn { margin-top: 18px; border: 1px solid var(--line); padding: 10px 28px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .34em; color: var(--sand); }
  #enter.gone { opacity: 0; pointer-events: none; }

  #touch { position: absolute; left: 18px; bottom: 18px; z-index: 5; display: none; }
  @media (pointer: coarse) { #touch { display: block } #hint { display: none } }
  #stick { width: 112px; height: 112px; border: 1px solid var(--line); border-radius: 50%;
    position: relative; touch-action: none; }
  #stick b { position: absolute; left: 50%; top: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px;
    border-radius: 50%; background: rgba(232,228,220,.15); border: 1px solid var(--line); }

  /* ---------- right: the polish timeline ---------- */
  #rail { flex: 0 0 360px; height: 100%; display: flex; flex-direction: column;
    background: var(--bg); border-left: 1px solid var(--line); transition: flex-basis .32s ease; }
  body.rail-collapsed #rail { flex-basis: 42px; }
  body.rail-collapsed #tl, body.rail-collapsed #railfoot, body.rail-collapsed .rb-txt { display: none; }
  #railbar { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--line); }
  #railtoggle { background: none; border: 1px solid var(--line); color: var(--ink); width: 24px; height: 24px;
    border-radius: 3px; cursor: pointer; font-size: 12px; line-height: 1; flex: 0 0 auto; }
  .rb-txt .a { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--ink-dim); }
  .rb-txt .b { font-family: var(--serif); font-size: 13px; color: var(--ink); }
  #tl { flex: 1 1 auto; overflow-y: auto; }
  #railfoot { border-top: 1px solid var(--line); padding: 12px; font-family: var(--mono); font-size: 11px;
    color: var(--ink-dim); line-height: 1.95; }
  #railfoot .row { display: flex; gap: 10px; }
  #railfoot .k { color: var(--ink-faint); width: 58px; flex: 0 0 auto; }
  #railfoot .v.sand { color: var(--sand); }
  #railfoot .lnks { margin-top: 10px; display: flex; gap: 12px; flex-wrap: wrap; }
  #railfoot .lnks a { color: var(--ink-faint); text-decoration: none; border-bottom: 1px solid var(--line); }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    #rail { flex: 0 0 42%; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
    body.rail-collapsed #rail { flex-basis: 42px; width: 100%; }
  }

<script>
/* =========================================================================
 * 春江花月夜 — a spring river under the moon, hand-written Canvas 2D, zero deps.
 * Sections: POEM → CAMS → WORLD → PROJECT → DRAW → PLAYER → SUBS → LOOP → UI
 * ========================================================================= */
(function () {
'use strict';

var Q = new URLSearchParams(location.search);
var SHOT = parseInt(Q.get('shot') || '0', 10) || 0;   // 1..6 → fixed camera, frozen clock, no UI
var LITE = Q.get('lite') === '1' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
var LIVE_FPS = LITE ? 20 : 30;
var FROZEN_T = 21.0;
/* Software GL would otherwise faithfully render every frame of Chrome's virtual-time
 * budget, which takes minutes per image. In shot mode we draw a few frames and stop. */
var SHOT_FRAMES = 1;
var shotFrames = 0;

/* ---------------------------------------------------------------- POEM -- */
/* Eight stations. Each is a place in the world, not a page of text. */
var STATIONS = [
  { id: 'tide',   x:   0, z:  13, r: 5.5,
    zh: '春江潮水连海平，海上明月共潮生。',
    en: "The spring river's tide runs level with the sea;\nover the sea, the bright moon rises with the tide." },
  { id: 'path',   x:  -9, z:   6, r: 5.0,
    zh: '滟滟随波千万里，何处春江无月明。',
    en: 'Glittering, it follows the waves ten thousand li —\nwhere, on this spring river, is there no moonlight?' },
  { id: 'grove',  x:  12, z:  -3, r: 5.0,
    zh: '江流宛转绕芳甸，月照花林皆似霰。',
    en: 'The river winds round the fragrant meadow;\nmoonlight on the flowering grove turns it all to sleet.' },
  { id: 'sand',   x:   1, z:  -1, r: 4.0,
    zh: '空里流霜不觉飞，汀上白沙看不见。',
    en: 'Frost drifts through the air and no one feels it fly;\non the sandbar the white sand cannot be told apart.' },
  { id: 'moon',   x:  -3, z: -13, r: 5.5,
    zh: '江天一色无纤尘，皎皎空中孤月轮。',
    en: 'River and sky, one colour, without a grain of dust;\nbright and alone in the emptiness, the wheel of the moon.' },
  { id: 'ages',   x:   9, z: -11, r: 5.0,
    zh: '人生代代无穷已，江月年年只相似。',
    en: 'Human lives, generation after generation, never end;\nthe river’s moon, year after year, looks only the same.' },
  { id: 'boat',   x: -11, z:  -9, r: 5.0,
    zh: '谁家今夜扁舟子？何处相思明月楼？',
    en: 'Whose small boat is out tonight?\nWhere is the moonlit tower that is missing someone?' },
  { id: 'trees',  x:   6, z:  12, r: 5.0,
    zh: '不知乘月几人归，落月摇情满江树。',
    en: 'No one knows how many ride the moonlight home —\nthe setting moon shakes its feeling out over the river trees.' }
];
var OPEN_WATER = {
  zh: '此时相望不相闻，愿逐月华流照君。',
  en: 'Now we look at the same moon and cannot hear each other;\nI would follow the moonlight and flow until it shines on you.'
};

/* ---------------------------------------------------------------- CAMS -- */
/* Six fixed cameras, frozen at round 1. Never change these — cross-round
 * screenshots are comparable only because the eye does not move. */
var CAMS = [
  { name: 'moonrise',    x:   0, z:  12, yaw: Math.PI,  pitch: -0.010 },
  { name: 'moon-path',   x:  -7, z:   5, yaw: 2.86,     pitch: -0.020 },
  { name: 'flower-grove',x:   9, z:   1, yaw: 3.62,     pitch: -0.020 },
  { name: 'sandbar',     x:   2, z:  -3, yaw: 1.62,     pitch: -0.055 },
  { name: 'boat',        x: -10, z:  -8, yaw: 3.126,    pitch: -0.010 },
  { name: 'river-trees', x:   5, z:  10, yaw: 0.35,     pitch:  0.000 }
];

/* --------------------------------------------------------------- WORLD -- */
var cv = document.getElementById('view');
var ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;

function resize() {
  DPR = SHOT ? 1 : Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5);
  W = Math.max(1, (SHOT ? (window.innerWidth || 960) : cv.clientWidth) | 0);
  H = Math.max(1, (SHOT ? (window.innerHeight || 600) : cv.clientHeight) | 0);
  cv.width = Math.max(1, Math.round(W * DPR));
  cv.height = Math.max(1, Math.round(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

var cam = { x: 0, y: 1.62, z: 26, yaw: Math.PI, pitch: -0.01, fov: 1.02 };
var vel = { x: 0, z: 0 };

function project(p) {
  var dx = p.x - cam.x, dy = p.y - cam.y, dz = p.z - cam.z;
  var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  var X = dx * cy - dz * sy;
  var Z = dx * sy + dz * cy;
  var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  var Y = dy * cp - Z * sp;
  Z = dy * sp + Z * cp;
  if (Z <= 0.08) return null;
  var f = (H * 0.5) / Math.tan(cam.fov * 0.5);
  return { x: W * 0.5 + X * f / Z, y: H * 0.5 - Y * f / Z, z: Z, s: f / Z };
}

/* deterministic noise: the same world every time it is opened */
var _s = 7760626;
function rnd() { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; }

/* the sandbar (汀): a low island of white sand, its edge soft, not a cliff */
function edgeR(th) {
  /* a small bar, not an island: the river has to own the frame */
  /* Pulled in once the bar's polygon stopped folding over itself: with the fill fixed
   * the bar is finally all there, and at its old radius of seventeen half of every frame
   * was sand. It may not be pulled in much further, though — the six stations are frozen
   * and the furthest of them stands twelve metres out, so a bar smaller than that leaves
   * the camera standing in the river rather than on the sand it is meant to be on. */
  /* The bar is pulled in hard on its upstream side. The six stations are frozen and the
   * first of them stands twelve metres out along +z; with a bar that reached past it in
   * every direction, that station — whose line is 春江潮水连海平, the tide running level
   * with the sea — was looking across twenty-six metres of sand and spent the bottom
   * forty-five per cent of its frame on it, which every critic in turn said. The bar now
   * reaches back BEHIND that station and gives way in front of it, so it stands near the
   * water with the river opening out ahead, which is what the line asks for. Every
   * station is still on the sand. */
  return 14.5 + 3.4 * Math.sin(th) + 2.6 * Math.sin(th * 2 + 0.7)
       + 1.3 * Math.sin(th * 5 - 1.1) + 0.7 * Math.sin(th * 9 + 2.3);
}
var BAR = 3.6;                       // a low dune: high enough to see the river from
function gh(x, z) {
  var r = Math.hypot(x, z);
  var R = edgeR(Math.atan2(z, x));
  var t = Math.min(1, r / R);
  return BAR * (1 - t * t);
}
var EDGE = [];
for (var i = 0; i < 360; i++) {
  var th = i / 360 * Math.PI * 2, R0 = edgeR(th);
  EDGE.push({ th: th, x: Math.cos(th) * R0, z: Math.sin(th) * R0 });
}

/* the moon's face, placed once off the same LCG as everything else */
var MOONFACE = [];
for (var i6 = 0; i6 < 38; i6++) {
  MOONFACE.push({ a: rnd() * 6.28318, r: Math.sqrt(rnd()) * 0.74,
                  s: 0.055 + rnd() * 0.115, o: 0.045 + rnd() * 0.075 });
}

/* the moon: low over the water, the centre of gravity of the whole night */
var MOON = { th: Math.PI * 1.5, dist: 620, y: 96, r: 56 };
MOON.x = Math.cos(MOON.th) * MOON.dist;
MOON.z = Math.sin(MOON.th) * MOON.dist;

/* white sand grains, so the bar reads as sand and not as a floor */
var grains = [];
for (var i2 = 0; i2 < 96000; i2++) {
  var a2 = rnd() * Math.PI * 2, r2 = Math.sqrt(rnd()) * 1;
  var th2 = a2, rr2 = r2 * edgeR(th2) * 0.985;
  grains.push({ x: Math.cos(th2) * rr2, z: Math.sin(th2) * rr2, m: rnd(), k: rnd() });
}

/* 滟滟随波千万里 — the road's own shards. Laid out in ranks at a geometric spacing with
 * seven shards to a rank, the road keeps its rows however hard each shard's distance is
 * jittered inside its rank: close to the eye the ranks are far enough apart on screen
 * that you read them as regular lines of flecks, and it came back as scan lines. This is
 * a scattered field instead — every shard its own distance along the moon's axis, its own
 * offset across it, its own size and its own beat. */
var ROAD = [];
for (var i5 = 0; i5 < 2600; i5++) {
  var rU = rnd();
  ROAD.push({ d: 2.2 * Math.pow(520 / 2.2, rU),      // dense near, thinning away
              lat: rnd() * 2 - 1, len: rnd(), ph: rnd() * 6.28318, fl: rnd() });
}

/* 花林: a grove whose blossom reads as sleet under the moon */
var grove = [];
for (var i3 = 0; i3 < 22; i3++) {
  /* 江流宛转绕芳甸 — the fragrant meadow sits just across the channel, not on the horizon */
  /* Evenly spaced at one height the grove came out as a single hedge running across
   * the frame. Clumped, with the spacing and the heights both scattered, it reads as
   * a wood: crowns that grow into each other in places and let the night through in
   * others. All of it from the same deterministic rnd(), so shots stay reproducible. */
  /* Evenly stepped angles left the wood a row of puffs at one spacing along one line.
   * The step is now itself uneven and the scatter is three times wider, so the trees
   * gather into clumps with real gaps of night between them; the radii spread much
   * further too, so some stand well behind others instead of all along one baseline. */
  var a3 = (i3 < 13 ? -0.46 + i3 * 0.070 : -0.66 + (i3 - 13) * 0.105)
         + (rnd() - 0.5) * 0.26 + Math.sin(i3 * 2.3) * 0.030;
  var r3 = (i3 < 13 ? 30 + rnd() * rnd() * 46 : 58 + rnd() * 52);
  grove.push({ x: Math.cos(a3) * r3, z: Math.sin(a3) * r3,
               h: 3.4 + rnd() * rnd() * 7.0, seed: rnd() * 6.28,
               /* each crown its own build: wide and low, or tall and narrow, leaning a
                * little one way or the other. Sharing one aspect ratio and one flatten
                * made every tree the same mushroom, and thirteen of them in a row read
                * as a sprite pasted thirteen times. */
               wid: 0.72 + rnd() * 0.85, flat: 0.52 + rnd() * 0.42,
               lean: (rnd() - 0.5) * 0.5, dens: 0.6 + rnd() * 0.9 });
}

/* 滟滟: the wavelet field, built once. It used to be hashed out of the loop index with
 * sin(i * 12.9898) and friends; at seven hundred wavelets that passes for noise, but at
 * eleven thousand the quasi-periodicity in those hashes shows through as a woven
 * cross-hatch lying over the whole river. The same LCG that places the sand and the
 * grove has no such structure in it. */
var WAVES = [];
for (var i8 = 0; i8 < 20000; i8++) {
  var wA = rnd() * Math.PI * 2, wB = rnd();
  WAVES.push({ ang: wA, rad: 2.5 + Math.pow(wB, 0.62) * 300,
               len: rnd(), ph: rnd() * 6.28318, bow: rnd() < 0.5 ? 1 : -1 });
}

/* 江树: the far bank, a low line of trees the setting moon shakes */
var bank = [];
for (var c4 = 0; c4 < 11; c4++) {            // clumps, with gaps of open water between them
  var ca = rnd() * Math.PI * 2;
  var cr = 165 + rnd() * 85;
  var n4 = 3 + Math.floor(rnd() * 6);
  for (var i4 = 0; i4 < n4; i4++) {
    var a4 = ca + (rnd() - 0.5) * 0.14;
    var r4 = cr + (rnd() - 0.5) * 26;
    bank.push({ x: Math.cos(a4) * r4, z: Math.sin(a4) * r4, h: 5 + rnd() * 9, w: 0.5 + rnd() * 1.1 });
  }
}

/* 扁舟: one small boat, drifting, never arriving */
/* Placed so that the station whose subtitle names them can see them: the boat
 * crosses the view from the 'boat' camera, the tower stands beyond it. */
/* r was 43, which put the skiff 31.8m from the 5-boat eye while the tower stands at
 * 87.5m. A hull 7.2m long at that range is 122px across, against a tower 250px tall:
 * three fifths of its height. An independent critic measured the same thing off the
 * frame — "船的水线 y≈345 和塔基 y≈349 几乎同高...一叶小舟该是塔高的六分之一左右" —
 * and read the result as a flying saucer parked on the horizon rather than a 扁舟.
 * At r=76 the boat sits 62m out, still well inside the tower and far inside the far
 * bank (which starts at 165), and with the hull scaled to 0.72 it comes out 45px —
 * about a fifth of the tower. 扁舟 has to be small or the word means nothing. */
var boat = { th: -2.09, r: 76, drift: 0.0065, s: 0.72 };

/* 鱼龙潜跃水成文 — where something went down, the river writes. A handful of rings,
 * each opening slowly and gone before it is large; placed out on the open water, never
 * on the bar. */
var RING = [];
for (var i6r = 0; i6r < 7; i6r++) {
  var ra6 = rnd() * Math.PI * 2, rr6 = 26 + rnd() * 90;
  RING.push({ x: Math.cos(ra6) * rr6, z: Math.sin(ra6) * rr6,
              t0: rnd() * 26, period: 19 + rnd() * 16 });
}

/* 昨夜闲潭梦落花 — blossom off the grove, on the water and a little of it still in the
 * air. Placed in the channel the river makes round the meadow, because that is the water
 * the flowering trees actually stand over. */
var PETAL = [];
for (var i7p = 0; i7p < 150; i7p++) {
  var pa7 = -0.80 + rnd() * 1.55;
  var pr7 = 14 + rnd() * 15;
  PETAL.push({ a: pa7, r: pr7, ph: rnd() * 6.28318, air: rnd() < 0.22,
               sp: 0.6 + rnd() * 0.9, sz: 0.55 + rnd() * 0.75 });
}

/* 白云一片: two thin strips, built once, each a run of soft puffs */
var CLOUD = [];
for (var i9c = 0; i9c < 2; i9c++) {
  var puffs = [];
  var n9 = 16 + Math.floor(rnd() * 10);
  for (var j9 = 0; j9 < n9; j9++) {
    var t9 = j9 / (n9 - 1);
    puffs.push({ u: (t9 - 0.5) * 2, v: (rnd() - 0.5) * 0.9 + Math.sin(t9 * 3.1) * 0.25,
                 r: 0.5 + rnd() * 0.75,
                 a: Math.sin(Math.PI * t9) * (0.55 + rnd() * 0.65) });
  }
  CLOUD.push({ x0: rnd() * 1600, y: 150 + rnd() * 110, z: -420 - rnd() * 260,
               w: 150 + rnd() * 90, h: 16 + rnd() * 10, puffs: puffs });
}

/* 明月楼: a tower on the far bank with exactly one window lit */
var TOWER = { x: 22, z: -95 };

/* --------------------------------------------------------------- DRAW  -- */
function seg(a, b, col, w) {
  var p = project(a), q = project(b);
  if (!p || !q) return;
  ctx.strokeStyle = col; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
}
function poly(pts, fill, stroke) {
  var ps = [], k;
  for (k = 0; k < pts.length; k++) { var pp = project(pts[k]); if (!pp) return; ps.push(pp); }
  ctx.beginPath(); ctx.moveTo(ps[0].x, ps[0].y);
  for (k = 1; k < ps.length; k++) ctx.lineTo(ps[k].x, ps[k].y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}

var T = 0, last = 0;

function drawSky() {
  /* 江天一色无纤尘 — the sky is the same colour as the water it stands on */
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#070b15');
  g.addColorStop(0.42, '#101a2b');
  g.addColorStop(0.62, '#1b2c42');
  g.addColorStop(1.00, '#0a1020');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawClouds() {
  /* 白云一片去悠悠 — one strip of cloud, and it is leaving. The sky in this world has
   * been nothing but a gradient with a moon in it, and this is a line of the poem that
   * was never in the picture at all. It is thin, it lies well off the moon so as not to
   * take the eye from it, its underside carries a little of the moonlight, and it drifts
   * so slowly that in any one look it is simply there. */
  for (var cI = 0; cI < CLOUD.length; cI++) {
    var cd = CLOUD[cI];
    var drift = (cd.x0 + T * 0.55) % 1600 - 800;
    var cp3 = project({ x: drift, y: cd.y, z: cd.z });
    if (!cp3) continue;
    var cw = cd.w * cp3.s, chh = cd.h * cp3.s;
    if (cw < 4) continue;
    for (var pI = 0; pI < cd.puffs.length; pI++) {
      var pu = cd.puffs[pI];
      var ux3 = cp3.x + pu.u * cw, uy3 = cp3.y + pu.v * chh;
      var ur = pu.r * chh;
      ctx.save();
      ctx.translate(ux3, uy3); ctx.scale(1, 0.46); ctx.translate(-ux3, -uy3);
      var cg3 = ctx.createRadialGradient(ux3, uy3, 0, ux3, uy3, ur);
      /* lit from below, where the moon is */
      var lift = 0.5 + 0.5 * (-pu.v);
      cg3.addColorStop(0, 'rgba(150,172,204,' + (0.052 * pu.a * (0.5 + lift)).toFixed(3) + ')');
      cg3.addColorStop(0.55, 'rgba(142,164,196,' + (0.024 * pu.a * (0.5 + lift)).toFixed(3) + ')');
      cg3.addColorStop(1, 'rgba(138,160,192,0)');
      ctx.fillStyle = cg3;
      ctx.beginPath(); ctx.arc(ux3, uy3, ur, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawMoon() {
  var p = project({ x: MOON.x, y: MOON.y, z: MOON.z });
  if (!p) return null;
  var breath = 1 + 0.012 * Math.sin(T * 0.23);
  var rad = MOON.r * p.s * 0.55 * breath;

  /* 皎皎空中孤月轮 — most of moonlight is halo, and a halo has layers */
  var rings = [
    [14, 0.050], [7.5, 0.085], [3.6, 0.130], [1.9, 0.200]
  ];
  for (var hi = 0; hi < rings.length; hi++) {
    var k = rings[hi][0], a0 = rings[hi][1] * (0.88 + 0.12 * Math.sin(T * 0.31 + hi));
    var hg = ctx.createRadialGradient(p.x, p.y, rad * 0.7, p.x, p.y, rad * k);
    hg.addColorStop(0, 'rgba(226,238,252,' + a0.toFixed(3) + ')');
    hg.addColorStop(0.35, 'rgba(198,218,242,' + (a0 * 0.34).toFixed(3) + ')');
    hg.addColorStop(1, 'rgba(170,196,228,0)');
    ctx.fillStyle = hg;
    ctx.fillRect(p.x - rad * k, p.y - rad * k, rad * k * 2, rad * k * 2);
  }

  /* the disc: bright, but not a cut-out — the limb has to give way to the halo */
  var disc = ctx.createRadialGradient(p.x - rad * 0.22, p.y - rad * 0.26, rad * 0.05, p.x, p.y, rad);
  disc.addColorStop(0, '#ffffff');
  disc.addColorStop(0.55, '#f4f8fd');
  disc.addColorStop(0.88, '#e2eaf5');
  disc.addColorStop(1, 'rgba(214,226,242,.72)');
  ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
  ctx.fillStyle = disc; ctx.fill();

  /* the faintest mottling, so the disc has a surface rather than being a hole in the sky */
  /* Nine patches at a golden angle with their radii taken from mi*37%11 and mi*53%7 put
   * two obvious grey blotches on the face, and the same two in every shot. Thirty-eight
   * smaller ones off the world's own LCG read as a surface instead of as markings. */
  for (var mi = 0; mi < 38; mi++) {
    var mq = MOONFACE[mi];
    var mr = rad * mq.r;
    var mx = p.x + Math.cos(mq.a) * mr, my = p.y + Math.sin(mq.a) * mr;
    var ms = rad * mq.s;
    var mg = ctx.createRadialGradient(mx, my, 0, mx, my, ms);
    mg.addColorStop(0, 'rgba(202,214,234,' + mq.o.toFixed(3) + ')');
    mg.addColorStop(1, 'rgba(202,214,234,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - ms, my - ms, ms * 2, ms * 2);
  }
  return p;
}

function drawFarBank() {
  /* the far bank: trees and one lit tower, all of it almost dissolved in haze */
  var k;
  for (k = 0; k < bank.length; k++) {
    var b = bank[k];
    var p = project({ x: b.x, y: 0, z: b.z }), q = project({ x: b.x, y: b.h, z: b.z });
    if (!p || !q) continue;
    /* a tree on the far bank is a smudge, not a post: soft, thin, nearly gone */
    /* Stroked flat with butt caps these came out as little pale RECTANGLES standing on
     * the horizon — the critic read them as leftover texture, and they were the one
     * hard-cornered thing in an otherwise soft distance. Round caps, and a crown of its
     * own over each, so a tree on the far bank is a smudge and not a post. */
    var grad = ctx.createLinearGradient(0, p.y, 0, q.y);
    grad.addColorStop(0, 'rgba(146,168,196,.19)');
    grad.addColorStop(0.65, 'rgba(146,168,196,.11)');
    grad.addColorStop(1, 'rgba(146,168,196,0)');
    ctx.strokeStyle = grad;
    /* A stroke, however softly its colour is graded down its length, has two hard sides.
     * At this distance the bank's trees were wide strokes: pale bars with clean vertical
     * edges standing on the horizon, the one crisp thing left in a distance that has
     * otherwise been given over to haze. Each tree is an ellipse of light instead, soft
     * in every direction, which is all a tree two hundred metres off in river mist is. */
    var bh = Math.max(2, p.y - q.y);
    var bw = Math.max(1.4, Math.min(b.w * p.s * 2.4, bh * 0.5));
    var bcy = q.y + bh * 0.55;
    ctx.save();
    ctx.translate(p.x, bcy); ctx.scale(1, (bh * 0.44) / bw); ctx.translate(-p.x, -bcy);
    var bg2 = ctx.createRadialGradient(p.x, bcy, 0, p.x, bcy, bw);
    bg2.addColorStop(0, 'rgba(152,174,202,.13)');
    bg2.addColorStop(0.55, 'rgba(150,172,200,.06)');
    bg2.addColorStop(1, 'rgba(148,170,198,0)');
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.arc(p.x, bcy, bw, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    /* 落月摇情满江树 — and the whole far bank of them shaking in the river. The water
     * lies between you and this bank, so this is the one line of the poem that can
     * actually be given back to the surface: the tree's own light, pulled down, pulled
     * out sideways, and broken across the swell so that it is never the tree's shape. */
    var rr0 = Math.max(4, bh * 0.75), rsl = 7;
    for (var rI = 0; rI < rsl; rI++) {
      var rt2 = (rI + 0.5) / rsl;
      var ry2 = p.y + rt2 * rr0;
      var rwob = Math.sin(T * 1.1 + rI * 0.9 + b.x * 0.21) * (1.0 + rt2 * 4.5);
      var rw2 = bw * (1.5 + rt2 * 1.1);
      var ra3 = 0.085 * (1 - rt2) * (0.55 + 0.45 * Math.sin(T * 1.7 + rI * 1.3 + b.z * 0.13));
      if (ra3 < 0.006) continue;
      ctx.strokeStyle = 'rgba(150,172,200,' + ra3.toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, rr0 / rsl * 0.9);
      ctx.beginPath();
      ctx.moveTo(p.x - rw2 + rwob, ry2);
      ctx.lineTo(p.x + rw2 + rwob, ry2);
      ctx.stroke();
    }
  }
  /* 明月楼 — 何处相思明月楼: eaves that lift at the corners, a railing, one lit window,
   * and the whole of it lying broken on the water. */
  var TW = 5.6;
  /* how much of the tower this eye gets. From the grove station it is a hundred and
   * eighty metres off and half behind the mist, and drawn at full strength it read there
   * as a small grey block that could not be identified as anything. */
  var tDist = Math.hypot(TOWER.x - cam.x, TOWER.z - cam.z);
  var tA = Math.max(0, Math.min(1, (200 - tDist) / 95));
  if (tA < 0.02) return;
  ctx.save();
  ctx.globalAlpha = tA;
  /* which way the moon lies from the tower, on screen */
  var tmP = project({ x: MOON.x, y: MOON.y, z: MOON.z });
  var tcP = project({ x: TOWER.x, y: 12, z: TOWER.z });
  var towLit = (tmP && tcP && tmP.x < tcP.x) ? -1 : 1;
  function tface(y0, y1, half, fill) {
    /* A storey filled with one flat colour has no light on it at all, and the tower ends
     * up the only thing in the picture the moon has not touched. Each face now carries a
     * gradient across it — the side the moon is on picks up a little of it, the far side
     * goes down into the night — and a thin rim of moonlight down its lit corner. */
    var la = project({ x: TOWER.x - half, y: y1, z: TOWER.z });
    var lb = project({ x: TOWER.x + half, y: y1, z: TOWER.z });
    var fg2 = fill;
    if (la && lb) {
      var xa = towLit < 0 ? la.x : lb.x, xb = towLit < 0 ? lb.x : la.x;
      var gg = ctx.createLinearGradient(xa, 0, xb, 0);
      gg.addColorStop(0, 'rgba(64,80,108,.96)');
      gg.addColorStop(0.35, 'rgba(38,50,72,.96)');
      gg.addColorStop(1, 'rgba(18,25,40,.96)');
      fg2 = gg;
    }
    poly([{ x: TOWER.x - half, y: y0, z: TOWER.z }, { x: TOWER.x + half, y: y0, z: TOWER.z },
          { x: TOWER.x + half, y: y1, z: TOWER.z }, { x: TOWER.x - half, y: y1, z: TOWER.z }],
         fg2, null);
    /* the same grain the rest of this world is made of. The tower was the one clean flat
     * fill left in a picture where the sand, the blossom and the water are all speckle,
     * and it read as a piece of vector art pasted into a drawing. */
    if (la && lb) {
      var g0 = project({ x: TOWER.x - half, y: y0, z: TOWER.z });
      if (g0) {
        var gx0 = Math.min(la.x, lb.x), gx1 = Math.max(la.x, lb.x);
        var gy0 = Math.min(la.y, g0.y), gy1 = Math.max(la.y, g0.y);
        var nSpk = Math.max(0, Math.min(260, Math.round((gx1 - gx0) * (gy1 - gy0) * 0.035)));
        for (var sI3 = 0; sI3 < nSpk; sI3++) {
          var h1t = Math.sin(sI3 * 12.9898 + y0 * 3.7) * 43758.5453; h1t -= Math.floor(h1t);
          var h2t = Math.sin(sI3 * 78.233 + y0 * 1.3) * 43758.5453; h2t -= Math.floor(h2t);
          var h3t = Math.sin(sI3 * 39.425 + y0 * 7.1) * 43758.5453; h3t -= Math.floor(h3t);
          var tx3 = gx0 + h1t * (gx1 - gx0), ty3 = gy0 + h2t * (gy1 - gy0);
          /* brighter on the side the moon is on, same as the storey's own gradient */
          var lt3 = towLit < 0 ? (1 - h1t) : h1t;
          var at3 = (0.018 + 0.05 * h3t) * (0.35 + 0.95 * lt3);
          if (at3 < 0.012) continue;
          ctx.fillStyle = h3t > 0.5
            ? 'rgba(186,204,232,' + at3.toFixed(3) + ')'
            : 'rgba(10,15,26,' + (at3 * 1.2).toFixed(3) + ')';
          ctx.fillRect(tx3, ty3, 1.1, 1.1);
        }
      }
    }

    var e0 = project({ x: TOWER.x + towLit * half, y: y0, z: TOWER.z });
    var e1 = project({ x: TOWER.x + towLit * half, y: y1, z: TOWER.z });
    if (e0 && e1) {
      ctx.strokeStyle = 'rgba(196,214,240,.20)';
      ctx.lineWidth = Math.max(0.8, e0.s * 0.10);
      ctx.beginPath(); ctx.moveTo(e0.x, e0.y); ctx.lineTo(e1.x, e1.y); ctx.stroke();
    }
  }
  function teaves(y, half, lift) {
    /* A Tang eave is a thin wide plate whose corners tick up, not a dome. Drawn as one
     * bulging curve the tower came out as three equal drums under three domes and read
     * as a lighthouse or a chess piece. The plate is shallow, it oversails the storey
     * below it by a long way, and only the last stretch at each end lifts. */
    var pts2 = [];
    function PT(fx, fy) { return project({ x: TOWER.x + half * fx, y: y + lift * fy, z: TOWER.z }); }
    /* The corners lift harder than they did. At a hundred metres the tower is 150px tall
     * and 35px wide, so the SILHOUETTE is the whole of it: three critics running read the
     * old one as a lighthouse, and the flying eave is the one line that says otherwise. */
    /* THE PROFILE, third attempt, and the first two failed for the same reason: the
     * eave's TOP edge was straight. Sweeping the outer half up made a splayed umbrella
     * ("两圈外张的伞状檐"); flattening it and ticking only the tip up drew a flat
     * plate ("檐口完全平直、端部微微下垂"). Both times the building was still read as
     * a lighthouse, because from a hundred metres the eave IS the building: it is six
     * pixels deep and sixty wide, and the only thing the eye can resolve is whether its
     * outline sags or not.
     * 反宇: the top edge must SAG in the middle and rise at both ends, so the two corners
     * are the highest points of the whole eave and the line between them is concave. The
     * underside sags further and the two meet at the corner in a point — the 羼角. */
    var tipL = PT(-1.00, 1.05), tipR = PT(1.00, 1.05);
    var tcL = PT(-0.56, -0.02), tcR = PT(0.56, -0.02);     // control: pulls the ridge down
    var tMid = PT(0, 0.16);
    var ucL = PT(-0.72, -0.60), ucR = PT(0.72, -0.60);     // control: the deeper underside
    var uMid = PT(0, -0.34);
    if (!tipL || !tipR || !tcL || !tcR || !tMid || !ucL || !ucR || !uMid) return;
    ctx.beginPath();
    ctx.moveTo(tipL.x, tipL.y);
    ctx.quadraticCurveTo(tcL.x, tcL.y, tMid.x, tMid.y);    // down from the left 羼角
    ctx.quadraticCurveTo(tcR.x, tcR.y, tipR.x, tipR.y);    // and up to the right one
    ctx.quadraticCurveTo(ucR.x, ucR.y, uMid.x, uMid.y);    // back along the underside
    ctx.quadraticCurveTo(ucL.x, ucL.y, tipL.x, tipL.y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(19,26,40,.97)'; ctx.fill();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(180,202,232,.055)'; ctx.lineWidth = 4.5; ctx.stroke();
    ctx.strokeStyle = 'rgba(196,214,240,.15)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  }

  function troof(y, half, rise) {
    /* 攒尖顶. The top has now been a cone with a finial (read as a lighthouse lantern),
     * then a low flat ridge (read as "顶部是平的不是尖顶", and before that as a chimney).
     * What a river pavilion actually has is a pyramid whose four hips sag on the way up
     * and whose corners fly — the same 反宇 curve as the eaves below it, closed to a
     * point, with a small 宝顶 sitting on the apex. */
    function RT(fx, fy) { return project({ x: TOWER.x + half * fx, y: y + rise * fy, z: TOWER.z }); }
    var cL = RT(-1.00, 0.30), cR = RT(1.00, 0.30);          // the flying corners
    var apex = RT(0, 1.00);
    var hcL = RT(-0.42, 0.42), hcR = RT(0.42, 0.42);        // control: the hips sag
    var eL = RT(-1.00, 0.00), eR = RT(1.00, 0.00);
    var pk = apex;
    if (!cL || !cR || !apex || !hcL || !hcR || !eL || !eR) return;
    ctx.beginPath();
    ctx.moveTo(eL.x, eL.y);
    ctx.lineTo(cL.x, cL.y);
    ctx.quadraticCurveTo(hcL.x, hcL.y, apex.x, apex.y);
    ctx.quadraticCurveTo(hcR.x, hcR.y, cR.x, cR.y);
    ctx.lineTo(eR.x, eR.y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(17,24,38,.97)'; ctx.fill();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(180,202,232,.05)'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = 'rgba(196,214,240,.14)'; ctx.lineWidth = 1; ctx.stroke();
    /* the 宝顶: a bead, not the vertical spike that made a lantern housing of it */
    var fin = project({ x: TOWER.x, y: y + rise * 1.16, z: TOWER.z });
    if (fin && pk) {
      ctx.fillStyle = 'rgba(24,33,50,.95)';
      ctx.beginPath(); ctx.arc(fin.x, fin.y, Math.max(0.8, pk.s * 0.13), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(196,214,240,.16)'; ctx.lineWidth = 0.8; ctx.stroke();
    }
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
  }

  function trail(y, half) {
    /* Was a comb of nine uprights with a handrail across the top: at 35px wide that is
     * an observation gallery, and a gallery ringing every storey is the second half of
     * the lighthouse read. A 楼台 on a river gets one thin balcony line under its
     * eave and nothing else — there is no one standing on it to need a railing. */
    var ha = project({ x: TOWER.x - half, y: y + 0.55, z: TOWER.z });
    var hb = project({ x: TOWER.x + half, y: y + 0.55, z: TOWER.z });
    if (ha && hb) {
      ctx.strokeStyle = 'rgba(196,214,240,.13)';
      ctx.lineWidth = Math.max(0.8, ha.s * 0.09);
      ctx.beginPath(); ctx.moveTo(ha.x, ha.y); ctx.lineTo(hb.x, hb.y); ctx.stroke();
    }
  }

  /* the bank it stands on. Without it the tower's foot sat exactly on the waterline and
   * it read as an icon pasted into the sky above the far shore rather than as a building
   * standing on the other side of the river. */
  var tb = [];
  for (var tbI = 0; tbI <= 26; tbI++) {
    var tba = (tbI / 26) * Math.PI * 2;
    var tbq = project({ x: TOWER.x + Math.cos(tba) * (15 + 3 * Math.sin(tba * 3)),
                        y: 0.35, z: TOWER.z + Math.sin(tba) * (7 + 1.6 * Math.sin(tba * 2)) });
    if (!tbq) { tb = null; break; }
    tb.push(tbq);
  }
  if (tb && tb.length > 3) {
    ctx.beginPath(); ctx.moveTo(tb[0].x, tb[0].y);
    for (var tbJ = 1; tbJ < tb.length; tbJ++) ctx.lineTo(tb[tbJ].x, tb[tbJ].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(21,30,46,.85)'; ctx.fill();
    ctx.strokeStyle = 'rgba(150,172,202,.10)'; ctx.lineWidth = 5; ctx.stroke();
  }

  reflect(TOWER.x, TOWER.z, 20, TW * 0.7, 'rgba(178,198,228,$A)', 0.16);

  /* Three storeys, and narrower. Two squat ones under one wide eave made a silhouette
   * about as tall as it was wide, and every critic who looked at it said the same word:
   * a top hat. A Tang tower is slender and it steps in as it rises. */
  /* The storeys used to step 0.62 -> 0.50 -> 0.40 under eaves that ALSO narrowed,
   * 0.94 -> 0.80 -> 0.62, and the whole thing then came to a point: a cone, which is a
   * lighthouse however the details are drawn. A pavilion reads instead as a stack of
   * wide hats — the body barely tapers, and every eave oversails the storey under it by
   * half as much again, so the silhouette steps OUT at each floor before it steps in. */
  /* The eaves used to narrow as they rose (1.12 -> 1.05 -> 0.96) on a body that also
   * tapered hard (0.66 -> 0.52 -> 0.39). Sum: a triangle, and a critic reported exactly
   * that — "细长的圆锥塔身、越往下越粗". A pavilion's eaves are all very nearly the
   * same span whatever floor they are on; it is the BODY that steps in behind them, so
   * the silhouette is a stack of plates on a hidden shaft, never a cone. */
  tface(0, 8.6, TW * 0.60, 'rgba(24,33,50,.95)');
  teaves(8.6, TW * 1.16, 2.3);
  trail(9.9, TW * 0.58);
  tface(10.6, 17.8, TW * 0.52, 'rgba(28,38,56,.95)');
  teaves(17.8, TW * 1.14, 2.3);
  trail(19.1, TW * 0.50);
  tface(19.8, 25.8, TW * 0.45, 'rgba(32,42,62,.95)');
  troof(25.8, TW * 1.12, 3.2);

  var wp = project({ x: TOWER.x + 1.2, y: 14.2, z: TOWER.z - 0.25 });
  if (wp) {
    /* 何处相思明月楼 — one window, and far away. The halo used to come out very nearly
     * the moon's own diameter and brighter at its heart, so the eye went to the tower
     * first and the moon second; in this poem nothing outshines the moon. */
    var ws = Math.max(2.0, 1.7 * wp.s);
    var gl = ctx.createRadialGradient(wp.x, wp.y, 0, wp.x, wp.y, ws * 3.6);
    gl.addColorStop(0, 'rgba(255,206,138,.22)');
    gl.addColorStop(0.35, 'rgba(255,196,124,.07)');
    gl.addColorStop(1, 'rgba(255,196,124,0)');
    ctx.fillStyle = gl; ctx.fillRect(wp.x - ws * 3.6, wp.y - ws * 3.6, ws * 7.2, ws * 7.2);
    /* a lattice window, and its light spilling past its own frame — a flat orange
     * rectangle was the last hard-edged thing left in the picture */
    var wgr = ctx.createLinearGradient(wp.x - ws * 0.5, 0, wp.x + ws * 0.5, 0);
    wgr.addColorStop(0, 'rgba(255,214,152,.62)');
    wgr.addColorStop(0.5, 'rgba(255,228,178,.92)');
    wgr.addColorStop(1, 'rgba(255,214,152,.62)');
    ctx.fillStyle = wgr;
    ctx.fillRect(wp.x - ws * 0.5, wp.y - ws * 0.8, ws, ws * 1.6);
    if (ws > 6) {
      ctx.strokeStyle = 'rgba(120,88,52,.45)';
      ctx.lineWidth = Math.max(0.7, ws * 0.055);
      for (var mI = 1; mI <= 2; mI++) {
        var mX = wp.x - ws * 0.5 + ws * (mI / 3);
        ctx.beginPath(); ctx.moveTo(mX, wp.y - ws * 0.8); ctx.lineTo(mX, wp.y + ws * 0.8); ctx.stroke();
      }
      var mY = wp.y - ws * 0.8 + ws * 1.6 * 0.42;
      ctx.beginPath(); ctx.moveTo(wp.x - ws * 0.5, mY); ctx.lineTo(wp.x + ws * 0.5, mY); ctx.stroke();
    }
    /* 玉户帘中卷不去 — the lamp lies down on the river and will not be rolled away.
     * The reflection itself is NOT drawn here. The tower belongs to drawFarBank(), which
     * runs before drawWater(), so for as long as this call sat here the river was painted
     * straight over the window's column and the tower stood on a blank water with a lit
     * window — while the boat's lantern, drawn after the water, kept its own. A critic
     * seeing only the frame called it out exactly: "一座亮着窗的塔立在平静江面上，
     * 水里一条倒影都没有...同一片水跑两套物理". It is drawn from drawTowerGlow()
     * below, which drawFrame() calls after the water. If you add any other light that
     * lives on the far bank, put its reflection there too. */
  }
  ctx.restore();
}

function waterTop() {
  /* where the water meets the sky, for this eye */
  var fw = project({ x: cam.x + Math.sin(cam.yaw) * 9000, y: 0, z: cam.z + Math.cos(cam.yaw) * 9000 });
  return fw ? fw.y : H * 0.5;
}

function drawWater(moonP) {
  var hy = waterTop();
  var g = ctx.createLinearGradient(0, hy, 0, H);
  g.addColorStop(0.00, '#16243a');
  g.addColorStop(0.16, '#101b2e');
  g.addColorStop(1.00, '#070d18');
  ctx.save();
  /* Started a little above the join and faded in. Clipped exactly at the horizon, the
   * water's own fill left a one-pixel rule straight across the picture and cut 江天一色
   * into two flat halves. */
  ctx.beginPath(); ctx.rect(0, hy - 26, W, H - hy + 26); ctx.clip();
  ctx.fillStyle = g; ctx.fillRect(0, hy, W, H - hy);
  var jg = ctx.createLinearGradient(0, hy - 26, 0, hy + 12);
  jg.addColorStop(0, 'rgba(22,36,58,0)');
  jg.addColorStop(1, 'rgba(22,36,58,.85)');
  ctx.fillStyle = jg; ctx.fillRect(0, hy - 26, W, 38);

  /* 滟滟随波千万里 — one field of wavelets over the whole river. Everywhere it is
   * faint ripple; along the moon's own azimuth the same field burns into a road
   * that runs from the moon's foot down to the water at your feet. */
  if (moonP) {
    var mdx = MOON.x - cam.x, mdz = MOON.z - cam.z;
    var ml = Math.hypot(mdx, mdz) || 1;
    var ux = mdx / ml, uz = mdz / ml;          // toward the moon, along the water
    var px = -uz, pz = ux;                     // across it
    /* 700 wavelets spread over three hundred metres of river is roughly one crest per
     * forty square metres: at that density the far water has nothing in it to compress
     * into a bright band, and the near water is a scattering of separate hairs. The cap
     * was set when this ran on software GL; on Metal the whole frame costs a couple of
     * seconds. The live figure stays where it is — that one runs on the reader's own
     * machine at 30fps, and the interactive page must not start spinning a fan. */
    var N = SHOT ? 6000 : 1400;
    for (var wi = 0; wi < N; wi++) {
      /* anchored to the world, not to the eye, so the river does not swim along with you */
      var wv = WAVES[wi];
      var h1 = wv.len;
      var wx = Math.cos(wv.ang) * wv.rad;
      var wz = Math.sin(wv.ang) * wv.rad;
      var ph = wv.ph;

      /* THE WAVELENGTH. Until this existed the field was a scatter: 20000 crests thrown
       * at random radii, so the water had no wavelength at all, and a scatter cannot
       * recede. Points spread evenly through depth project MORE densely towards the
       * bottom of the frame (the density goes as 1/(y-horizon)^2), so the near water came
       * out finer than the far water — the exact opposite of a plane lying down. Measured
       * on round 48: the vertical period between crests was 4.8, 5.0, 5.0 and 5.1 px in
       * four bands from the horizon to the bottom edge. Flat. Two critics running called
       * the river brushed metal, a wallpaper of ruled lines, hair on a scanner.
       * Lengthening the near strokes does NOT fix it; the spacing is what carries
       * perspective, and the spacing comes from where the crests are in the world.
       *
       * So the crests are snapped onto parallel wave trains 4.6m apart, measured along
       * one swell axis. A train 4.6m apart subtends 80px at 10m and 4px at 200m, which is
       * the compression the eye is looking for, and it falls out of the projection for
       * free. This is done HERE and not in the WAVES table on purpose: the table is built
       * from the shared rnd(), and inserting or reordering a single draw from that LCG
       * moves the sand, the grove and the far bank (see AGENTS.md). Nothing below
       * consumes rnd(); it only rearranges points the table already produced. */
      var SWX = 0.28, SWZ = 0.96;                    // the swell runs roughly up-river
      var WLEN = 4.6;                                // metres between crests
      var along = wx * SWX + wz * SWZ;
      var crest = Math.round(along / WLEN);
      /* the whole crest breathes together — keyed to the crest, not to the wavelet, or
       * the train is torn apart by its own jitter (the old per-wavelet swell moved each
       * crest 1.5m inside a 4.6m wavelength, which is no wavelength at all) */
      var swell = Math.sin(T * 0.50 + crest * 0.70) * 0.85
                + Math.sin(T * 0.31 - crest * 0.23) * 0.55;
      /* and it bows: a crest on a river is not a ruled line. Keyed to the crest and to
       * the position along it, so neighbouring wavelets bow together. */
      var acrossW = -wx * SWZ + wz * SWX;
      var bowW = Math.sin(acrossW * 0.085 + crest * 0.9) * 0.62;
      var shift = crest * WLEN + swell + bowW - along;
      wx += shift * SWX;
      wz += shift * SWZ;
      if (Math.hypot(wx, wz) < edgeR(Math.atan2(wz, wx)) * 0.99) continue;   // not on the bar

      var vx = wx - cam.x, vz = wz - cam.z;
      /* `along` measures distance in the moon's direction, and culling on it threw away
       * every wavelet that was not in front of the moon — so a station looking any other
       * way was given a river with no surface at all. The field is culled on true
       * distance now; the moon's axis only decides which of them burn. */
      var along = Math.hypot(vx, vz);
      if (along < 1) continue;
      var lateral = vx * px + vz * pz;
      var fwd = vx * ux + vz * uz;
      if (fwd < 0) lateral = Math.max(Math.abs(lateral), -fwd);
      var half = 1.2 + along * 0.075;
      var near = Math.max(0, 1 - Math.abs(lateral) / (half * 3.2));

      var p = project({ x: wx, y: 0, z: wz });
      if (!p) continue;
      var flick = 0.42 + 0.58 * Math.sin(T * 1.7 + ph * 2.3);
      /* the off-axis floor had to come back down once the field was fifteen times as
       * dense: at the old weight the near water curdled into soft grey blotches */
      /* 何处春江无月明 — the river away from the road is still lit river, not a colour.
       * Only the road was carrying any texture at all and everything either side of it
       * read as one flat fill. */
      var alpha = (0.30 + 0.40 * near * near * flick) * flick * Math.max(0.22, 1 - along / 320);
      if (alpha < 0.014) continue;
      /* seen at a grazing angle, a wavelet is a flat sliver: wide, and almost no height.
       * The cap used to be 17px, which every wavelet within about ten metres reached — so
       * the crest at your feet was drawn exactly as long as the crest forty metres out,
       * and the water never receded. A critic measured the consequence off the frame: the
       * vertical period held at 7-13px the whole way from the horizon to the bottom edge,
       * and the river read as "一张不随距离变化的刻线壁纸" — brushed metal hung
       * vertically rather than a plane lying down. The cap is now high enough that only
       * the very nearest crests reach it. */
      var len = Math.min(86, Math.max(1.6, (0.35 + 1.5 * h1) * p.s * 1.5));
      /* close to the eye a wavelet is still a wavelet: a thin bowed crest, not a bar.
       * Without the caps the nearest slivers grew into flat grey dashes on the water. */
      ctx.strokeStyle = 'rgba(214,232,252,' + (alpha * 0.55 * Math.min(1, 3.4 / Math.max(1, p.s))).toFixed(3) + ')';
      ctx.lineWidth = Math.min(4.2, Math.max(0.6, p.s * 0.30));   // capped at 1.5 it stayed a hair while the length grew
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x - len / 2, p.y);
      ctx.quadraticCurveTo(p.x, p.y - Math.min(9.0, len * 0.22) * wv.bow, p.x + len / 2, p.y);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }

    /* the road itself: sampled along the moon's azimuth so it never breaks, each rung
     * flattened by perspective and dimming with distance — 滟滟随波千万里 */
    /* Shards, not rungs. The road used to be laid in ranks at 1.028^i, five equal bars
     * per rank: at that spacing the ranks separate into hard white rectangles with black
     * seams between them, which reads as a broken video frame rather than as broken light.
     * Now every shard jitters its own distance inside its rank so the ranks interleave,
     * each one is short, round-capped and dimmer, and its brightness rides the same swell
     * phase as the water under it — 滟滟随波, light coming apart over a moving surface. */
    ctx.lineCap = 'round';
    for (var ri2 = 0; ri2 < (SHOT ? 2600 : 2000); ri2++) {
      var rc = ROAD[ri2];
      var rd = rc.d;
      if (rd < edgeR(Math.atan2(cam.z + uz * rd, cam.x + ux * rd)) * 0.2) continue;
      /* 近宽远窄 in SCREEN terms: the ratio of width to distance is what falls away, so
       * the road arrives as an open mouth and draws in towards the moon's foot */
      var rhalf = rd * (0.40 - 0.255 * Math.min(1, rd / 150));
      /* The swing is a function of distance alone, so every shard at the same distance
       * takes the SAME sideways push: it moves the road's whole centreline, not its
       * edges. At 0.55+0.85 of the half-width that displacement was up to 1.4 half-widths
       * — measured on round 46, the brightness-weighted centre of the lit water sat at
       * x=282 and x=549 in bands only thirty rows apart, while the moon stayed at x=479.
       * An independent critic read the result as a fan falling away to the lower left and
       * concluded the moon and the light on the water "不是同一个光源".
       * A real glitter path has a ragged EDGE but its centre lies on the moon's azimuth
       * at every distance, because each facet is lit only where it happens to tilt. So
       * the coherent swing is now a small fraction of the width — enough that the road
       * is not a ruled corridor — and the raggedness is left to each shard's own lat. */
      var wFall = Math.max(0.10, 1 - rd / 90);
      var wander = (Math.sin(rd * 0.055 + T * 0.30) * rhalf * 0.10
                  + Math.sin(rd * 0.021 - T * 0.17) * rhalf * 0.13) * wFall;
      var lat = rc.lat * rhalf + Math.sin(T * 0.85 + rc.ph) * rhalf * 0.3 + wander;
      var rx = cam.x + ux * rd + px * lat;
      var rz = cam.z + uz * rd + pz * lat;
      if (Math.hypot(rx, rz) < edgeR(Math.atan2(rz, rx))) continue;   // the bar interrupts it
      var rp = project({ x: rx, y: 0, z: rz });
      if (!rp) continue;
      var axis = 1 - Math.min(1, Math.abs(lat - wander) / rhalf);
      var sw = Math.sin(rd * 0.30 - T * 1.25) * 0.5 + 0.5;
      var fl = 0.30 + 0.70 * (0.45 * Math.sin(T * 2.1 + rc.ph * 2.3) + 0.55 * sw + 0.5) * 0.66;
      /* 滞滞随波千万里 has to be the brightest thing on the water. From the moonrise eye
       * the bar hides the near half of the road, so what is left of it — one band of open
       * water — has to carry the whole line, and at the old weight it did not: a critic
       * reported the moon as having no road at all while the tower's lamp had one. */
      var ra = (0.075 + 0.50 * fl) * axis * axis * Math.max(0.34, 1 - rd / 430);
      if (ra < 0.02) continue;
      var rlen = Math.min(130, Math.max(1.8, (0.5 + 1.1 * rc.len) * rp.s * 1.5));   // same clamp problem as the wavelets
      /* Each shard tilts a little and bows a little, and no two the same. Drawn as dead
       * level segments, a field of them reads as ruled lines however scattered they are —
       * six critics running called this road scan lines or a barcode. A crest seen along
       * the moon's own azimuth IS nearly level, so the tilt is small; it only has to be
       * enough that the eye stops finding rows in it. */
      var tilt2 = (rc.lat * 0.5 + Math.sin(rc.ph * 3.1) * 0.5) * rlen * 0.20;
      var bow2 = (rc.len - 0.5) * Math.min(3.0, rlen * 0.10);
      ctx.strokeStyle = 'rgba(232,244,255,' + (ra * 0.34).toFixed(3) + ')';
      ctx.lineWidth = Math.min(2.4, Math.max(0.9, rp.s * 0.34));
      ctx.beginPath();
      ctx.moveTo(rp.x - rlen * 0.62, rp.y - tilt2);
      ctx.quadraticCurveTo(rp.x, rp.y + bow2, rp.x + rlen * 0.62, rp.y + tilt2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(236,246,255,' + ra.toFixed(3) + ')';
      ctx.lineWidth = Math.min(1.3, Math.max(0.6, rp.s * 0.17));
      ctx.beginPath();
      ctx.moveTo(rp.x - rlen * 0.34, rp.y - tilt2 * 0.55);
      ctx.quadraticCurveTo(rp.x, rp.y + bow2 * 0.6, rp.x + rlen * 0.34, rp.y + tilt2 * 0.55);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';

    /* 春江潮水连海平 — long crests crossing the road, walking in towards the bar */
    /* 春江潮水连海平 / 江流宛转 — the tide walking in. Drawn as long polylines the
     * crests kept reaching the edges of the frame, and a crest wide enough to cross the
     * picture is, in projection, a ruled line however hard its ends are faded: the eye
     * reads the straight middle, not the soft tips. So the tide is a field of short
     * bowed arcs instead, each one a piece of a crest, all of them walking in together
     * on the same period. Nothing is longer than a fraction of the screen, and the arcs
     * of one crest line up into a curve without any of them being a line. */
    ctx.lineCap = 'round';
    for (var ti = 0; ti < 34; ti++) {
      var period = 13;
      /* each crest keeps its own offset inside the period. Walking in at a strictly even
       * spacing, and each one broken into fifteen evenly-slotted pieces, the crests form
       * a regular lattice — which is what wove the near water into visible fabric. */
      var tj = Math.sin(ti * 45.31) * 43758.5453; tj -= Math.floor(tj);
      var td = 5 + (ti + (tj - 0.5) * 0.85) * period - ((T * 3.1) % period);
      if (td < 3) continue;
      var tw = 26 + td * 0.95;
      var tph = ti * 2.17;
      var tbase = 0.19 * Math.max(0, 1 - td / 260) * Math.min(1, td / 7);
      if (tbase < 0.008) continue;
      var pieces = 15;
      for (var pj = 0; pj < pieces; pj++) {
        var ph1 = Math.sin(ti * 23.7 + pj * 9.13) * 43758.5453; ph1 -= Math.floor(ph1);
        var ph2 = Math.sin(ti * 8.91 + pj * 33.7) * 43758.5453; ph2 -= Math.floor(ph2);
        var ss0 = (pj + 0.5 + (ph1 - 0.5) * 1.7 - pieces / 2) / (pieces / 2);
        var span = (0.55 + 0.9 * ph2) / pieces;
        var prev2 = null;
        for (var kk = 0; kk <= 4; kk++) {
          var ss = ss0 + (kk / 4 - 0.5) * span * 2;
          var swell = (Math.sin(ss * 3.1 + tph + T * 0.35)
                     + 0.5 * Math.sin(ss * 9.7 - tph * 1.6 + T * 0.21)) * tw * 0.085;
          var q = project({ x: cam.x + ux * (td + swell) + px * (ss * tw), y: 0,
                            z: cam.z + uz * (td + swell) + pz * (ss * tw) });
          if (!q) { prev2 = null; continue; }
          if (Math.hypot(q.x - cam.x, 0) > 1e6) { prev2 = null; continue; }
          if (prev2) {
            /* Long segments FADE, they are not dropped. A crest's segments get wider on
             * screen the further out to the side they run, so a hard cut at ninety
             * pixels removed every one of them past a certain column — and because all
             * thirty-odd crests cut at the same place, the river was left with a clean
             * vertical step down its middle, the "rectangular bright patch with a square
             * edge" four critics in a row reported and none of us could find. */
            var seglen = Math.abs(q.x - prev2.x);
            {
              var fade = (1 - Math.min(1, Math.abs(ss))) * Math.min(1, 110 / Math.max(28, seglen));
              ctx.strokeStyle = 'rgba(178,204,236,' +
                (tbase * fade * (0.45 + 0.55 * ph1)).toFixed(3) + ')';
              ctx.lineWidth = Math.min(1.5, Math.max(0.7, 0.9 + 5 / Math.max(4, td)));
              ctx.beginPath(); ctx.moveTo(prev2.x, prev2.y); ctx.lineTo(q.x, q.y); ctx.stroke();
            }
          }
          prev2 = q;
        }
      }
    }
    ctx.lineCap = 'butt';
  }

  ctx.restore();

}

function drawHaze() {
  /* 斜月沉沉藏海雾 — haze along the join, so water and sky are one colour. It runs as
   * its own pass after the far bank and the meadow, not inside the water: laid under
   * them it left the meadow's far edge standing out over the river as a ruled line. */
  var hy = waterTop();
  var hg = ctx.createLinearGradient(0, hy - 58, 0, hy + 40);
  hg.addColorStop(0, 'rgba(120,150,186,0)');
  hg.addColorStop(0.55, 'rgba(126,156,192,.19)');
  hg.addColorStop(1, 'rgba(120,150,186,0)');
  ctx.fillStyle = hg; ctx.fillRect(0, hy - 58, W, 98);
}

/* Anything standing on this river throws its light back, stretched and broken by
 * the swell: 江潭落月复西斜 — the water never gives an image back whole. */
function reflect(x, z, height, halfWidth, colour, strength) {
  var base = project({ x: x, y: 0, z: z });
  if (!base) return;
  var drop = Math.max(6, height * base.s * 0.85);
  /* The row count used to be a flat fourteen whatever the drop was. That is fine for a
   * hull's short smear, but a lamp's column on the water is many times its own height
   * long, and fourteen rows spread over a hundred and thirty pixels is a ladder, not a
   * reflection. One row every three pixels, capped so a very long column stays cheap. */
  var rows = Math.max(14, Math.min(64, Math.round(drop / 3)));
  for (var i = 0; i < rows; i++) {
    var t = i / rows;
    var yy = base.y + t * drop;
    /* the wander has to grow with the column, or a long one comes back ruler-straight */
    var wob = Math.sin(T * 1.25 + i * 0.75 + x * 0.3) * (1.2 + t * 5.5 * (1 + drop / 90));
    /* A reflection on water WIDENS towards the eye — the near facets are tilted through
     * a bigger range of angles, so they scatter the light over a bigger arc. This used to
     * narrow (1 - t*0.35), which is what a mirror does, not what a river does. */
    var len = Math.max(3, halfWidth * 2 * base.s * (0.75 + t * 1.55));
    /* The flicker was sin(T*1.9 + i*1.3): 1.3 radians per ROW, a period of 4.8 rows.
     * Once the rows went dense that beat became a regular ladder of bright and dark, and
     * an independent critic counted "八个等大、等间距、边缘锐利的橙色小方块" and
     * called it a dotted line rather than light. The flicker has to live in t — the
     * fraction of the way DOWN the column — so its period is the column, not the row
     * count, and two incommensurable terms keep it from repeating. */
    var a = strength * (1 - t) * (1 - t * 0.35)
          * (0.58 + 0.42 * (0.6 * Math.sin(T * 1.9 + t * 4.3) + 0.4 * Math.sin(t * 9.7 - T * 1.1)));
    if (a < 0.012) continue;
    ctx.strokeStyle = colour.replace('$A', a.toFixed(3));
    /* at least 1.6x the row pitch, so a dense column closes up into one body of light
     * instead of leaving a gap between every pair of rows */
    ctx.lineWidth = Math.max(base.s * 0.22 * (1 - t * 0.4), (drop / rows) * 1.6, 0.7);
    ctx.beginPath();
    ctx.moveTo(base.x - len / 2 + wob, yy);
    ctx.lineTo(base.x + len / 2 + wob, yy);
    ctx.stroke();
  }
}

function drawBoat() {
  /* 谁家今夜扁舟子 — a skiff: the sheer sweeps up at both ends, and it never arrives */
  var a = boat.th + T * boat.drift;
  var bx = Math.cos(a) * boat.r, bz = Math.sin(a) * boat.r;
  var bob = Math.sin(T * 0.7) * 0.10;
  var tilt = Math.sin(T * 0.53) * 0.06;

  /* the hull's own reflection, kept faint and broken: at full strength the fourteen
   * rows closed up into one white slab sitting under the boat like a shadow cast the
   * wrong way. 江潭落月复西斜 — the water gives back light, not the shape of the thing. */
  reflect(bx, bz, 3.2 * boat.s, 3.0 * boat.s, 'rgba(206,224,248,$A)', 0.085);

  var BS = boat.s;   // one scale for the whole skiff: hull, awning, oar, lantern
  function P(dx, dy) { return project({ x: bx + dx * BS, y: dy * BS + bob, z: bz }); }
  var bowU = P(3.6, 0.92 - tilt), bowL = P(2.9, 0.16 - tilt);
  var strU = P(-3.6, 0.92 + tilt), strL = P(-2.9, 0.16 + tilt);
  var midL = P(0, -0.04), midU = P(0, 0.74);
  if (!bowU || !bowL || !strU || !strL || !midL || !midU) return;

  ctx.beginPath();
  ctx.moveTo(strU.x, strU.y);
  ctx.quadraticCurveTo(strL.x, strL.y, midL.x, midL.y);       // the hull's bottom curve
  ctx.quadraticCurveTo(bowL.x, bowL.y, bowU.x, bowU.y);

    /* Brightest along the waterline, falling away towards your feet — which is both the
     * way a grazing angle actually gathers the moon and the only way this bar stops
     * taking the bottom half of every frame away from the river. Ramped the other way
     * round, the sand at your feet was the loudest thing in the picture. */
    /* The shore is dissolved by the FILL's own alpha, not by dark strokes laid over an
     * opaque fill afterwards. However wide and faint those strokes were, the sand still
     * went from water to bar in about eight pixels and read as a line ruled across the
     * frame; an alpha that comes up over the first fifty has no line in it anywhere.
     * 汀上白沙看不见. */

     * the eye counts it as one of three or four stacked bands of value — 「色阶带」. */
    var fadeH = Math.max(46, Math.min(190, (barBot - barTop) * 0.46));
    var t1 = Math.min(0.95, fadeH / Math.max(1, barBot - barTop));

     * 420-540 of 1-moonrise — averaged luminance 130, while the open water ran 22-46 and

     * the DARKEST thing you can see, because the water returns the moon and dry sand does

     * is the brightest thing in the picture and the sand is the darkest. */
    /* and then lifted a little off the floor. L36-63 made the bar the darkest thing in
     * the frame, which is right for the ground under your feet but wrong for THIS ground:
     * 白沙 is pale, and the line is 看不见 — you cannot find it — not 黑. It now starts

     * pale grey shoal that never announces its own edge, while the moon's road on the

     * At L169 the sand was the brightest thing in the frame with nothing lighting it and
     * the whole scene read as lit from below. At L36 it was the darkest, and a critic

     * what the poem says. The obvious remaining move, taking it DOWN to the river's own

     * body at the waterline; it is catching the pale band that lies ON the lip, and
     * lowering the sand only raised that band's contrast against it. So the bar sits a
     * little above the water at L56 falling to L44, and the edge is fought where the edge
     * actually is — in the band, a hundred lines below. */

    g.addColorStop(t1 * 0.45, 'rgba(56,64,82,.52)');
    g.addColorStop(t1, 'rgba(56,64,82,1)');

    g.addColorStop(1, 'rgba(38,45,60,1)');

     * lip closed down to the bottom of the frame, and a grain sitting on the ring's far
     * side projects ABOVE that lip, out over open water. Culling by distance alone let
     * those through as a spray of white dots across the river. */
    barPath = new Path2D();
    barOutline(barPath);

    ctx.save(); ctx.clip();

     * full-width gradient keyed to the lip's HIGHEST point it darkened everything under
     * the high side of the shore — from the grove station that was half the bar, and the
     * bar came back looking like two different beaches joined down the middle. */
    /* along the shore as DRAWN. Once the bar's silhouette became a per-column envelope,
     * the ring the softening still followed had drifted off it, and the fill's own top
     * edge was left standing: a near-horizontal hard line ruled the width of the frame,
     * with a corner in it where the envelope turned. */

     * shape. Stroked, they came out at close range as long pale CREASES ruled straight
     * across the sand — the bar read as an untextured low-poly mesh with its facets
     * showing. A patch has no edges to show. Placed from hashes of their own index, so
     * the same dunes stand in the same places in every round's shot. */

      var d2 = Math.sin(dI * 78.233) * 43758.5453;  d2 -= Math.floor(d2);
      var d3 = Math.sin(dI * 39.425) * 43758.5453;  d3 -= Math.floor(d3);
      var d4 = Math.sin(dI * 21.77) * 43758.5453;   d4 -= Math.floor(d4);

       * thousand pixels across, and thirty of those at five per cent white washed the
       * whole foreground back up to one flat value whatever the sand's own ramp did. */
      var drad = Math.max(12, Math.min(dp.s * 2.2, 170));
      /* A ridge is a pale face and a dark one beside it. Painted as pale patches alone
       * the bar had blotches but no relief, and every critic read it as a flat plane with
       * noise on it. The dark half is offset AWAY from the moon, so the whole bar is
       * modelled by the same light as everything else in the picture. */

         * lit face of a dune on sand that was itself near-white; on sand at L36-63 it
         * blows out. The lit face is a moonlit grey now, the shaded one true shadow. */

     * that is less than a pixel, so every speck in it landed on the same screen row and
     * the belt became a two-pixel white rope drawn along the waterline — the sharpest

    /* 汀上白沙看不见 is about CONTRAST, not about darkness. Measured on round 53, the

     * L85-100 — a step of thirty to fifty at the waterline, and a blind critic reported
     * the bar as "全画面最亮、轮廓最清楚的一条弧线" and noted that the subtitle
     * under it says the opposite. The step is this belt: it straddles the lip, so it
     * paints a bright rope exactly where the poem wants the eye to fail. (Nor is the
     * answer to black the sand out — an earlier critic caught that too: "把汀上白沙
     * 看不见做成了沙滩是黑的所以看不见". The sand stays a pale grey; what goes is

     * the sand, but at near-white on a bar this dark the belt came back as sugar. */

     * weight it was the brightest line in the picture, which draws the boundary the poem
     * says you cannot find. */
    ctx.strokeStyle = 'rgba(214,226,244,' + (0.006 * lw).toFixed(3) + ')';
    ctx.lineWidth = lw * 7.0; ctx.stroke();
  }
  ctx.restore();

  /* The shoreline itself, eaten by grains. Everything else that softens this edge works
   * on VALUE — the fill's alpha ramp, the wash outside it — and a soft ramp is still a
   * ramp: five critics in a row have said the shore is the sharpest line in the picture,
   * which is the one thing 汀上白沙看不见 forbids. What actually destroys an edge is
   * grain crossing it. This band is walked along the shore as it was DRAWN, a few specks
   * per screen column, thickest right on the line and thinning both ways; the specks are
   * hashed from the column's own world position so they stay with the sand, and the band
   * is narrow enough that no lattice can show through it. */
  if (barEnv && barPathCols) {
    var bandN = 7;
    for (var xC = 0; xC < barPathCols.length; xC++) {
      var eY = barPathCols[xC];

       * the shore was highest, which is exactly backwards for perspective */

        var f3b = Math.sin(xC * 19.3 + bK * 53.1) * 43758.5453; f3b -= Math.floor(f3b);

         * weighted (1 - |off|) — brightest exactly ON the shore — in near-white at up to
         * half an alpha, so it laid a rope of L139 specks along a shore whose sand and
         * water both sit near L45. Measured: 298 bright spikes along the lip, mean peak
         * 139, and blind critics calling it "全画面最亮、轮廓最清楚的一条弧线" while
         * the subtitle under it reads 汀上白沙看不见. Silencing the bar's fill, its
         * wash, its grains and the wet belt each changed the number by less than two,
         * which is exactly why this gets measured rather than argued (AGENTS.md).
         * The weighting is inverted now: the specks thin out towards the shore, so the
         * line itself is the emptiest place on the bar. Inverting it took the step at the
         * lip from a median of 32 to 20, the best any version of this has measured. */
        var aB = (0.35 + 0.65 * Math.abs(off)) * (0.045 + 0.095 * f3b);

          : 'rgba(110,124,152,' + (aB * 0.8).toFixed(3) + ')';

  }

   * twenty metres off, and it always will be: a grain field of even density in the world
   * is spread over more and more pixels the nearer it gets to the eye. Four critics in a
   * row called the foreground a flat fill with noise on it, and three different fixes
   * were built and measured against that:
   *   - each far grain standing in for a patch and scattering into sub-specks: at every
   *     setting the patches became the texture — first pebbles, then pale blotches, in
   *     the end plainly visible rectangles;
   *   - a quarter-metre lattice laid around the camera: thins out towards the eye for
   *     exactly the same reason as the world field, because it is still a world field;
   *   - walking the pixels and un-projecting each one onto the ground, hashing the grain
   *     from where it lands: even density at last, but the three-pixel sampling step and
   *     the hash cell together read as a woven lattice, and with the cell scaled by
   *     distance it still clots. A worse artefact than the smoothness it replaced.
   * What carries the foreground instead is the dune shading — paired lit and shaded
   * faces, the shaded one always away from the moon — and the drift field that makes the
   * grain coarse in some stretches and swept smooth in others. If you try again, the
   * thing to beat is a regular lattice showing through at STEP-sized spacing. */

  /* grains of sand, and 空里流霜不觉飞 drifting just above them */
  for (i9 = 0; i9 < grains.length; i9++) {
    var gr = grains[i9];
    var gp = project({ x: gr.x, y: gh(gr.x, gr.z), z: gr.z });
    if (!gp || gp.z > 130) continue;
    if (barPath && !ctx.isPointInPath(barPath, gp.x, gp.y)) continue;
    var near2 = 1 - Math.min(1, gp.z / 130);
    /* Sand has to be grain against sand, not white against dark. The old speckle was a
     * pale dot at a fifth of an alpha laid on a bar that is itself nearly white, so the
     * bar came back as one flat slab from every camera however many grains were thrown
     * at it. Half the grains are darker than the sand now and half are lighter, both at
     * a weight you can see, so the surface has a texture without getting any brighter —
     * which is the whole of 汀上白沙看不见: not dark, not loud, just impossible to fix. */
    /* the cap was two pixels, which every grain within twenty metres hit, so the whole
     * bar was covered in dots of one size — plainly a noise texture rather than sand
     * seen at a distance and sand seen at your feet */
    var gsz = Math.max(0.8, Math.min(2.8, gp.s * 0.032));
    /* and the biggest ones have to be the faintest, or the sand at your feet turns into
     * a scatter of little pale tiles */
    /* Sand is not evenly grained. A single density everywhere is exactly what makes a
     * scatter read as a noise texture laid over a flat fill; real sand has coarse drifts
     * and swept-smooth stretches. This is a slow field in world space, so the drifts stay
     * put as you walk over them, and it also decides which grains appear at all. */
    var drift = 0.5 + 0.5 * Math.sin(gr.x * 0.46 + gr.z * 0.21)
                    * Math.sin(gr.z * 0.37 - gr.x * 0.17 + 1.3);
    if (gr.k > 0.52 + 0.48 * drift) continue;
    var ga = (0.09 + 0.30 * near2) * (0.45 + 0.55 * gr.k) * (0.45 + 0.95 * drift)
           * Math.min(1, 2.0 / Math.max(1, gp.s * 0.032)) * 1.45;
    /* Both of these were picked against a bar that was nearly white (L169 at the shore).
     * With the bar's ramp corrected to L63-36, the old "dark" grain at L138 was LIGHTER
     * than the sand it was supposed to be shading, so the pair no longer straddled the
     * surface — every grain read as a bright speck and the drift died. They straddle
     * the new ramp instead: the lit grain sits about 45 above the sand, the shaded one
     * about 15 below. */
    var gaL = 'rgba(86,97,120,' + ga.toFixed(3) + ')';
    var gaD = 'rgba(18,23,34,' + (ga * 0.80).toFixed(3) + ')';
    /* One speck, one grain, and simply a great many grains. Standing each grain in for a
     * patch of sand and scattering it into sub-specks was an attempt to hold the screen
     * density even into the foreground; at any setting the patches themselves became the
     * texture — first pebbles, then pale blotches, in the end plainly visible rectangles.
     * A grain field thinning towards your feet is what sand at a grazing angle actually
     * does, and the dune shading under it carries the surface where no single grain can
     * still be told apart. */
    ctx.fillStyle = gr.m > 0.5 ? gaL : gaD;
    ctx.fillRect(gp.x, gp.y, gsz, gsz);
    if (gr.m > 0.86) {                    // frost, a little above the sand, never felt falling
      var fp = project({ x: gr.x + Math.sin(T * 0.3 + gr.m * 9) * 1.4,
                         y: gh(gr.x, gr.z) + 0.6 + gr.m * 2.2, z: gr.z });
      if (fp && (!barPath || ctx.isPointInPath(barPath, fp.x, fp.y + 6))) {
        ctx.fillStyle = 'rgba(246,250,255,' + (0.05 + 0.16 * near2).toFixed(3) + ')';
        ctx.fillRect(fp.x, fp.y, 1.1, 1.1);
      }
    }
  }
}

function drawMeadow() {

   * down into open water and stopped in mid-air. It is the same plane as the river
   * (y = 0), so a trunk's foot lands exactly on its surface; only the colour changes,
   * and the channel between it and you stays water. */
  /* 绕: the river has to get round it, so the meadow starts well out from the bar and
   * leaves a channel of open water between your feet and the grove. */
  var inner = 28, outer = 112;
  /* Sampled in contiguous runs: from a camera standing inside the bend, part of the
   * meadow's arc falls behind the eye and projects to nothing. Bailing out on the first
   * such sample dropped the whole meadow and left the grove's trunks hanging in the air,
   * so each unbroken run is filled as its own piece instead. */

    var ma = -0.90 + (mi / 72) * 1.68;

    var n1 = project({ x: Math.cos(ma) * inner * wob, y: 0, z: Math.sin(ma) * inner * wob });
    var f1 = project({ x: Math.cos(ma) * outer * wob, y: 0, z: Math.sin(ma) * outer * wob });
    if (!n1 || !f1) { cur = null; continue; }
    if (!cur) { cur = { near: [], far: [] }; runs.push(cur); }
    cur.near.push(n1); cur.far.push(f1);

  for (var ri = 0; ri < runs.length; ri++) {
    var near = runs[ri].near, far = runs[ri].far, mj;
    if (near.length < 2) continue;

    ctx.moveTo(near[0].x, near[0].y);
    for (mj = 1; mj < near.length; mj++) ctx.lineTo(near[mj].x, near[mj].y);
    for (mj = far.length - 1; mj >= 0; mj--) ctx.lineTo(far[mj].x, far[mj].y);
    ctx.closePath();

     * under it and the meadow was invisible, which is how the grove ended up standing on
     * nothing. 芳甸 is grass, and grass under a full moon carries a little of it. */
