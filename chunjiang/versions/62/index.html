     * can land on the same y, and a degenerate gradient paints nothing at all — which is
     * why the meadow was in the frame and yet invisible. */
    var mTop = 1e9, mBot = -1e9, mk;
    for (mk = 0; mk < far.length; mk++) if (far[mk].y < mTop) mTop = far[mk].y;
    for (mk = 0; mk < near.length; mk++) if (near[mk].y > mBot) mBot = near[mk].y;
    if (!(mBot > mTop + 1)) mBot = mTop + 2;

    /* How near this piece of bank is. Seen from the boat or the moonrise station the
     * meadow is far off across the water, and painted at full strength it read there as
     * a lighter strip ruled flat across the picture by two straight edges. It is given
     * back to the haze with distance instead, and only the station standing beside it
     * ever sees it as ground. */
    /* One fill, and its ALPHA is what fades. The far edge used to be an opaque bank
     * painted over afterwards with an approximate water colour, which still left a step
     * — from the moonrise station that step was a straight line ruled from the left edge
     * of the frame to the middle of it, the single most artificial thing in the picture.
     * Now the meadow simply stops being there as it goes away, and the haze pass that
     * follows takes what is left. */
    var mg = ctx.createLinearGradient(0, mTop - 2, 0, mBot + 10);
    /* lifted. 芳甸 under a full moon is not a dark field — from the station that stands
     * across the channel from it the whole picture was going black, and 「汀上白沙看不
     * 见」had turned into 「什么都看不见」. */
    /* AND THEN MEASURED, because this fill is the answer to a defect that three blind
     * critics in a row attributed to something else. Each of them described "一条贯穿
     * 画面的发光亮带" cutting the sand from the water and said it made a liar of the
     * subtitle 汀上白沙看不见 — and every one of them, and I, read it as the bar's
     * own shoreline. It is not. Silencing drawSandbar left the band exactly where it was
     * (ridge 13.9 at y=371, unchanged); silencing drawMeadow took it to 1.2. The band is
     * THIS gradient's near edge — the meadow's own shore, lying across the frame behind
     * the bar. AGENTS.md says a defect is not necessarily drawn by the thing it appears
     * to sit on, and this is the clearest case of it in the project so far.
     * The old stops ran to L95 at the near edge against a river at L45, so the meadow's
     * bank was more than twice the brightness of the water: grass under a moon is not
     * brighter than the water beside it, for the same reason the sand is not — the water
     * gives the moon back and the grass does not. They now top out at L64, close enough
     * to the river that the bank is found by its texture rather than by a step, and the
     * lift is kept only far enough to stop the picture going black (which is what the
     * stops were raised for in the first place — do not simply put them back). */
    /* Taken down once more, and this is the setting the measurements land on. With the
     * stops at L64 the bank still stood +28 above the river across a thirty-row swell,
     * and a blind critic still called it the brightest edge in the lower half and still
     * said it contradicted 汀上白沙看不见. At these values the swell is about +10:
     * present, so the grove has ground under it and the picture does not go black, but
     * no longer an edge the eye can fix. Checked for what it is NOT, too: outside the
     * subtitle block there are only sixty-odd bright specks in the whole lower half and
     * removing the bar changes that by two, so there is no bead chain on the sand — the
     * "珠链" successive critics reported is this swell plus the subtitle's own text. */
    mg.addColorStop(0.00, 'rgba(36,47,63,0)');
    mg.addColorStop(0.22, 'rgba(38,49,66,.40)');
    mg.addColorStop(0.55, 'rgba(41,52,69,.90)');
    mg.addColorStop(1.00, 'rgba(45,57,75,.98)');
    ctx.fillStyle = mg; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.restore();
    /* the shore of it: a breath of pale, not a line — and drawn OUTSIDE the meadow's own
     * clip. Inside it, only the landward half of each stroke survived and the breath
     * stopped dead along the polygon's edge, which put a hard step of forty levels right
     * where the softest thing in the picture was supposed to be. */
    ctx.lineCap = 'round';
    for (var lw2 = 3; lw2 >= 1; lw2--) {
      var sPrev = null;
      for (mj = 0; mj < near.length; mj++) {
        if (sPrev) {
          var su = mj / (near.length - 1);
          var sEnds = Math.min(1, Math.min(su, 1 - su) / 0.22);
          if (sEnds > 0.01) {
            /* three passes of a 200-luminance stroke, 15/10/5 px wide, all laid along the
             * same chain of samples: they sum to roughly a tenth of an alpha on the bank
             * and that is most of what is left of the swell there. The breath still has
             * to exist — without it the meadow meets the river on a ruled polygon edge —
             * but at a third of the weight and in a colour nearer the water's own. */
            ctx.strokeStyle = 'rgba(150,168,196,' + (0.008 * lw2 * sEnds * sEnds).toFixed(3) + ')';
            ctx.lineWidth = lw2 * 5.0;
            ctx.beginPath(); ctx.moveTo(sPrev.x, sPrev.y); ctx.lineTo(near[mj].x, near[mj].y); ctx.stroke();
          }
        }
        sPrev = near[mj];
      }
    }
    ctx.lineCap = 'butt';

    /* 江流宛转绕芳甸 — the channel. The water that gets round the meadow runs shallow
     * along its bank and carries the moon there, the same way it does along the bar;
     * without it the near side of the meadow met dead black river on a line. */
    ctx.save();
    for (var chI = 0; chI < 22; chI++) {
      var chT = chI / 21;
      /* THE BAND. These twenty-two strokes are 34px wide, nearly white (L222), and their
       * weight used to be 0.030*(1-chT)^1.5 — strongest at chT=0, which is exactly the
       * meadow's own bank, and at chT=0 the offset below is also zero, so the heaviest
       * strokes all landed on the same line. Twenty-two of them summing there put a band
       * of L89 across a river of L45: "一条贯穿画面的发光亮带" — reported by three
       * blind critics running, every one of whom (and I) blamed the sandbar's waterline
       * and said it made a liar of 汀上白沙看不见. Silencing the whole sandbar did not
       * move it; silencing the meadow took the ridge from 13.9 to 1.2.
       * The weight peaks MID-CHANNEL now and goes to nothing at both the meadow's bank
       * and the open water, so the shallows still carry the moon along the bend — which
       * is the thing this layer exists for, and removing it puts dead black river against
       * the meadow on a line — but no edge in the picture is drawn by it. */
      var chA = 0.007 * Math.pow(Math.sin(Math.PI * chT), 1.2);
      if (chA < 0.003) continue;
      /* Segment by segment, fading out at both ends. Drawn as one polyline these
       * thirty-odd-pixel strokes simply STOPPED where the meadow's samples ran out, and
       * twenty-two of them stopping at the same place put a pale block of river in the
       * frame with one square vertical edge down its side — the artefact four critics
       * running described and three rounds of hunting through the sandbar could not
       * find, because it was never on the sand at all. */
      var chPrev = null;
      for (mj = 0; mj < near.length; mj++) {
        var fq2 = far[mj];
        var nx2 = near[mj].x + (near[mj].x - fq2.x) * 0.055 * chT * 6;
        var ny2 = near[mj].y + (near[mj].y - fq2.y) * 0.055 * chT * 6;
        if (chPrev) {
          var u = mj / (near.length - 1);
          var ends = Math.min(1, Math.min(u, 1 - u) / 0.22);
          if (ends > 0.01) {
            ctx.strokeStyle = 'rgba(206,218,238,' + (chA * ends * ends).toFixed(3) + ')';
            ctx.lineWidth = 34;
            ctx.beginPath(); ctx.moveTo(chPrev.x, chPrev.y); ctx.lineTo(nx2, ny2); ctx.stroke();
          }
        }
        chPrev = { x: nx2, y: ny2 };
      }
    }
    ctx.restore();
  }
}

function drawRings() {
  /* 鱼龙潜跃水成文 — 水成文: the water writes. Each ring opens, thins and is gone, and
   * it never closes into a hard circle: a few arcs of it at a time, the rest taken by
   * the swell. */
  for (var kR = 0; kR < RING.length; kR++) {
    var rg = RING[kR];
    var ph6 = ((T + rg.t0) % rg.period) / rg.period;
    if (ph6 > 0.85) continue;
    var rad6 = 0.6 + ph6 * 7.5;
    var aR = Math.sin(Math.PI * Math.min(1, ph6 / 0.85)) * 0.17 * (1 - ph6 * 0.55);
    if (aR < 0.01) continue;
    var prev6 = null, segs = 46;
    ctx.lineCap = 'round';
    for (var jR = 0; jR <= segs; jR++) {
      var th6 = (jR / segs) * Math.PI * 2;
      var wob6 = 1 + 0.10 * Math.sin(th6 * 3 + rg.t0);
      var q6 = project({ x: rg.x + Math.cos(th6) * rad6 * wob6, y: 0,
                         z: rg.z + Math.sin(th6) * rad6 * wob6 });
      if (!q6 || q6.z > 150) { prev6 = null; continue; }
      if (prev6) {
        /* only the stretches the light is on — a whole clean circle would read as a
         * drawn shape rather than as water */
        var lit6 = 0.5 + 0.5 * Math.sin(th6 * 2 + rg.t0 * 2.1 + T * 0.4);
        var sl6 = Math.hypot(q6.x - prev6.x, q6.y - prev6.y);
        var a6 = aR * lit6 * lit6 * Math.min(1, 16 / Math.max(5, sl6));
        if (a6 > 0.008) {
          ctx.strokeStyle = 'rgba(206,224,248,' + a6.toFixed(3) + ')';
          ctx.lineWidth = Math.max(0.7, Math.min(2.2, q6.s * 0.05));
          ctx.beginPath(); ctx.moveTo(prev6.x, prev6.y); ctx.lineTo(q6.x, q6.y); ctx.stroke();
        }
      }
      prev6 = q6;
    }
    ctx.lineCap = 'butt';
  }
}

function drawPetals() {
  /* 昨夜闲潭梦落花 — they turn slowly on the water, and the few still in the air come
   * down so slowly that nobody sees them fall: 空里流霜不觉飞 is the same idea one line
   * earlier. Faint, small, and never more than a hint. */
  for (var pI2 = 0; pI2 < PETAL.length; pI2++) {
    var pt = PETAL[pI2];
    var ang = pt.a + Math.sin(T * 0.11 * pt.sp + pt.ph) * 0.03;
    var rad2 = pt.r + Math.sin(T * 0.19 * pt.sp + pt.ph * 1.7) * 0.9;
    var py4 = pt.air ? (0.5 + 2.6 * (0.5 + 0.5 * Math.sin(T * 0.16 * pt.sp + pt.ph))) : 0.03;
    var pp = project({ x: Math.cos(ang) * rad2, y: py4, z: Math.sin(ang) * rad2 });
    if (!pp || pp.z > 70) continue;
    var pf = 0.45 + 0.55 * Math.abs(Math.sin(T * 0.7 * pt.sp + pt.ph * 2.1));
    var pa4 = (pt.air ? 0.30 : 0.42) * pf * Math.max(0.15, 1 - pp.z / 70);
    if (pa4 < 0.03) continue;
    var ps = Math.max(0.9, Math.min(3.2, pt.sz * pp.s * 0.055));
    ctx.fillStyle = 'rgba(246,244,248,' + pa4.toFixed(3) + ')';
    ctx.save();
    ctx.translate(pp.x, pp.y); ctx.scale(1, pt.air ? 0.8 : 0.34); ctx.translate(-pp.x, -pp.y);
    ctx.beginPath(); ctx.ellipse(pp.x, pp.y, ps, ps * 0.62, ang * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (!pt.air) {                    // what floats on this river gives its light back
      ctx.fillStyle = 'rgba(232,236,246,' + (pa4 * 0.3).toFixed(3) + ')';
      ctx.fillRect(pp.x - ps * 0.8, pp.y + ps * 0.5, ps * 1.6, Math.max(0.7, ps * 0.30));
    }
  }
}

function drawGrove() {
  /* which way the moon lies, in screen terms, for every crown in the wood */
  var mP = project({ x: MOON.x, y: MOON.y, z: MOON.z });
  /* the moon's bearing on the ground, for the shadows the wood throws */
  var mwl = Math.hypot(MOON.x, MOON.z) || 1;
  var moonWx = MOON.x / mwl, moonWz = MOON.z / mwl;
  var moonDirX = 0, moonDirY = -1;
  if (mP) {
    var mdx = mP.x - W * 0.5, mdy = mP.y - H * 0.5, mdl = Math.hypot(mdx, mdy) || 1;
    moonDirX = mdx / mdl; moonDirY = mdy / mdl;
  }
  /* 月照花林皆似霰 — a canopy of white, with a tree's shape: a crown that holds light,
   * a short trunk under it, and the blossom read as sleet caught in the crown. */
  for (var i7 = 0; i7 < grove.length; i7++) {
    var g = grove[i7];
    var y0 = gh(g.x, g.z);
    var sway = Math.sin(T * 0.5 + g.seed) * 0.10;
    /* the crown sits lower on the trunk, so the bare stretch between the blossom and the
     * ground stops reading as a stalk the tree is hanging from */
    var crownY = y0 + g.h * 0.66;
    var cp2 = project({ x: g.x + sway, y: crownY, z: g.z });
    if (!cp2) continue;
    var cr = Math.max(3, g.h * 0.62 * g.wid * cp2.s);

    /* 皆似霰 — 霰 is sleet: grains you could count. The crown used to be a big radial
     * gradient with three dozen flecks laid on top, which reads as a ball of cotton wool
     * near to and as a clean little dot cluster far off — two different pictures of the
     * same tree in one frame. It is one recipe now at every distance: a very faint halo
     * to sit the tree in the air, a few boughs, and a cloud of grains whose COUNT rises
     * with the crown's area so the density on screen stays the same however far away it
     * is. Everything is deterministic in i7/k2, so shots stay byte-reproducible. */
    ctx.save();
    ctx.translate(cp2.x, cp2.y); ctx.scale(1, 0.70); ctx.translate(-cp2.x, -cp2.y);
    /* barely there. At any real strength this halo is a glowing ring around the crown,
     * and it is what made every critic read the wood as fireworks or dandelion clocks
     * rather than as trees: a tree does not come with a light around it. */
    var cg = ctx.createRadialGradient(cp2.x, cp2.y, cr * 0.1, cp2.x, cp2.y, cr * 1.05);
    cg.addColorStop(0, 'rgba(232,240,252,.045)');
    cg.addColorStop(0.6, 'rgba(224,234,250,.018)');
    cg.addColorStop(1, 'rgba(220,232,248,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cp2.x, cp2.y, cr * 1.05, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    /* 月照花林 casts something. Without a shadow under it a tree is a sticker laid over
     * the ground, which is how the whole wood has been reading; a pool of dark on the
     * meadow, thrown away from the moon and squashed by the grazing angle, is enough to
     * set each tree down on the ground it stands on. */
    var shP = project({ x: g.x - moonWx * g.h * 0.55, y: y0 + 0.02,
                        z: g.z - moonWz * g.h * 0.55 });
    if (shP && shP.s > 0.4) {
      var shR = Math.max(3, g.h * 0.58 * g.wid * shP.s);
      ctx.save();
      ctx.translate(shP.x, shP.y); ctx.scale(1, 0.26); ctx.translate(-shP.x, -shP.y);
      var shG = ctx.createRadialGradient(shP.x, shP.y, 0, shP.x, shP.y, shR);
      shG.addColorStop(0, 'rgba(10,16,28,.34)');
      shG.addColorStop(0.55, 'rgba(12,18,30,.17)');
      shG.addColorStop(1, 'rgba(14,20,32,0)');
      ctx.fillStyle = shG;
      ctx.beginPath(); ctx.arc(shP.x, shP.y, shR, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    /* the trunk, and two boughs that reach up into the crown so it is held, not floating */
    var bp2 = project({ x: g.x, y: y0, z: g.z });
    if (bp2) {
      /* The trunk is made of the same stuff as the crown. Drawn as a line it stayed a
       * ruled hair-thin stick with a cloud of particles parked above it, and every critic
       * who saw these trees said the same thing: two pictures that do not belong to each
       * other, the crown floating and the stick hanging under it. So the trunk is specks
       * too — dense and dark at the foot, thinning and paling as it rises until the
       * blossom takes over, with nowhere along it that one becomes the other. */
      function tAt(tt) {
        var ax = bp2.x + (cp2.x - bp2.x) * 0.5 + cr * 0.06, ay = cp2.y + cr * 0.72;
        var m0 = (1 - tt) * (1 - tt), m1 = 2 * (1 - tt) * tt, m2 = tt * tt;
        return { x: m0 * bp2.x + m1 * ax + m2 * cp2.x,
                 y: m0 * bp2.y + m1 * ay + m2 * (cp2.y + cr * 0.18) };
      }
      var trH = Math.max(6, bp2.y - cp2.y);
      var trN = Math.max(40, Math.min(520, Math.round(trH * 2.8)));
      var trW = Math.max(1.3, 0.11 * cp2.s);
      var tsz = Math.max(0.8, Math.min(2.2, 0.05 * cp2.s));
      for (var tS = 0; tS < trN; tS++) {
        var v1 = Math.sin(i7 * 31.7 + tS * 19.31) * 43758.5453; v1 -= Math.floor(v1);
        var v2 = Math.sin(i7 * 13.3 + tS * 47.11) * 43758.5453; v2 -= Math.floor(v2);
        var v3 = Math.sin(i7 * 61.9 + tS * 7.77) * 43758.5453;  v3 -= Math.floor(v3);
        var tp2 = tAt(v1);
        var spread = trW * (0.42 + 1.3 * v1 * v1);
        var ta2 = (0.72 - 0.60 * v1) * (0.4 + 0.6 * v3);
        if (ta2 < 0.02) continue;
        ctx.fillStyle = 'rgba(46,56,76,' + ta2.toFixed(3) + ')';
        ctx.fillRect(tp2.x + (v2 - 0.5) * spread * 2, tp2.y, tsz, tsz);
      }
      ctx.lineWidth = Math.max(0.6, 0.075 * cp2.s);
      ctx.strokeStyle = 'rgba(50,60,80,.26)';
      for (var bI = -1; bI <= 1; bI += 2) {
        ctx.beginPath();
        ctx.moveTo(cp2.x, cp2.y + cr * 0.34);
        ctx.quadraticCurveTo(cp2.x + bI * cr * 0.34, cp2.y + cr * 0.20,
                             cp2.x + bI * cr * 0.62, cp2.y - cr * 0.10);
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
    }


    /* 皆似霰 — the blossom hangs on BOUGHS. Scattered over a disc it made a ball of even
     * noise, and every critic in turn called the wood fireworks, a spray can, a puff.
     * Each tree now throws five or six boughs out of the top of its trunk, each bough a
     * curve with its own direction and reach, and the sleet is laid ALONG them: thick
     * where the bough is, thinning as it gets away from it, thinning again towards the
     * tip. That gives the crown an outline no circle could give it, a structure you can
     * follow with your eye, and gaps of night through it. Everything is hashed off the
     * tree's index, so the same wood stands in every round's shot. */
    var nB = 5 + (i7 % 3);
    for (var bJ = 0; bJ < nB; bJ++) {
      var w1 = Math.sin(i7 * 91.7 + bJ * 27.3) * 43758.5453; w1 -= Math.floor(w1);
      var w2 = Math.sin(i7 * 43.1 + bJ * 61.9) * 43758.5453; w2 -= Math.floor(w2);
      var w3 = Math.sin(i7 * 17.9 + bJ * 83.1) * 43758.5453; w3 -= Math.floor(w3);
      /* boughs fan upward and outward, never straight down */
      /* a narrower fan, or the boughs reach so far sideways that neighbouring trees run
       * together into one long bank of blossom and no tree keeps a shape of its own */
      var bAng = -Math.PI * 0.86 + (bJ + 0.15 + 0.7 * w1) / nB * Math.PI * 0.72;
      var bLen = cr * (0.46 + 0.42 * w2);
      var bx0 = cp2.x, by0 = cp2.y + cr * 0.46;
      var bx1 = bx0 + Math.cos(bAng) * bLen * (1 + g.lean * 0.6);
      var by1 = by0 + Math.sin(bAng) * bLen * g.flat * 1.35;
      var bcx = bx0 + (bx1 - bx0) * 0.42 - Math.sin(bAng) * bLen * 0.22;
      var bcy = by0 + (by1 - by0) * 0.42 + Math.cos(bAng) * bLen * 0.12;
      /* the bough itself, only where it is thick enough to be seen through the blossom */
      ctx.strokeStyle = 'rgba(48,58,78,.30)';
      ctx.lineWidth = Math.max(0.6, 0.055 * cp2.s);
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx0, by0);
      ctx.quadraticCurveTo(bcx, bcy, bx0 + (bx1 - bx0) * 0.55, by0 + (by1 - by0) * 0.55);
      ctx.stroke();
      ctx.lineCap = 'butt';
      var nBl = Math.max(16, Math.min(190, Math.round(bLen * bLen * 0.10 * g.dens)));
      for (var kB = 0; kB < nBl; kB++) {
        var z1 = Math.sin(i7 * 51.13 + bJ * 13.7 + kB * 17.31) * 43758.5453; z1 -= Math.floor(z1);
        var z2 = Math.sin(i7 * 11.71 + bJ * 29.3 + kB * 29.07) * 43758.5453; z2 -= Math.floor(z2);
        var z3 = Math.sin(i7 * 7.19 + bJ * 71.1 + kB * 41.53) * 43758.5453; z3 -= Math.floor(z3);
        var z4 = Math.sin(i7 * 33.7 + bJ * 5.9 + kB * 63.7) * 43758.5453;  z4 -= Math.floor(z4);
        var tB = Math.pow(z1, 0.62);                    // more blossom out along the bough
        var m0 = (1 - tB) * (1 - tB), m1b = 2 * (1 - tB) * tB, m2 = tB * tB;
        var qx = m0 * bx0 + m1b * bcx + m2 * bx1;
        var qy = m0 * by0 + m1b * bcy + m2 * by1;
        /* a cloud around the bough, fatter out at the tip and thinner at the fork */
        var puff = cr * (0.075 + 0.20 * tB) * (0.45 + 0.8 * w3);
        var pa = z2 * 6.28318, pr = Math.sqrt(z3) * puff;
        var px3 = qx + Math.cos(pa) * pr;
        var py3 = qy + Math.sin(pa) * pr * g.flat;
        var lit = 0.5 + 0.5 * ((px3 - cp2.x) * moonDirX + (py3 - cp2.y) * moonDirY)
                        / Math.max(1, cr);
        lit = Math.max(0, Math.min(1, lit));
        var szB = Math.max(0.9, Math.min(2.6, 0.045 * cp2.s * (0.55 + 1.15 * z4)));
        var twB = 0.45 + 0.55 * Math.abs(Math.sin(z4 * 9 + T * 0.4));
        var gaB = (0.13 + 0.34 * (1 - pr / Math.max(0.001, puff) * 0.6)) * twB
                * (0.40 + 1.00 * lit * lit);
        if (gaB < 0.03) continue;
        ctx.fillStyle = 'rgba(248,251,255,' + gaB.toFixed(3) + ')';
        ctx.fillRect(px3 - szB / 2, py3 - szB / 2, szB, szB);
      }
    }
  }
}

/* -------------------------------------------------------------- PLAYER -- */
var keys = Object.create(null);
addEventListener('keydown', function (e) {
  keys[e.code] = true;
  if (['KeyW','KeyA','KeyS','KeyD','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  pokeLive();
});
addEventListener('keyup', function (e) { keys[e.code] = false; });

var stage = document.getElementById('stage');
var drag = null;
stage.addEventListener('pointerdown', function (e) {
  if (e.target.closest('#touch') || e.target.closest('#enter')) return;
  drag = { x: e.clientX, y: e.clientY };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  pokeLive();
});
stage.addEventListener('pointermove', function (e) {
  if (!drag) return;
  cam.yaw -= (e.clientX - drag.x) * 0.0031;
  cam.pitch -= (e.clientY - drag.y) * 0.0023;
  cam.pitch = Math.max(-0.42, Math.min(0.45, cam.pitch));
  drag = { x: e.clientX, y: e.clientY };
  pokeLive();
});
addEventListener('pointerup', function () { drag = null; });

var stick = document.getElementById('stick'), knob = stick.querySelector('b');
var jx = 0, jz = 0;
function jmove(e) {
  var r = stick.getBoundingClientRect();
  var dx = (e.clientX - r.left - r.width / 2) / (r.width / 2);
  var dy = (e.clientY - r.top - r.height / 2) / (r.height / 2);
  var m = Math.hypot(dx, dy) || 1;
  if (m > 1) { dx /= m; dy /= m; }
  jx = dx; jz = -dy;
  knob.style.transform = 'translate(' + (dx * 30) + 'px,' + (dy * 30) + 'px)';
}
stick.addEventListener('pointerdown', function (e) { try { stick.setPointerCapture(e.pointerId); } catch (err) {} jmove(e); });
stick.addEventListener('pointermove', function (e) { if (e.buttons || e.pressure) jmove(e); });
stick.addEventListener('pointerup', function () { jx = jz = 0; knob.style.transform = ''; });

function step(dt) {
  var still = !!keys['Space'];
  var fx = 0, fz = 0;
  if (keys['KeyW'] || keys['ArrowUp']) fz += 1;
  if (keys['KeyS'] || keys['ArrowDown']) fz -= 1;
  if (keys['KeyA'] || keys['ArrowLeft']) fx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) fx += 1;
  fx += jx; fz += jz;
  var m = Math.hypot(fx, fz);
  if (m > 1) { fx /= m; fz /= m; }
  var spd = (keys['ShiftLeft'] || keys['ShiftRight'] ? 9.5 : 4.4) * (still ? 0 : 1);
  var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  var wx = fx * cy + fz * sy, wz = -fx * sy + fz * cy;
  vel.x += (wx * spd - vel.x) * Math.min(1, dt * 7);
  vel.z += (wz * spd - vel.z) * Math.min(1, dt * 7);
  cam.x += vel.x * dt; cam.z += vel.z * dt;
  /* you may walk to the waterline and no further; the river keeps the rest */
  var rr = Math.hypot(cam.x, cam.z);
  var lip = edgeR(Math.atan2(cam.z, cam.x)) - 0.8;
  if (rr > lip) { cam.x *= lip / rr; cam.z *= lip / rr; vel.x *= 0.25; vel.z *= 0.25; }
  var moving = Math.hypot(vel.x, vel.z);
  cam.y = gh(cam.x, cam.z) + 1.62
        + Math.sin(T * 2.2) * 0.016 + Math.sin(T * 7.2) * 0.011 * Math.min(1, moving / 4.4);
}

/* ---------------------------------------------------------------- SUBS -- */
var subs = document.getElementById('subs');
var ticksEl = document.getElementById('ticks');
for (var i8 = 0; i8 < STATIONS.length; i8++) ticksEl.appendChild(document.createElement('i'));
var curId = null;

function showLine(entry, idx) {
  if (!entry) { subs.style.opacity = 0; return; }
  subs.innerHTML = '<p class="zh">' + entry.zh + '</p><p class="en">' + entry.en + '</p>';
  subs.style.opacity = 1;
  var ts = ticksEl.children;
  for (var k = 0; k < ts.length; k++) ts[k].className = (k === idx ? 'on' : '');
}

function updateSubs() {
  var hit = null, hitIdx = -1, best = 1e9;
  for (var k = 0; k < STATIONS.length; k++) {
    var s = STATIONS[k];
    var d = Math.hypot(cam.x - s.x, cam.z - s.z);
    if (d < s.r && d < best) { best = d; hit = s; hitIdx = k; }
  }
  var id = hit ? hit.id : 'open';
  if (id !== curId) {
    curId = id;
    showLine(hit || OPEN_WATER, hitIdx);
  }
  var whereEl = document.getElementById('where');
  if (whereEl) whereEl.textContent = (hit ? hit.id : '江上') + '　x ' + cam.x.toFixed(0) + '  z ' + cam.z.toFixed(0);
}

/* ---------------------------------------------------------------- LOOP -- */
/* the lit window's column on the river. Lives outside drawFarBank() on purpose: see
 * the note at the window. Called after drawWater() so the river cannot erase it. */
function drawTowerGlow() {
  var tp = project({ x: TOWER.x, y: TOWER.y || 0, z: TOWER.z });
  if (!tp) return;
  /* and then pulled back down. At 34/0.52 the window's column became the ONE clear
   * reflection in the frame and a blind critic reported that the moon had no road on the
   * water while the tower's lamp did — "别让它抢了月亮的倒影". In this poem nothing
   * outshines the moon; the window only has to be present. */
  reflect(TOWER.x + 1.5, TOWER.z, 20, 0.5, 'rgba(255,206,140,$A)', 0.26);
}

function drawFrame() {
  drawSky();
  drawClouds();
  var moonP = drawMoon();
  drawFarBank();
  drawWater(moonP);
  drawTowerGlow();
  drawMeadow();
  drawHaze();
  drawRings();
  drawPetals();
  drawBoat();
  drawSandbar();
  drawGrove();
  if (!SHOT) updateSubs();
}

function markShotReady() {
  document.body.setAttribute('data-shot-ready', '1');
  document.documentElement.setAttribute('data-shot-ready', '1');
}

function frame(now) {
  if (SHOT) return;
  if (!wantLive(now)) { loopOn = false; return; }
  requestAnimationFrame(frame);
  if (now - lastDrawT < 1000 / LIVE_FPS) return;
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  lastDrawT = now;
  T += dt; step(dt);
  drawFrame();
}

var loopOn = false, lastDrawT = 0, liveUntil = 0, roamHold = false;
function wantLive(now) {
  if (document.hidden) return false;
  if (roamHold) return true;
  if (now < liveUntil) return true;
  if (keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD ||
      keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight || keys.Space) return true;
  if (drag || jx || jz) return true;
  return false;
}
function pokeLive() {
  liveUntil = performance.now() + 1400;
  kickLoop();
}
function kickLoop() {
  if (SHOT || document.hidden) return;
  if (!loopOn) { loopOn = true; last = performance.now(); requestAnimationFrame(frame); }
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) loopOn = false;
  else pokeLive();
});
window.__poemPerf = {
  poke: pokeLive,
  roam: function (on) {
    roamHold = !!on;
    keys.KeyW = !!on;
    if (on) pokeLive();
  }
};

window.__poemShot = function (n) {
  n = parseInt(n, 10) || 1;
  var c = CAMS[Math.max(1, Math.min(CAMS.length, n)) - 1];
  cam.x = c.x; cam.z = c.z; cam.yaw = c.yaw; cam.pitch = c.pitch;
  cam.y = gh(cam.x, cam.z) + 1.62;
  T = FROZEN_T;
  document.body.classList.add('shot');
  enter.classList.add('gone');
  curId = null; updateSubs();
  document.body.removeAttribute('data-shot-ready');
  document.documentElement.removeAttribute('data-shot-ready');
  resize();
  drawFrame();
  markShotReady();
  return true;
};

/* ------------------------------------------------------------------ UI -- */
var enter = document.getElementById('enter');
enter.addEventListener('click', function () { enter.classList.add('gone'); });

var railtoggle = document.getElementById('railtoggle');
railtoggle.addEventListener('click', function () {
  document.body.classList.toggle('rail-collapsed');
  railtoggle.textContent = document.body.classList.contains('rail-collapsed') ? '‹' : '›';
});

if (!SHOT && window.PolishTimeline) {
  window.PolishTimeline.mount({
    el: '#tl',
    log: 'log.jsonl',
    onReady: function (rounds) {
      if (!rounds) return;
      var fr = document.getElementById('ft-rounds');
      var fs = document.getElementById('ft-stop');
      if (fr) fr.textContent = rounds.length;
      var lastR = rounds[rounds.length - 1];
      if (fs && lastR && lastR.stop) fs.textContent = lastR.stop;
    }
  });
}

resize();

if (SHOT) {
  var c = CAMS[Math.max(1, Math.min(CAMS.length, SHOT)) - 1];
  cam.x = c.x; cam.z = c.z; cam.yaw = c.yaw; cam.pitch = c.pitch;
  cam.y = gh(cam.x, cam.z) + 1.62;
  T = FROZEN_T;
  document.body.classList.add('shot');
  enter.classList.add('gone');
  /* the station this camera is standing in still speaks, so the shot carries its line */
  curId = null; updateSubs();
  resize();
  drawFrame();
  markShotReady();
} else {
  last = performance.now();
  drawFrame();
}

})();
</script>
</body>
</html>
