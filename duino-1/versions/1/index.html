<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>杜伊诺哀歌 · 第一首 — 可漫游的夜</title>
<style>
  :root{
    --ink:#e8e4dc; --dim:#8d8879; --line:rgba(232,228,220,.14);
    --bg:#06070b; --panel:rgba(8,9,14,.82); --accent:#c9a56a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
    overflow:hidden;-webkit-text-size-adjust:100%}
  #app{display:flex;height:100%;width:100%}
  #world{position:relative;flex:1 1 auto;min-width:0;height:100%;overflow:hidden;cursor:crosshair}
  canvas{display:block;width:100%;height:100%}

  /* ---- overlays on the world ---- */
  .veil{position:absolute;inset:0;pointer-events:none}
  #vignette{background:radial-gradient(ellipse at 50% 55%,transparent 38%,rgba(0,0,0,.72) 100%)}
  #title{position:absolute;left:24px;top:20px;pointer-events:none;
    letter-spacing:.24em;font-size:13px;color:var(--dim);text-transform:uppercase}
  #title b{display:block;font-size:19px;letter-spacing:.1em;color:var(--ink);
    text-transform:none;margin-top:6px;font-weight:500}
  #sub{position:absolute;left:0;right:0;bottom:92px;text-align:center;pointer-events:none;
    padding:0 8%;transition:opacity 1.1s ease}
  #sub .de{font-style:italic;font-size:15px;color:var(--accent);opacity:.92;line-height:1.7;
    white-space:pre-line;text-shadow:0 2px 18px #000}
  #sub .zh{font-size:17px;line-height:1.9;margin-top:10px;white-space:pre-line;
    text-shadow:0 2px 18px #000}
  #sub .en{font-size:12px;color:var(--dim);margin-top:8px;white-space:pre-line;letter-spacing:.02em}
  #hint{position:absolute;left:24px;bottom:22px;font-size:11.5px;color:var(--dim);
    letter-spacing:.08em;line-height:1.8;pointer-events:none}
  #compass{position:absolute;right:16px;top:18px;font-size:11px;color:var(--dim);
    letter-spacing:.14em;pointer-events:none;text-align:right;line-height:1.7}
  #enter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(3,4,7,.86);cursor:pointer;z-index:5;
    transition:opacity .8s ease;text-align:center;padding:24px}
  #enter h1{font-weight:500;font-size:clamp(20px,4vw,30px);margin:0 0 14px;letter-spacing:.12em}
  #enter p{margin:4px 0;color:var(--dim);font-size:13px;line-height:1.9;letter-spacing:.06em}
  #enter .go{margin-top:26px;border:1px solid var(--line);padding:11px 30px;font-size:13px;
    letter-spacing:.3em;color:var(--accent)}
  #enter.gone{opacity:0;pointer-events:none}

  /* ---- touch joystick ---- */
  #stick{position:absolute;left:20px;bottom:20px;width:116px;height:116px;border-radius:50%;
    border:1px solid var(--line);display:none;touch-action:none;z-index:4}
  #stick i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;
    border-radius:50%;background:rgba(232,228,220,.16);border:1px solid var(--line)}
  @media (pointer:coarse){#stick{display:block} #hint{display:none}}

  /* ---- timeline panel ---- */
  #rail{flex:0 0 340px;height:100%;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;backdrop-filter:blur(8px);transition:flex-basis .35s ease}
  #rail.collapsed{flex-basis:44px}
  #rail.collapsed .railbody,#rail.collapsed .railhead h2,#rail.collapsed .railhead small{display:none}
  .railhead{display:flex;align-items:center;gap:10px;padding:14px 12px;border-bottom:1px solid var(--line)}
  .railhead h2{font-size:13px;margin:0;font-weight:500;letter-spacing:.18em;flex:1}
  .railhead small{color:var(--dim);font-size:11px}
  #toggle{background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer;
    width:24px;height:24px;border-radius:3px;font-size:12px;line-height:1;flex:0 0 auto}
  .railbody{overflow-y:auto;padding:14px 16px 40px;font-size:12.5px;line-height:1.75}
  .rnd{border-left:1px solid var(--line);padding:0 0 18px 14px;margin-left:5px;position:relative}
  .rnd:before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;
    background:var(--accent)}
  .rnd h3{margin:0 0 4px;font-size:12.5px;font-weight:500;letter-spacing:.06em}
  .rnd h3 em{color:var(--dim);font-style:normal;font-size:11px;margin-left:6px}
  .rnd p{margin:3px 0;color:#bdb8ac}
  .rnd p.gap{color:var(--accent)}
  .rnd p.critic{color:var(--dim)}
  .rnd a{color:var(--dim)}
  .note{color:var(--dim);font-size:11.5px;line-height:1.8;border-top:1px solid var(--line);
    margin-top:10px;padding-top:12px}
  .meta{font-size:11px;color:var(--dim);line-height:1.9;letter-spacing:.03em}
  .meta b{color:#bdb8ac;font-weight:500}
  @media (max-width:820px){
    #app{flex-direction:column}
    #rail{flex-basis:44%;width:100%;border-left:none;border-top:1px solid var(--line)}
    #rail.collapsed{flex-basis:44px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="world">
    <canvas id="cv"></canvas>
    <div class="veil" id="vignette"></div>
    <div id="title">Duineser Elegien · I<b>杜伊诺哀歌 · 第一首</b></div>
    <div id="compass"></div>
    <div id="sub" style="opacity:0"></div>
    <div id="hint">W A S D 行走 · 鼠标拖拽转视角 · Shift 疾行 · 空格停住听风</div>
    <div id="stick"><i></i></div>
    <div id="enter">
      <h1>我若呼喊，谁会在天使的序列里听见我？</h1>
      <p>这是一片夜。悬崖上有城堡，远处站着天使的序列。</p>
      <p>走过去。诗会在你靠近的地方出现。</p>
      <div class="go">进 入</div>
    </div>
  </div>
  <aside id="rail">
    <div class="railhead">
      <button id="toggle" title="折叠 / 展开">‹</button>
      <h2>打 磨 时 间 线</h2>
      <small id="rcount"></small>
    </div>
    <div class="railbody" id="railbody">
      <div id="rounds"></div>
      <div class="note" id="footmeta"></div>
    </div>
  </aside>
</div>

<script>
"use strict";
/* ============================================================
   杜伊诺哀歌 · 第一首 — 手写 Canvas 2D 世界，零依赖
   ============================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.max(1, W * DPR); cv.height = Math.max(1, H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ---------------- camera ---------------- */
const cam = { x: 0, y: 1.7, z: 26, yaw: Math.PI, pitch: -0.04, fov: 1.05 };
const vel = { x: 0, z: 0 };

// fixed camera rig for the 6-shot critic pass: ?cam=x,z,yaw,pitch&still=1
(function rig(){
  const q = new URLSearchParams(location.search);
  const c = q.get('cam');
  if (c){
    const n = c.split(',').map(Number);
    if (n.length >= 4 && n.every(v => Number.isFinite(v))){
      cam.x = n[0]; cam.z = n[1]; cam.yaw = n[2]; cam.pitch = n[3];
    }
  }
  if (q.get('still')) document.documentElement.dataset.still = '1';
})();

function project(p){
  const dx = p.x - cam.x, dy = p.y - cam.y, dz = p.z - cam.z;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  let X = dx * cy - dz * sy;
  let Z = dx * sy + dz * cy;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  let Y = dy * cp - Z * sp;
  Z = dy * sp + Z * cp;
  if (Z <= 0.08) return null;
  const f = (H * 0.5) / Math.tan(cam.fov * 0.5);
  return { x: W * 0.5 + X * f / Z, y: H * 0.5 - Y * f / Z, z: Z, s: f / Z };
}

/* ---------------- deterministic noise ---------------- */
let _s = 20120121;
function rnd(){ _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; }

/* ---------------- world content ---------------- */
const stars = [];
for (let i = 0; i < 620; i++){
  const th = rnd() * Math.PI * 2, ph = rnd() * 0.85 + 0.03;
  stars.push({ th, ph, m: rnd() * 0.85 + 0.15, tw: rnd() * 6.28 });
}

// dust carried by "der Wind voller Weltraum"
const dust = [];
for (let i = 0; i < 260; i++){
  dust.push({ x: (rnd() - 0.5) * 90, y: rnd() * 9, z: (rnd() - 0.5) * 90, m: rnd() });
}

// ground: sparse grass tufts on a dark plateau
const tufts = [];
for (let i = 0; i < 900; i++){
  const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 62;
  tufts.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, h: 0.18 + rnd() * 0.42, a: rnd() * 6.28 });
}

// angels: a receding order of tall light-bodies. Unreachable by design.
const angels = [];
for (let i = 0; i < 9; i++){
  angels.push({ x: -46 + i * 4.4, z: -78 - i * 13, h: 26 + i * 3.6, ph: i * 0.7 });
}

// landmarks (zones that speak)
const ZONES = [
  { id:'cry',   x:  0, z:  14, r: 9,  key:'I'   },
  { id:'tree',  x: 17, z: -12, r: 7,  key:'III' },
  { id:'window',x:-20, z:  -6, r: 7,  key:'VI'  },
  { id:'names', x: -6, z: -30, r: 8,  key:'VII' },
  { id:'room',  x: 24, z:  16, r: 7.5,key:'V'   },
  { id:'cliff', x:  0, z: -52, r: 16, key:'II'  },
  { id:'angels',x:-26, z: -70, r: 22, key:'VIII'}
];

const LINES = {
  cry: {
    de: "Wer, wenn ich schriee, hörte mich denn aus der Engel\nOrdnungen?",
    zh: "我若呼喊，谁会在天使的序列里听见我？",
    en: "Who, if I cried out, would hear me among the orders of angels?"
  },
  II: {
    de: "…daß wir nicht sehr verläßlich zu Haus sind\nin der gedeuteten Welt.",
    zh: "在这个被解释过的世界里，我们并不十分安稳地在家。",
    en: "…that we are not very securely at home in the interpreted world."
  },
  tree: {
    de: "Es bleibt uns vielleicht irgend ein Baum an dem Abhang,\ndaß wir ihn täglich wiedersähen;",
    zh: "留给我们的也许只是山坡上的某一棵树，\n好让我们每天重新看见它；",
    en: "Perhaps there remains for us some tree on a hillside,\nthat we might see it again each day;"
  },
  window: {
    de: "…da du vorüberkamst am geöffneten Fenster,\ngab eine Geige sich hin. Das alles war Auftrag.",
    zh: "当你经过一扇敞开的窗，一把小提琴把自己交了出去。\n这一切都是使命。",
    en: "…as you walked beneath an open window, a violin gave itself away.\nAll of this was mission."
  },
  names: {
    de: "…und selbst den eigenen Namen wegzulassen\nwie ein zerbrochenes Spielzeug.",
    zh: "甚至把自己的名字也丢开，像丢开一件摔坏的玩具。",
    en: "…and to set aside even one's own name like a broken toy."
  },
  room: {
    de: "Wirf aus den Armen die Leere zu den Räumen hinzu,\ndie wir atmen;",
    zh: "从臂弯里把这空虚，抛向我们呼吸的空间；",
    en: "Fling the emptiness out of your arms into the spaces we breathe;"
  },
  angels: {
    de: "Ein jeder Engel ist schrecklich.",
    zh: "每一位天使都是可怕的。",
    en: "Every angel is terrifying."
  },
  night: {
    de: "O und die Nacht, die Nacht, wenn der Wind voller Weltraum\nuns am Angesicht zehrt —",
    zh: "哦，还有夜，那夜，当满载宇宙的风啃食我们的面容——",
    en: "Oh, and the night, the night, when the wind full of outer space gnaws at our faces —"
  }
};

/* ---------------- input ---------------- */
const keys = Object.create(null);
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['KeyW','KeyA','KeyS','KeyD','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let drag = null;
const worldEl = document.getElementById('world');
worldEl.addEventListener('pointerdown', e => {
  if (e.target.closest('#stick') || e.target.closest('#enter')) return;
  drag = { x: e.clientX, y: e.clientY };
  worldEl.setPointerCapture(e.pointerId);
});
worldEl.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.yaw   -= (e.clientX - drag.x) * 0.0032;
  cam.pitch -= (e.clientY - drag.y) * 0.0024;
  cam.pitch = Math.max(-0.55, Math.min(0.6, cam.pitch));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener('pointerup', () => { drag = null; });

// touch joystick
const stick = document.getElementById('stick'), knob = stick.querySelector('i');
let jx = 0, jz = 0;
stick.addEventListener('pointerdown', e => { stick.setPointerCapture(e.pointerId); jmove(e); });
stick.addEventListener('pointermove', e => { if (e.buttons || e.pressure) jmove(e); });
stick.addEventListener('pointerup', () => { jx = jz = 0; knob.style.transform = ''; });
function jmove(e){
  const r = stick.getBoundingClientRect();
  let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2);
  let dy = (e.clientY - r.top - r.height / 2) / (r.height / 2);
  const m = Math.hypot(dx, dy) || 1;
  if (m > 1){ dx /= m; dy /= m; }
  jx = dx; jz = -dy;
  knob.style.transform = `translate(${dx * 32}px,${dy * 32}px)`;
}

/* ---------------- entry gate ---------------- */
const gate = document.getElementById('enter');
gate.addEventListener('click', () => { gate.classList.add('gone'); });
if (document.documentElement.dataset.still) gate.classList.add('gone');

/* ---------------- subtitle logic ---------------- */
const subEl = document.getElementById('sub');
let curZone = null, zoneSince = 0;
function setSub(k){
  const L = LINES[k];
  if (!L){ subEl.style.opacity = 0; return; }
  subEl.innerHTML =
    `<div class="de">${L.de}</div><div class="zh">${L.zh}</div><div class="en">${L.en}</div>`;
  subEl.style.opacity = 1;
}

/* ---------------- drawing helpers ---------------- */
function poly(pts, fill, stroke){
  const ps = pts.map(project);
  if (ps.some(p => !p)) return;
  ctx.beginPath();
  ctx.moveTo(ps[0].x, ps[0].y);
  for (let i = 1; i < ps.length; i++) ctx.lineTo(ps[i].x, ps[i].y);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.stroke(); }
}
function seg(a, b, col, w){
  const p = project(a), q = project(b);
  if (!p || !q) return;
  ctx.strokeStyle = col; ctx.lineWidth = w || 1;
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
}
function box(x, y, z, w, h, d, fill, stroke){
  const X = [x - w/2, x + w/2], Y = [y, y + h], Z = [z - d/2, z + d/2];
  const faces = [
    [[X[0],Y[0],Z[0]],[X[1],Y[0],Z[0]],[X[1],Y[1],Z[0]],[X[0],Y[1],Z[0]]],
    [[X[0],Y[0],Z[1]],[X[1],Y[0],Z[1]],[X[1],Y[1],Z[1]],[X[0],Y[1],Z[1]]],
    [[X[0],Y[0],Z[0]],[X[0],Y[0],Z[1]],[X[0],Y[1],Z[1]],[X[0],Y[1],Z[0]]],
    [[X[1],Y[0],Z[0]],[X[1],Y[0],Z[1]],[X[1],Y[1],Z[1]],[X[1],Y[1],Z[0]]],
    [[X[0],Y[1],Z[0]],[X[1],Y[1],Z[0]],[X[1],Y[1],Z[1]],[X[0],Y[1],Z[1]]]
  ];
  for (const f of faces) poly(f.map(p => ({x:p[0], y:p[1], z:p[2]})), fill, stroke);
}

/* ---------------- render ---------------- */
let t0 = performance.now(), T = 0;

function frame(now){
  const dt = Math.min(0.05, (now - t0) / 1000); t0 = now; T += dt;

  /* --- movement --- */
  const still = !!keys['Space'];
  let fx = 0, fz = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    fz += 1;
  if (keys['KeyS'] || keys['ArrowDown'])  fz -= 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  fx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) fx += 1;
  fx += jx; fz += jz;
  const mag = Math.hypot(fx, fz);
  if (mag > 1){ fx /= mag; fz /= mag; }
  const spd = (keys['ShiftLeft'] || keys['ShiftRight'] ? 11 : 5.2) * (still ? 0 : 1);
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const wx = fx * cy + fz * sy;
  const wz = -fx * sy + fz * cy;
  vel.x += (wx * spd - vel.x) * Math.min(1, dt * 7);
  vel.z += (wz * spd - vel.z) * Math.min(1, dt * 7);
  cam.x += vel.x * dt; cam.z += vel.z * dt;
  // plateau edge: the cliff. Do not fall off, just stop.
  const rr = Math.hypot(cam.x, cam.z);
  if (rr > 58){ cam.x *= 58 / rr; cam.z *= 58 / rr; }
  // breathing head-bob
  const moving = Math.hypot(vel.x, vel.z);
  cam.y = 1.7 + Math.sin(T * 2.4) * 0.018 + Math.sin(T * 7.5) * 0.012 * Math.min(1, moving / 5);

  /* --- sky --- */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,   '#04050a');
  g.addColorStop(0.5, '#080a12');
  g.addColorStop(0.78,'#0d1018');
  g.addColorStop(1,   '#05060a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  /* --- stars --- */
  for (const s of stars){
    const p = project({
      x: cam.x + Math.cos(s.th) * Math.cos(s.ph) * 400,
      y: cam.y + Math.sin(s.ph) * 400,
      z: cam.z + Math.sin(s.th) * Math.cos(s.ph) * 400
    });
    if (!p) continue;
    const a = s.m * (0.55 + 0.45 * Math.sin(T * 0.9 + s.tw));
    ctx.fillStyle = `rgba(226,232,240,${a * 0.85})`;
    ctx.fillRect(p.x, p.y, 1.3 + s.m, 1.3 + s.m);
  }

  /* --- the sea far below / horizon haze --- */
  const hz = project({ x: cam.x, y: -40, z: cam.z - 300 });
  if (hz){
    const hg = ctx.createLinearGradient(0, hz.y - 60, 0, hz.y + 40);
    hg.addColorStop(0, 'rgba(24,30,46,0)');
    hg.addColorStop(0.55, 'rgba(30,38,58,.45)');
    hg.addColorStop(1, 'rgba(6,8,13,0)');
    ctx.fillStyle = hg; ctx.fillRect(0, hz.y - 60, W, 100);
  }

  /* --- angels: the order, standing far off --- */
  for (const a of angels){
    const base = { x: a.x, y: 0, z: a.z };
    const top  = { x: a.x, y: a.h, z: a.z };
    const p = project(base), q = project(top);
    if (!p || !q) continue;
    const dist = Math.hypot(a.x - cam.x, a.z - cam.z);
    const pulse = 0.5 + 0.5 * Math.sin(T * 0.55 + a.ph);
    const near = Math.max(0, 1 - dist / 120);
    const wpx = Math.max(2, 3.2 * p.s * 6);
    const lg = ctx.createLinearGradient(0, q.y, 0, p.y);
    lg.addColorStop(0, `rgba(228,222,206,${0.02 + 0.10 * pulse * (0.4 + near)})`);
    lg.addColorStop(0.45, `rgba(201,165,106,${0.05 + 0.16 * pulse * (0.4 + near)})`);
    lg.addColorStop(1, 'rgba(201,165,106,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(p.x - wpx / 2, q.y, wpx, p.y - q.y);
    ctx.fillStyle = `rgba(245,240,228,${0.10 + 0.30 * pulse})`;
    ctx.fillRect(p.x - wpx * 0.08, q.y, Math.max(1, wpx * 0.16), p.y - q.y);
  }

  /* --- the castle on the cliff (Duino) --- */
  const CX = 0, CZ = -52;
  box(CX,      0,  CZ,      22, 9,  13, '#0a0c12', 'rgba(201,165,106,.14)');
  box(CX - 8,  9,  CZ - 2,  6,  13, 6,  '#0b0d14', 'rgba(201,165,106,.17)');
  box(CX + 7,  9,  CZ + 1,  5,  9,  5,  '#0b0d14', 'rgba(201,165,106,.15)');
  box(CX,      9,  CZ + 3,  9,  6,  6,  '#090b11', 'rgba(201,165,106,.12)');
  // lit windows
  for (const w of [[-8,14,-5.2],[-8,17,-5.2],[7,13,-1.7],[0,11,0],[3,4,-45.6]]){
    const p = project({ x: CX + w[0], y: w[1], z: (w[2] < -20 ? w[2] : CZ - 6.6) });
    if (!p) continue;
    const s = Math.max(1.2, 0.9 * p.s);
    ctx.fillStyle = 'rgba(255,214,150,.55)';
    ctx.fillRect(p.x - s / 2, p.y - s, s, s * 1.6);
  }

  /* --- ground: tufts, the only texture of the plateau --- */
  ctx.lineWidth = 1;
  for (const t of tufts){
    const sway = Math.sin(T * 1.3 + t.a) * 0.13;
    seg({ x: t.x, y: 0, z: t.z }, { x: t.x + sway, y: t.h, z: t.z },
        'rgba(126,132,120,.30)', 1);
  }
  // faint ground plane rings so the floor reads as ground
  ctx.lineWidth = 1;
  for (let r = 6; r <= 56; r += 6){
    ctx.beginPath(); let started = false;
    for (let i = 0; i <= 64; i++){
      const a = i / 64 * Math.PI * 2;
      const p = project({ x: Math.cos(a) * r, y: 0, z: Math.sin(a) * r });
      if (!p){ started = false; continue; }
      if (!started){ ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = `rgba(140,150,170,${0.05 - r * 0.0006})`; ctx.stroke();
  }

  /* --- the tree on the hillside --- */
  (function tree(){
    const x = 17, z = -12;
    seg({x,y:0,z}, {x,y:4.4,z}, 'rgba(180,170,150,.5)', 2.2);
    for (let i = 0; i < 9; i++){
      const a = i / 9 * 6.28, l = 1.9 + (i % 3) * 0.6;
      const sw = Math.sin(T * 0.9 + i) * 0.12;
      seg({x, y:4.4, z}, { x: x + Math.cos(a) * l + sw, y: 4.4 + 1.5 + (i % 2) * 0.7, z: z + Math.sin(a) * l },
          'rgba(160,152,136,.38)', 1.3);
    }
  })();

  /* --- the open window with the violin --- */
  (function win(){
    const x = -20, z = -6;
    box(x, 0, z, 3.4, 4.6, 0.5, '#080a10', 'rgba(201,165,106,.20)');
    const p = project({ x, y: 2.9, z: z - 0.3 });
    if (p){
      const s = Math.max(2, 1.9 * p.s);
      const a = 0.30 + 0.22 * Math.sin(T * 1.6);
      const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s * 2.4);
      rg.addColorStop(0, `rgba(255,210,148,${a})`);
      rg.addColorStop(1, 'rgba(255,210,148,0)');
      ctx.fillStyle = rg; ctx.fillRect(p.x - s * 2.4, p.y - s * 2.4, s * 4.8, s * 4.8);
    }
  })();

  /* --- the room with no one in it --- */
  (function room(){
    const x = 24, z = 16;
    box(x, 0, z, 7, 3.4, 7, 'rgba(8,9,14,.85)', 'rgba(232,228,220,.11)');
  })();

  /* --- discarded names, like broken toys --- */
  for (let i = 0; i < 14; i++){
    const a = i * 1.7, r = 2.4 + (i % 5);
    const x = -6 + Math.cos(a) * r, z = -30 + Math.sin(a) * r;
    seg({x, y:0, z}, {x: x + 0.5, y: 0.14, z: z + 0.3}, 'rgba(201,165,106,.32)', 1.6);
  }

  /* --- dust: der Wind voller Weltraum --- */
  for (const d of dust){
    d.x += (0.9 + d.m) * dt * 2.2;
    d.y += Math.sin(T + d.m * 6.28) * dt * 0.25;
    if (d.x - cam.x > 48) d.x -= 96;
    if (d.x - cam.x < -48) d.x += 96;
    const p = project({ x: d.x, y: d.y, z: d.z });
    if (!p || p.z > 70) continue;
    ctx.fillStyle = `rgba(226,226,214,${0.05 + 0.13 * d.m * (1 - p.z / 70)})`;
    ctx.fillRect(p.x, p.y, 1.2, 1.2);
  }

  /* --- zone subtitles --- */
  let hit = null, best = 1e9;
  for (const zn of ZONES){
    const d = Math.hypot(cam.x - zn.x, cam.z - zn.z);
    if (d < zn.r && d < best){ best = d; hit = zn.id; }
  }
  const nextKey = hit || (Math.hypot(vel.x, vel.z) < 0.25 ? 'night' : null);
  if (nextKey !== curZone){
    curZone = nextKey; zoneSince = T;
    if (nextKey === 'cliff') setSub('II');
    else setSub(nextKey);
  }

  document.getElementById('compass').textContent =
    `x ${cam.x.toFixed(0)}  z ${cam.z.toFixed(0)}   ${hit ? '· ' + hit : '· im Freien'}`;

  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

/* ============================================================
   right rail: the polish timeline, read from log.jsonl
   ============================================================ */
const FOOT = `<div class="meta">
<b>loop 机制</b>　Gauntlet 式独立 critic（评审子代理看不到 builder 的任何解释）＋ Ralph 式一轮一事<br>
<b>harness</b>　Claude Code<br>
<b>模型</b>　Opus 5（非 fast）<br>
<b>推理强度</b>　low<br>
<b>轮数</b>　<span id="fr">—</span>　<b>停止原因</b>　<span id="fs">仍在循环中</span><br>
<b>原作</b>　R. M. Rilke《Duineser Elegien》I（公有领域）；中/英译由 Opus 5 自译
</div>`;

const roundsEl = document.getElementById('rounds');
const footEl = document.getElementById('footmeta');
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function renderRounds(rows){
  if (!rows.length){
    roundsEl.innerHTML = '<p style="color:#8d8879">时间线为空。第一轮还没写进 log.jsonl。</p>';
  } else {
    roundsEl.innerHTML = rows.map(r => `
      <div class="rnd">
        <h3>第 ${esc(r.round)} 轮<em>${esc(r.at || '')}</em></h3>
        <p>${esc(r.changed || r.change || '')}</p>
        ${r.critic ? `<p class="critic">critic：${esc(r.critic)}</p>` : ''}
        ${r.biggest_gap ? `<p class="gap">最大缺口：${esc(r.biggest_gap)}</p>` : ''}
        ${r.shots ? `<p><a href="${esc(r.shots)}">截图 ${esc(r.shots)}</a></p>` : ''}
      </div>`).join('');
  }
  document.getElementById('rcount').textContent = rows.length ? rows.length + ' 轮' : '';
  footEl.innerHTML = FOOT;
  const fr = document.getElementById('fr'), fs = document.getElementById('fs');
  if (fr) fr.textContent = rows.length ? rows.length : '—';
  const last = rows[rows.length - 1];
  if (fs && last && last.stop) fs.textContent = last.stop;
}

fetch('log.jsonl', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(txt => {
    const rows = txt.split('\n').map(l => l.trim()).filter(Boolean)
      .map(l => { try { return JSON.parse(l); } catch (e) { return null; } })
      .filter(Boolean);
    renderRounds(rows);
  })
  .catch(() => {
    roundsEl.innerHTML =
      '<p style="color:#8d8879">读不到 <code>log.jsonl</code>。' +
      '用 <code>file://</code> 直接打开时浏览器会拦截本地 fetch——' +
      '在本目录跑 <code>python3 -m http.server</code>，或看线上 ' +
      '<a href="https://chener.github.io/poem-world/duino-1/">GitHub Pages</a>。</p>';
    footEl.innerHTML = FOOT;
  });

/* collapse */
const rail = document.getElementById('rail'), tg = document.getElementById('toggle');
tg.addEventListener('click', () => {
  rail.classList.toggle('collapsed');
  tg.textContent = rail.classList.contains('collapsed') ? '›' : '‹';
});
</script>
