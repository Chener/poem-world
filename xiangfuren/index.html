<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>湘夫人 · 可漫游世界</title>
<link rel="stylesheet" href="../shared/site.css">
<link rel="stylesheet" href="../shared/timeline.css">
<style>
  /* 叠在画布上的字永远是暗底上的字，所以用固定值，不跟随浅色主题 */
  :root{ --veil:#e8e2d6; --veil-dim:#a89f8e; --veil-faint:#6f6858; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    overflow:hidden;-webkit-text-size-adjust:100%}
  #app{display:flex;height:100%;width:100%}
  #stage{position:relative;flex:1 1 auto;min-width:0;overflow:hidden}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---- overlays on the world ---- */
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%)}
  #subtitle{position:absolute;left:0;right:0;bottom:6.5vh;text-align:center;pointer-events:none;
    padding:0 6vw;opacity:0;transition:opacity 1.1s ease}
  #subtitle.on{opacity:1}
  #subtitle .zh{font-size:clamp(17px,2.1vw,27px);letter-spacing:.22em;line-height:1.9;
    text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 40px rgba(0,0,0,.7)}
  #subtitle .en{margin-top:.7em;font-size:clamp(11px,1.05vw,14px);color:var(--veil-dim);
    letter-spacing:.06em;font-style:italic;text-shadow:0 2px 12px rgba(0,0,0,.9)}
  #title{position:absolute;left:28px;top:22px;pointer-events:none;
    text-shadow:0 2px 16px rgba(0,0,0,.9)}
  #title h1{margin:0;font-size:20px;font-weight:400;letter-spacing:.5em}
  #title p{margin:.5em 0 0;font-size:11px;color:var(--veil-dim);letter-spacing:.24em}
  #hint{position:absolute;left:28px;bottom:20px;font-size:11px;color:var(--veil-faint);
    letter-spacing:.14em;pointer-events:none;text-shadow:0 1px 10px #000}
  #enter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px;background:rgba(6,8,12,.78);cursor:pointer;
    backdrop-filter:blur(3px);transition:opacity .8s ease}
  #enter.gone{opacity:0;pointer-events:none}
  #enter .k{font-size:15px;letter-spacing:.42em;color:var(--veil)}
  #enter .s{font-size:11px;letter-spacing:.2em;color:var(--veil-faint)}
  #compass{position:absolute;right:20px;top:20px;font-size:11px;letter-spacing:.2em;
    color:var(--veil-faint);pointer-events:none;text-shadow:0 1px 8px #000}

  /* ---- right: the polish timeline（全站共用的那一条） ---- */
  #rail{flex:0 0 var(--rail,372px);width:var(--rail,372px);height:100%;
    display:flex;flex-direction:column;background:var(--bg-raise);
    border-left:1px solid var(--line);overflow:hidden;
    transition:flex-basis .28s ease,width .28s ease}
  body.rail-collapsed #rail{flex-basis:42px;width:42px}
  body.rail-collapsed #rail>*:not(#railbar){display:none}
  body.rail-collapsed #railbar .rb-txt{display:none}
  #railbar{flex:none;display:flex;align-items:center;gap:9px;padding:11px 12px;
    border-bottom:1px solid var(--line);background:var(--bg-raise)}
  #railbar button{flex:none;width:20px;height:20px;border:1px solid var(--line);border-radius:4px;
    background:transparent;color:var(--ink-dim);cursor:pointer;font-family:var(--mono);
    font-size:11px;line-height:1;display:grid;place-items:center;padding:0}
  #railbar button:hover{color:var(--ink);border-color:var(--ink-faint)}
  .rb-txt{min-width:0}
  .rb-txt .a{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-faint)}
  .rb-txt .b{font-family:var(--serif);font-size:14px;color:var(--ink);margin-top:1px}
  #tl{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
  #tl::-webkit-scrollbar{width:9px}
  #tl::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  #railfoot{flex:none;border-top:1px solid var(--line);padding:12px 16px 14px;background:var(--bg-sink)}
  #railfoot .rows{display:grid;gap:2px}
  #railfoot .row{display:flex;gap:8px;font-family:var(--mono);font-size:10.5px;line-height:1.7}
  #railfoot .row .k{flex:none;width:5.2em;color:var(--ink-faint)}
  #railfoot .row .v{color:var(--ink);min-width:0}
  #railfoot .row .v.sand{color:var(--sand)}
  #railfoot .lnks{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:10.5px}
  #railfoot .lnks a{color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line)}
  #railfoot .lnks a:hover{color:var(--sand);border-color:var(--sand)}

  /* 取证模式：只留世界。字幕也收起来 —— critic 要在不看字幕的情况下认这首诗 */
  body.shot #rail, body.shot #hint, body.shot #enter,
  body.shot #subtitle, body.shot #title, body.shot #compass{display:none !important}

  @media (max-width:860px){
    #app{flex-direction:column}
    #stage{flex:1 1 56%}
    #rail{flex:0 0 44%;width:100%;border-left:0;border-top:1px solid var(--line)}
    body.rail-collapsed #rail{flex-basis:42px;width:100%}
    #title{left:16px;top:14px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="vignette"></div>
    <div id="title"><h1>湘夫人</h1><p>屈原 · 九歌</p></div>
    <div id="compass">北</div>
    <div id="subtitle"><div class="zh"></div><div class="en"></div></div>
    <div id="hint">WASD / 方向键 行走 · 鼠标拖动 转身 · Shift 疾行 · 触屏拖动即可</div>
    <div id="enter"><div class="k">走 进 洞 庭</div><div class="s">click / tap to enter</div></div>
  </div>
  <aside id="rail">

        <div class="row"><span class="k">harness</span><span class="v">Claude Code</span></div>
        <div class="row"><span class="k">model</span><span class="v sand">Claude Opus 5（非 fast）</span></div>
        <div class="row"><span class="k">effort</span><span class="v sand">medium</span></div>
        <div class="row"><span class="k">rounds</span><span class="v" id="ft-rounds">—</span></div>
        <div class="row"><span class="k">stop</span><span class="v" id="ft-stop">PRD 清空 / 自检连两轮到位 / 周限</span></div>
      </div>
      <div class="lnks">
        <a href="../">← 三个世界</a>
        <a href="POEM.md">原文 / 译文</a>
        <a href="POLISH.md">打磨 prompt</a>
        <a href="PRD.md">PRD</a>
        <a href="progress.txt">progress</a>
        <a href="log.jsonl">log.jsonl</a>
      </div>
    </div>
  </aside>
</div>

<script src="../shared/timeline.js"></script>
<script src="../shared/worldprobe.js"></script>
<script src="log.js"></script>

<script>
/* =====================================================================
   湘夫人 · a walkable Dongting — zero dependencies, raw WebGL
   ===================================================================== */

/* ---------- tiny mat4 ---------- */
const M = {
  create: () => new Float32Array(16),
  perspective(o, fovy, a, n, f) {
    const t = 1 / Math.tan(fovy / 2); o.fill(0);
    o[0] = t / a; o[5] = t; o[11] = -1;
    o[10] = (f + n) / (n - f); o[14] = 2 * f * n / (n - f); return o;
  },
  lookAt(o, e, c, u) {
    let zx = e[0]-c[0], zy = e[1]-c[1], zz = e[2]-c[2];
    let l = 1/Math.hypot(zx,zy,zz); zx*=l; zy*=l; zz*=l;
    let xx = u[1]*zz - u[2]*zy, xy = u[2]*zx - u[0]*zz, xz = u[0]*zy - u[1]*zx;
    l = Math.hypot(xx,xy,xz); l = l ? 1/l : 0; xx*=l; xy*=l; xz*=l;
    const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
    o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
    o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
    o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
    o[12]=-(xx*e[0]+xy*e[1]+xz*e[2]);
    o[13]=-(yx*e[0]+yy*e[1]+yz*e[2]);
    o[14]=-(zx*e[0]+zy*e[1]+zz*e[2]); o[15]=1; return o;
  },
  mul(o, a, b) {
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0; for (let k = 0; k < 4; k++) s += a[k*4+r] * b[c*4+k];
      o[c*4+r] = s;
    } return o;
  }
};

/* ---------- world constants ---------- */
const WATER_Y = 0.0;
const EYE = 1.62;
const WIND = [0.62, -0.78];           // autumn wind, blowing toward the south-east shore
/* ?shot=1 —— 取证模式：固定机位、固定时间、没有界面，画一帧就停。
   密度大约是交互时的一半 —— critic judged 的必须基本就是访客看到的那个世界。 */
const QS = new URLSearchParams(location.search);
const SHOT = QS.has('shot');
const LITE = QS.get('lite') === '1' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const LIVE_FPS = LITE ? 20 : 30;

/* 定序随机。截图必须逐字节可复现：同一轮、同一机位，第 3 轮和第 9 轮拍出来的
   必须是同一张图，否则并排比较就没有意义。所以这个世界里不用浏览器的随机数，
   只有这一条从固定种子走出来的序列（mulberry32）。 */
function mkRnd(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

/* deterministic hash noise, shared by JS + (mirrored) shaders */
function h2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const ux = fx*fx*(3-2*fx), uz = fz*fz*(3-2*fz);
  const a = h2(ix,iz), b = h2(ix+1,iz), c = h2(ix,iz+1), d = h2(ix+1,iz+1);
  return a*(1-ux)*(1-uz) + b*ux*(1-uz) + c*(1-ux)*uz + d*ux*uz;
}
function fbm(x, z) {
  let v = 0, amp = .5, fx = x, fz = z;
  for (let i = 0; i < 4; i++) { v += amp * vnoise(fx, fz); fx *= 2.03; fz *= 2.03; amp *= .5; }
  return v;
}
function gauss(x, z, cx, cz, rx, rz) {
  const dx = (x - cx) / rx, dz = (z - cz) / rz;
  return Math.exp(-(dx*dx + dz*dz));
}
/* -Z is north. 帝子降兮北渚 — the shoal lies to the north. */
function terrainH(x, z) {
  let h = -2.6;
  h += 4.9 * gauss(x, z,   0, -62, 52, 30);    // 北渚 the northern shoal
  h += 2.1 * gauss(x, z,  34, -30, 22, 17);    // a lower sandbar
  h += 1.5 * gauss(x, z, -46, -24, 19, 22);
  h += 1.1 * gauss(x, z, -12, -96, 26, 20);
  h += 1.9 * (fbm(x * 0.035 + 11, z * 0.035 + 7) - .5) * gauss(x, z, 0, -55, 80, 55);
  h += 0.22 * (fbm(x * 0.18, z * 0.18) - .5);
  return h;
}
function groundY(x, z) { return Math.max(terrainH(x, z), WATER_Y); }

/* ---------- gl boot ---------- */
const canvas = document.getElementById('gl');
const glOpts = { antialias: !LITE, alpha: false, depth: true, preserveDrawingBuffer: SHOT };
const gl = canvas.getContext('webgl', glOpts) || canvas.getContext('experimental-webgl', glOpts);
/* hand-written WebGL has no renderer.info, so the two numbers the performance
 * gate needs are counted at the only two places they can come from. Reset at the
 * top of draw(); read by window.__world(). */
const glStats = { calls: 0, tris: 0 };
if (gl) (function () {
  const da = gl.drawArrays.bind(gl), de = gl.drawElements.bind(gl);
  gl.drawArrays = function (mode, first, count) {
    glStats.calls++;
    if (mode === gl.TRIANGLES) glStats.tris += count / 3;
    da(mode, first, count);
  };
  gl.drawElements = function (mode, count, type, off) {
    glStats.calls++;
    if (mode === gl.TRIANGLES) glStats.tris += count / 3;
    de(mode, count, type, off);
  };
})();
if (!gl) {
  document.getElementById('enter').innerHTML =
    '<div class="k">此浏览器没有 WebGL</div><div class="s">试试桌面版 Chrome / Safari</div>';
}

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src);
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  p.u = new Proxy({}, { get: (c, k) => (k in c ? c[k] : (c[k] = gl.getUniformLocation(p, k))) });
  p.a = new Proxy({}, { get: (c, k) => (k in c ? c[k] : (c[k] = gl.getAttribLocation(p, k))) });
  return p;
}
function buf(data, usage) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, usage || gl.STATIC_DRAW);
  return b;
}

/* ---------- shared GLSL: sky, so water & fog agree with it ---------- */
const FBM_OCT = 4;
const SKY_GLSL = `
  #define FBM_OCT ${FBM_OCT}
  const vec3 SUN_DIR = normalize(vec3(-0.34, 0.085, 0.52));   // low sun, sinking west-ish
  vec3 skyColor(vec3 d){
    float up = clamp(d.y, -1.0, 1.0);
    vec3 zen  = vec3(0.075, 0.105, 0.175);
    vec3 mid  = vec3(0.212, 0.230, 0.292);
    vec3 horiz= vec3(0.530, 0.482, 0.418);   // 秋水的黄昏是灰的，金只剩靠着太阳那一条
    float t = pow(clamp(up, 0.0, 1.0), 0.62);
    vec3 c = mix(mix(horiz, mid, smoothstep(0.0, 0.26, up)), zen, smoothstep(0.18, 0.92, t));
    float sun = max(dot(normalize(d), SUN_DIR), 0.0);
    c += vec3(0.80, 0.53, 0.29) * pow(sun, 9.0) * 0.62;
    c += vec3(0.40, 0.30, 0.22) * pow(sun, 3.2) * 0.075;
    c = mix(c, vec3(0.30, 0.29, 0.30), smoothstep(0.02, -0.30, up) * 0.75); // below horizon haze
    return c;
  }
  vec3 fogColor(vec3 d){
    vec3 fd = normalize(vec3(d.x, max(d.y, 0.008), d.z));
    return mix(skyColor(fd), vec3(0.486, 0.474, 0.446), 0.42);
  }
`;

/* ---------- sky ---------- */
const skyP = prog(`
  attribute vec2 aP; varying vec2 vP;
  void main(){ vP = aP; gl_Position = vec4(aP, 0.999, 1.0); }
`, `
  precision highp float; varying vec2 vP;
  uniform mat4 uInv; uniform float uT;
  ${SKY_GLSL}
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
  float fb(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<FBM_OCT;i++){ v+=a*vn(p); p*=2.07; a*=0.5; } return v; }
  void main(){
    vec4 q = uInv * vec4(vP, 1.0, 1.0);
    vec3 d = normalize(q.xyz / q.w);
    vec3 c = skyColor(d);
    // 秋云，被风拉长 — clouds stretched by the wind
    if (d.y > 0.006) {
      vec2 uv = d.xz / d.y;
      float band = fb(uv * vec2(0.055, 0.14) + vec2(uT * 0.0052, uT * 0.0016));
      float cl = smoothstep(0.50, 0.90, band) * smoothstep(0.012, 0.28, d.y) * (1.0 - smoothstep(0.55, 1.0, d.y));
      vec3 cc = mix(vec3(0.34,0.32,0.33), vec3(0.83,0.72,0.58), pow(clamp(1.0-d.y,0.0,1.0), 3.0));
      c = mix(c, cc, cl * 0.62);
    }
    // 灵之来兮如云 —— 九嶷之上，一队低云正贴着山脊往这边来。
    // 用方位角/仰角作坐标，不用 d.xz/d.y：贴着地平线时后者会炸开，云会碎成噪点。
    if (d.y > 0.002) {
      float az = atan(d.x, d.z);
      vec2 uv2 = vec2(az * 7.60, d.y * 6.2 - uT * 0.0125);
      float p = fb(uv2 + vec2(uT * 0.0034, 0.0));
      float host = smoothstep(0.42, 0.72, p)
                 * smoothstep(0.004, 0.040, d.y)            // 从山脊那一线起
                 * (1.0 - smoothstep(0.140, 0.420, d.y))    // 只有低低的一层
                 * smoothstep(-0.10, 0.55, d.z);            // 南边，九嶷那一头
      vec3 hc = mix(vec3(0.70, 0.69, 0.715), vec3(0.95, 0.88, 0.78),
                    pow(clamp(1.0 - d.y * 3.2, 0.0, 1.0), 3.0));
      c = mix(c, hc, host * 0.82);
    }
    c += (hash(gl_FragCoord.xy) - 0.5) * 0.010;   // dither
    gl_FragColor = vec4(c, 1.0);
  }
`);
const skyBuf = buf(new Float32Array([-1,-1, 3,-1, -1,3]));

/* ---------- water ---------- */
const WSPAN = 760;
const uintOK = !!gl.getExtension('OES_element_index_uint');
function makeWaterGrid(G) {
  const v = [], idx = [];
  for (let j = 0; j <= G; j++) for (let i = 0; i <= G; i++) {
    // non-linear spacing: dense near the viewer, huge at the rim
    const u = (i / G) * 2 - 1, w = (j / G) * 2 - 1;
    v.push(Math.sign(u) * Math.pow(Math.abs(u), 2.35) * WSPAN,
           Math.sign(w) * Math.pow(Math.abs(w), 2.35) * WSPAN);
  }
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) {
    const a = j * (G + 1) + i, b = a + 1, c = a + G + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const vb = buf(new Float32Array(v));
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, uintOK ? new Uint32Array(idx) : new Uint16Array(idx),
    gl.STATIC_DRAW);
  return { vb, ib, n: idx.length };
}
const water = makeWaterGrid(SHOT ? 190 : (uintOK ? 220 : 180));

const WAVE_GLSL = `
  // 洞庭波 — crossing swells, all running with the wind
  float waveH(vec2 p, float t){
    float h = 0.0;
    h += sin(dot(p, vec2( 0.130, 0.098)) + t * 0.92) * 0.240;
    h += sin(dot(p, vec2(-0.089, 0.176)) + t * 1.21) * 0.155;
    h += sin(dot(p, vec2( 0.305,-0.121)) + t * 1.74) * 0.072;
    h += sin(dot(p, vec2( 0.470, 0.395)) + t * 2.55) * 0.036;
    h += sin(dot(p, vec2(-0.760, 0.510)) + t * 3.40) * 0.017;
    h += sin(dot(p, vec2( 1.180,-0.905)) + t * 4.25) * 0.0135;
    h += sin(dot(p, vec2(-1.640,-1.230)) + t * 5.10) * 0.0072;
    return h;
  }
`;
const waterP = prog(`
  precision highp float;
  attribute vec2 aP; uniform mat4 uVP; uniform vec3 uCam; uniform float uT;
  varying vec3 vW; varying float vD;
  ${WAVE_GLSL}
  void main(){
    vec2 p = aP + uCam.xz;
    float h = waveH(p, uT);
    // flatten the far rim so the horizon line stays clean
    float d = length(aP);
    h *= 1.0 - smoothstep(280.0, 700.0, d);
    vW = vec3(p.x, h, p.y);
    vD = d;
    gl_Position = uVP * vec4(vW, 1.0);
  }
`, `
  precision highp float;
  varying vec3 vW; varying float vD;

function makePeaks() {

    const cx = Math.sin(a) * R, cz = Math.cos(a) * R;
    const hgt = 112 + h2(k, 9) * 96 + (k === 4 ? 58 : 0);
    const wid = 105 + h2(k, 17) * 72;
    const seg = 17;

      // 只改轮廓，不加第二重山（那个试过，两重在这个距离上读成一排灰楼房）。

function makeHouse() {
  const B = Builder();

  const HX = HOUSE.x, HZ = HOUSE.z;
  const WOOD   = [0.150, 0.118, 0.092];   // the stilts, standing in water
  const PURPLE = [0.212, 0.172, 0.232];   // 紫坛：迎光那一面原来亮成一条紫带子
  const SUN    = [0.252, 0.288, 0.196];   // 荪：秋天还绿，但迎着落日的那一面不能是荧光绿
  const GUI    = [0.318, 0.228, 0.152];   // 桂栋 cassia ridgepole
  const LAN    = [0.276, 0.256, 0.180];   // 兰橑 orchid rafters
  const XINYI  = [0.640, 0.596, 0.520];   // 辛夷楣 magnolia lintel
  const JADE   = [0.800, 0.816, 0.790];   // 白玉兮为镇
  const HE     = [0.148, 0.212, 0.168];   // 荷盖 the lotus roof

  // 桩：十六根木桩立在水里
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const x = HX - 6 + i * 4, z = HZ - 5 + j * 10 / 3;
    box(x, -0.7, z, 0.30, 4.4, 0.30, WOOD, 0);
  }
  // 紫坛：一块整板在水上读成一条紫带子。分三层砌：下面收一点、中间一道压边、
  // 上面是坛面，每层的色差一点点，走到水上抬头看才看得出这是砌起来的东西。
  box(HX, 1.05, HZ, 14.7, 0.22, 12.7, PURPLE.map(v => v * 0.84), 0);
  box(HX, 1.23, HZ, 15.3, 0.16, 13.3, PURPLE.map(v => v * 1.18), 0);
  box(HX, 1.40, HZ, 15.0, 0.20, 13.0, PURPLE, 0);
  // 坛面上的石纹：一道道横过去的浅槽，只在最上一层
  for (let i = -6; i <= 6; i++)
    box(HX + i * 1.16, 1.50, HZ, 0.06, 0.02, 12.9, PURPLE.map(v => v * 0.78), 0);
  const FLOOR = 1.52;
  // 荪壁：一根一根的菖蒲，北面留出门
  const SLAT = 0.155, WH = 3.12;
  for (let side = 0; side < 4; side++) {
    const along = side < 2 ? 4.7 : 5.3;                   // half-length of this wall
    for (let u = -along; u <= along; u += SLAT) {
      let x, z;
      if (side === 0) { x = HX - 5.35; z = HZ + u; }
      else if (side === 1) { x = HX + 5.35; z = HZ + u; }
      else if (side === 2) { x = HX + u; z = HZ + 4.75; }
      else { x = HX + u; z = HZ - 4.75; if (Math.abs(u) < 1.55) continue; }  // 门
      const k = h2(x * 3.1, z * 7.7);
      const c = SUN.map((v, i) => v * (0.80 + 0.40 * k) + (i === 1 ? 0.02 * k : 0));
      box(x, FLOOR + WH / 2 - 0.02, z, side < 2 ? 0.115 : SLAT * 0.72,

  // 兰橑：椽子

    beam([x, 6.02, HZ], [x, 4.56, HZ - 5.5], 0.13, 0.19, LAN, 0);
  }
  // 辛夷楣：门上那道白木
  box(HX, 4.80, HZ - 4.78, 4.2, 0.36, 0.30, XINYI, 0);
  // 白玉兮为镇：四块压席的白玉
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    box(HX + sx * 4.0, FLOOR + 0.22, HZ + sz * 3.4, 0.46, 0.44, 0.46, JADE, 0);
  // 北面的踏级：三级，正对着门，也正对着北渚
  for (let i = 0; i < 3; i++) {
    const y = 0.52 + i * 0.50;
    box(HX, y / 2 + 0.30, HZ - 7.05 - (2 - i) * 0.46, 3.6, y + 0.60, 0.46,
        PURPLE.map(v => v * (0.90 + 0.06 * i)), 0);
  }

  /* 合百草兮实庭，建芳馨兮庑门 —— 坛上摆满了草。

  {
    const HERB = [[0.286, 0.330, 0.226], [0.322, 0.352, 0.238], [0.250, 0.300, 0.208]];
    const tuft = (tx, tz, seed, big) => {
      const n = 5 + Math.floor(h2(seed, 2.7) * 5);
      for (let i = 0; i < n; i++) {
        const a = h2(seed + i, 3.9) * Math.PI * 2;
        const len = (0.34 + h2(seed + i, 5.3) * 0.30) * (big ? 1.7 : 1);
        const w = 0.028 + h2(seed + i, 7.9) * 0.018;
        const c = HERB[Math.floor(h2(seed + i, 9.1) * 3) % 3].map(v => v * (0.84 + 0.30 * h2(seed + i, 11.9)));
        const tipx = tx + Math.cos(a) * len * 0.55, tipz = tz + Math.sin(a) * len * 0.55;
        tri([tx - Math.sin(a) * w, FLOAT_Y, tz + Math.cos(a) * w],
            [tx + Math.sin(a) * w, FLOAT_Y, tz - Math.cos(a) * w],
            [tipx, FLOAT_Y + len, tipz], c, 0);
        tri([tx + Math.sin(a) * w, FLOAT_Y, tz - Math.cos(a) * w],
            [tx - Math.sin(a) * w, FLOAT_Y, tz + Math.cos(a) * w],
            [tipx, FLOAT_Y + len, tipz], c.map(v => v * 0.74), 0);
      }
    };
    const FLOAT_Y = FLOOR + 0.02;
    for (let i = 0; i < 260; i++) {
      const u = h2(i, 21.7) * 2 - 1, v = h2(i, 23.3) * 2 - 1;
      const tx = HX + u * 7.1, tz = HZ + v * 6.2;
      const inWall = Math.abs(tx - HX) < 5.2 && Math.abs(tz - HZ) < 4.6;
      const onMat = Math.abs(tx - HX) < 2.0 && Math.abs(tz - (HZ - 5.75)) < 1.3;
      if (inWall || onMat) continue;                 // 屋里和席上不长草
      tuft(tx, tz, i * 4.3 + 7, false);

    // 建芳馨兮庑门：门两边各一束，扎得高一点

    tuft(HX + 1.95, HZ - 4.55, 307, true);
  }

  /* 与佳期兮夕张 —— 席铺好，白玉压着四角，案摆好，案上空无一物。
     这是整个世界里唯一一处「已经准备好了」的地方。她没有来。
     铺两处：一处在水中之室的门外廊下（诗里的「筑室兮水中」），
     一处就在北渚上他站了一整天的地方（「登白薠兮骋望，与佳期兮夕张」是同一句的两半）。

  const MAT  = [1.010, 0.955, 0.788];   // 朝天的面在这个时辰几乎吃不到太阳，本色得给足   // 莞席，新的，还没有人坐过
  const HEM  = [0.520, 0.465, 0.374];   // 席边包的那道深色布
  const AN   = [0.468, 0.380, 0.282];   // 案：一张矮几
  // 席、案、镇、灯一律用 aF = -1（哑光）。这些是干的织物和陶木，不是湿的。
  // 用 0 的话它们会吃那层掠角天光：走到席跟前，一张莞席读成一块反着天的石板。
  function layMat(cx, cz, baseY, ang, k) {
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const at = (lx, lz) => [cx + lx * ca - lz * sa, cz + lx * sa + lz * ca];
    const hx = 1.16 * k, hz = 0.82 * k, my = baseY + 0.045 * k;   // 一张席：够两个人坐，不是一块甲板
    // 席面：一条一条的莞草编起来，所以它有纹路，不是一块板。
    // 用平铺的面画，不用一条条小方盒：太阳这时候贴在地平线上，
    // 朝天的面几乎吃不到光，方盒子的侧面反而最亮 —— 席于是读成一排亮线加一块暗板。
    for (let lz = -hz; lz < hz - 1e-6; lz += 0.105 * k) {
      const g = h2(lz * 9.1 + cz, 3.3);
      const c0 = MAT.map(v => v * (0.84 + 0.30 * g));
      const z0 = lz, z1 = Math.min(hz, lz + 0.092 * k);
      const p0 = at(-hx, z0), p1 = at(hx, z0), p2 = at(hx, z1), p3 = at(-hx, z1);
      quad([p0[0], my, p0[1]], [p1[0], my, p1[1]], [p2[0], my, p2[1]], [p3[0], my, p3[1]], c0, -1);
    }
    const [bx, bz] = at(0, 0);
    // 席缘：包边的那道深色布，比席面大一圈、低一点
    {
      const ex = hx + 0.075 * k, ez = hz + 0.075 * k, ey = my - 0.014 * k;
      const q0 = at(-ex, -ez), q1 = at(ex, -ez), q2 = at(ex, ez), q3 = at(-ex, ez);
      quad([q0[0], ey, q0[1]], [q1[0], ey, q1[1]], [q2[0], ey, q2[1]], [q3[0], ey, q3[1]], HEM, -1);
    }
    // 白玉兮为镇：压住席的四个角，风再大席也不掀
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const [x, z] = at(sx * (hx - 0.16 * k), sz * (hz - 0.14 * k));
      box(x, my + 0.050 * k, z, 0.165 * k, 0.085 * k, 0.165 * k, JADE.map(v => v * 0.68), -1);   // 镇：扁的，像块河里的白石
    }
    // 案：摆在席正中，空的
    // 案：薄面、翘边、四条微微外撇的腿。一块平板加四根方柱读成一张长凳。
    const ay = my + 0.225 * k;

    const ax = 0.63 * k, az = 0.27 * k;

        ax * 2 * Math.abs(sa) + az * 2 * Math.abs(ca), TOP, -1);
    for (const sz of [-1, 1]) {                       // 两道翘起来的边
      const [ex, ez] = at(0, sz * az);
      box(ex, ay + 0.030 * k, ez, ax * 2 * Math.abs(ca) + 0.075 * k * Math.abs(sa), 0.042 * k,
          ax * 2 * Math.abs(sa) + 0.075 * k * Math.abs(ca), TOP.map(v => v * 1.10), -1);
    }
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const top = at(sx * (ax - 0.10 * k), sz * (az - 0.05 * k));
      const foot = at(sx * (ax - 0.02 * k), sz * (az + 0.03 * k));
      beam([top[0], ay - 0.022 * k, top[1]], [foot[0], my + 0.030 * k, foot[1]],
           0.062 * k, 0.062 * k, AN, -1);               // 腿：往外撇一点
    }
  }
  /* 灯。夕张之后天要黑了，于是点一盏，搁在席边上。

  function lamp(cx, baseY, cz, k) {
    // 一盏灯：一根细木柱、一只浅陶盘、一朵火。方盒子加方盒子在暮色里
    // 读成一台停车计时器，不是灯。
    const POST = [0.196, 0.156, 0.120], BOWL = [0.352, 0.268, 0.186];

          BOWL.map(v => v * 0.70), -1);
    }

    box(cx, fy + 0.020 * k, cz, 0.030 * k, 0.055 * k, 0.030 * k, WICK, -1); // 灯芯
    for (let i = 0; i < 5; i++) {                                           // 火：一朵尖的
      const a0 = i / 5 * Math.PI * 2, a1 = (i + 1) / 5 * Math.PI * 2, r = 0.050 * k;
      tri([cx, fy + 0.185 * k, cz],
          [cx + Math.cos(a0) * r, fy + 0.035 * k, cz + Math.sin(a0) * r],
          [cx + Math.cos(a1) * r, fy + 0.035 * k, cz + Math.sin(a1) * r], FLAME, -1);
    }
    LAMPS.push([cx, fy + 0.10 * k, cz, k]);
  }
  lamp(HX + 1.62, FLOOR, HZ - 5.75, 1.0);

  B.mark('mats-and-lamps');
  layMat(HX, HZ - 5.75, FLOOR, 0, 1.0);
  // 北渚上的那一处：踩出来的那条路的尽头，他站了一整天的地方
  layMat(SHOAL_MAT[0], SHOAL_MAT[1], terrainH(SHOAL_MAT[0], SHOAL_MAT[1]) + 0.02, 0.34, 1.0);
  lamp(SHOAL_MAT[0] + 1.52, terrainH(SHOAL_MAT[0] + 1.52, SHOAL_MAT[1] - 0.52) + 0.02,
       SHOAL_MAT[1] - 0.52, 0.92);

  B.mark('lotus-roof');
  // 荷盖：一片压着一片的荷叶，铺满两面坡
  const tilt = Math.atan2(1.55, 5.45);
  for (const s of [-1, 1]) for (let i = 0; i < 5; i++) {
    const t = 0.06 + i * 0.225;
    const z = HZ + s * 5.45 * (1 - t), y = 4.50 + 1.62 * t;
    for (let j = 0; j <= 11; j++) {
      const x = HX - 7.15 + j * 1.3 + (i % 2) * 0.55;
      const k = h2(x * 5.3 + i, z * 2.9 + j);
      const col = HE.map((v, q) => v * (0.76 + 0.52 * k) + (q === 1 ? 0.018 * k : 0));
      lotusPad(x, y, z, 1.22 + 0.22 * k, s * tilt + (k - .5) * 0.10, col, 0, 13);
    }
  }

    const ringAt = (k) => {
      const a = spine[k], b = spine[Math.min(N, k + 1)], p = spine[Math.max(0, k - 1)];
      let dx = b.x - p.x, dy = b.y - p.y, dz = b.z - p.z;
      const dl = Math.hypot(dx, dy, dz) || 1; dx /= dl; dy /= dl; dz /= dl;
      let rx = -dz, ry = 0, rz = dx;                     // cross(d, up)
      const rl = Math.hypot(rx, ry, rz) || 1; rx /= rl; rz /= rl;
      const ux = ry * dz - rz * dy, uy = rz * dx - rx * dz, uz = rx * dy - ry * dx;
      const out = [];
      for (let j = 0; j < RING; j++) {
        const th = j / RING * Math.PI * 2;
        const cw = Math.cos(th) * a.w, sw = Math.sin(th) * a.w * 0.70;   // 略扁
        out.push([a.x + rx * cw + ux * sw, a.y + uy * sw, a.z + rz * cw + uz * sw]);
      }
      return out;
    };
    let prev = ringAt(0);
    for (let k = 1; k <= N; k++) {
      const cur = ringAt(k);
      const shade = JIAO.map(v => v * (0.80 + 0.46 * h2(k, 2)));
      for (let j = 0; j < RING; j++) {
        const j2 = (j + 1) % RING;
        quad(prev[j], cur[j], cur[j2], prev[j2], shade, 1);
      }
      prev = cur;
    }
    // 背鳍：只长在露出水面的那几节上
    for (let k = 3; k < N; k += 5) {
      const a = spine[k];
      if (a.y < 0.10 * sc) continue;
      tri([a.x, a.y + a.w * 1.25, a.z],
          [a.x - 0.45 * sc * c, a.y + a.w * 0.10, a.z - 0.45 * sc * s],
          [a.x + 0.45 * sc * c, a.y + a.w * 0.10, a.z + 0.45 * sc * s],
          JIAO.map(v => v * 1.45), 1);
    }
    // 头
    const hf = -0.5 * len + len * 0.035;
    const hx = cx + hf * c, hz = cz + hf * s;
    const HD = JIAO.map(v => v * 1.15);
    blob(hx, 0.24 * sc, hz, 1.05 * sc, 0.40 * sc, 0.56 * sc, ang, HD, 1);            // 吻
    blob(hx + 0.62 * sc * c, 0.30 * sc, hz + 0.62 * sc * s, 0.62 * sc, 0.46 * sc, 0.62 * sc, ang, HD, 1);
    for (const sd of [-1, 1])                                          // 两只角，很短
      tri([hx + (0.42 * c - sd * 0.26 * s) * sc, 0.34 * sc, hz + (0.42 * s + sd * 0.26 * c) * sc],
          [hx + (0.10 * c - sd * 0.30 * s) * sc, 0.30 * sc, hz + (0.10 * s + sd * 0.30 * c) * sc],
          [hx + (0.02 * c - sd * 0.46 * s) * sc, 0.86 * sc, hz + (0.02 * s + sd * 0.46 * c) * sc],
          HD.map(v => v * 1.25), 1);
  }

  /* 麋：它走进了为她盖的屋子，低头在吃庭中的草 */
  function elk(x, y, z, ang) {
    // 麋。远看只剩一个剪影，所以比例比细节重要：腿要细、要露出来，
    // 身子要窄，脖子要真的低下去，角要细到不和身子糊在一起。
    const c = Math.cos(ang), s = Math.sin(ang);
    const at = (f, u, r) => [x + f * c - r * s, y + u, z + f * s + r * c];
    const HIDE = ELK, DARK = ELK.map(v => v * 0.78), HORN = [0.268, 0.242, 0.200];
    beam(at(-0.86, 1.30, 0), at(0.78, 1.36, 0), 0.50, 0.58, HIDE, 0);        // 身：窄一些
    beam(at(-0.86, 1.34, 0), at(-0.62, 1.42, 0), 0.52, 0.42, HIDE, 0);       // 臀
    beam(at(0.70, 1.40, 0), at(1.30, 0.82, 0), 0.26, 0.34, HIDE, 0);         // 低下去的脖子
    beam(at(1.24, 0.80, 0), at(1.66, 0.56, 0), 0.19, 0.22, HIDE.map(v => v * 1.14), 0);  // 头
    beam(at(1.60, 0.62, 0), at(1.78, 0.44, 0), 0.13, 0.13, DARK, 0);         // 吻
    for (const [f, r, fw] of [[0.58, 0.235, 1], [0.58, -0.235, 1], [-0.64, 0.235, 0], [-0.64, -0.235, 0]]) {
      const knee = at(f + (fw ? 0.02 : -0.06), 0.62, r);
      beam(at(f, 1.08, r), knee, 0.105, 0.115, DARK, 0);                     // 上腿
      beam(knee, at(f + (fw ? 0.06 : 0.02), 0.0, r), 0.075, 0.080, DARK, 0); // 下腿：细
    }
    beam(at(-0.90, 1.40, 0), at(-1.10, 1.06, 0), 0.075, 0.10, DARK, 0);      // 尾
    for (const r of [-0.13, 0.13]) {                                          // 角：细
      const a0 = at(1.30, 0.96, r), a1 = at(0.92, 1.56, r * 2.6);
      beam(a0, a1, 0.040, 0.040, HORN, 0);
      beam(a1, at(0.52, 1.86, r * 3.6), 0.031, 0.031, HORN, 0);
      beam(a1, at(1.06, 1.92, r * 1.8), 0.027, 0.027, HORN, 0);
    }
  }

  /* 蛟：水裔上拱起的几节背脊，前头一个低低的吻和两只短角。 */
  function jiao(cx, cz, ang, len, sc) {
    sc = sc || 1;
    const c = Math.cos(ang), s = Math.sin(ang);
    for (let i = 0; i <= 44; i++) {
      const t = i / 44;
      const f = (t - 0.5) * len;
      const y = (Math.sin(t * Math.PI * 3.05) * 0.60 - 0.20) * sc;
      if (y < -0.12 * sc) continue;                       // 沉在水里的那几节，不画
      const w = 0.52 * sc * (1 - Math.pow(Math.abs(t - 0.42) * 1.9, 2.0));
      if (w <= 0.04 * sc) continue;
      const lat = Math.sin(t * Math.PI * 1.6) * len * 0.055;
      const px = cx + f * c - lat * s, pz = cz + f * s + lat * c;
      blob(px, y * 0.55, pz, w * 1.5, w * 0.78, w, ang, JIAO.map(v => v * (0.82 + 0.5 * h2(i, 2))), 1);
      if (i % 6 === 0 && y > 0.16)                   // 背鳍
        tri([px, y * 0.55 + w * 0.7, pz],
            [px - 0.5 * sc * c, y * 0.55 + 0.02, pz - 0.5 * sc * s],
            [px + 0.5 * sc * c, y * 0.55 + 0.02, pz + 0.5 * sc * s], JIAO.map(v => v * 1.4), 1);
    }
    // 头。没有头的时候，它只是水上几个驼峰，读不出是一条活物。
    const hf = -0.5 * len + len * 0.035;
    const hx = cx + hf * c, hz = cz + hf * s;
    const HD = JIAO.map(v => v * 1.15);
    blob(hx, 0.24 * sc, hz, 1.05 * sc, 0.40 * sc, 0.56 * sc, ang, HD, 1);            // 吻
    blob(hx + 0.62 * sc * c, 0.30 * sc, hz + 0.62 * sc * s, 0.62 * sc, 0.46 * sc, 0.62 * sc, ang, HD, 1);
    for (const sd of [-1, 1])                                          // 两只角，很短
      tri([hx + (0.42 * c - sd * 0.26 * s) * sc, 0.34 * sc, hz + (0.42 * s + sd * 0.26 * c) * sc],
          [hx + (0.10 * c - sd * 0.30 * s) * sc, 0.30 * sc, hz + (0.10 * s + sd * 0.30 * c) * sc],
          [hx + (0.02 * c - sd * 0.46 * s) * sc, 0.86 * sc, hz + (0.02 * s + sd * 0.46 * c) * sc],
          HD.map(v => v * 1.25), 1);
  }

  // ——— 摆进世界 ———
  // 江皋上几株空树；罾挂在其中两株上
  const TREES = [[-8, -84, 6.6, 3], [14, -76, 7.8, 11], [-34, -56, 6.0, 23],
                 [31, -58, 7.0, 31], [-53, -30, 5.6, 41], [45, -37, 6.4, 53],
                 [-18, -100, 7.2, 61],
                 // 这三株是为了那三个定机位站的：罾必须真的在画里，不能只在世界里
                 [1.5, -75.5, 7.6, 71],     // 正对着北渚那个机位
                 [-12.5, -45.5, 6.8, 83],   // 骋望那个机位的左前景
                 [-47, 16, 7.2, 97]];       // 漂在水里的那株，正对着等待那个机位
  B.mark('trees');
  for (const [x, z, h, sd] of TREES) tree(x, z, h, sd);
  // 远岸上再补几株，高矮差得开一点：原来那一排看过去几乎一样高，
  // 「洞庭波兮木叶下」的岸线不该是一排电线杆。
  for (const [x, z, h, sd] of [[-26, -92, 4.4, 113], [8, -95, 8.9, 127], [-42, -70, 5.2, 131],
                               [24, -88, 6.1, 137], [-60, -44, 4.8, 149], [52, -62, 7.4, 151],
                               [-70, -18, 5.6, 163], [62, -20, 6.6, 167]])
    tree(x, z, h, sd);
  const treeTop = (x, z, h) => Math.max(terrainH(x, z), WATER_Y - 0.55) + h * 0.66;
  B.mark('nets');
  net(14.6, terrainH(14, -76) + 5.1, -75.0, 3.6, 2.9, 0.42, 7);
  net(-33.4, terrainH(-34, -56) + 4.2, -55.4, 3.0, 2.4, 2.35, 19);
  net(45.6, terrainH(45, -37) + 4.5, -36.4, 2.6, 2.1, 1.05, 29);
  // 挂在近处那三株上的罾，大一些，低一些，好让人一眼看见它不该在这儿
  net(1.9, treeTop(1.5, -75.5, 7.6), -74.7, 4.6, 3.6, 0.10, 73);
  net(-12.1, treeTop(-12.5, -45.5, 6.8), -44.8, 4.0, 3.2, 1.62, 85);
  net(-46.6, treeTop(-47, 16, 7.2), 16.7, 4.4, 3.5, 2.02, 99);

  // 衣裳搭在哪根枝上，那根枝就得真的在那儿——而且那根枝得从树干上长出来。
  // 一根浮在半空的横木比没有横木还糟。这两根枝各自从旁边那株枯树上伸过来。
  beam([ 1.35, 5.78, -75.35], [-2.10, 5.28, -74.70], 0.16, 0.14, BARK, 0);
  beam([-12.45, 4.78, -45.45], [-11.45, 4.30, -46.35], 0.15, 0.13, BARK, 0);

  // 鸟落在蘋中，不落在树上
  B.mark('ping-and-birds');
  pingPatch(19, -7, 7.2, 5, 7);
  pingPatch(-25, 9, 6.4, 17, 5);
  pingPatch(21, 96, 8.0, 29, 9);
  pingPatch(-16, 58, 5.6, 37, 4);
  pingPatch(-44, -6, 6.0, 47, 6);
  pingPatch(-53, 27, 7.0, 59, 8);
  pingPatch(-7, -29, 7.6, 67, 9);
  // 鸟何萃兮蘋中 —— 这一句在三个机位里一直看不见。把一片蘋挪到「时不可兮骤得」
  // 那个机位的跟前：鸟就落在水草里，不落在树上，近得看得清它们没有在飞。
  pingPatch(-60.5, 34.5, 5.4, 77, 4, 1.05);
  pingPatch(-55.0, 27.0, 4.2, 83, 2, 0.95);
  // 蘋中的鸟不该只在一个地方：北渚两侧的浅水里也各有一片，
  // 走在渚上往东往西看，都看得见鸟落在水草里。
  pingPatch(-26.0, -40.0, 6.2, 89, 4, 1.15);
  pingPatch( 22.0, -52.0, 5.6, 97, 3, 1.10);
  pingPatch(-14.0, -86.0, 5.0, 101, 3, 1.05);

  /* 沅有芷兮澧有兰 —— 两条水，各自的香草。
     两丛必须一眼分得开：芷是直的，顶上一把白伞；兰是弯的，一丛窄叶从根上散开。
     西边的沙洲是沅，长芷；东边的是澧，长兰。 */
  const ZHI_STEM = [0.268, 0.300, 0.204], ZHI_UMBEL = [0.812, 0.822, 0.762];
  const LAN_LEAF = [0.212, 0.286, 0.196], LAN_FLOWER = [0.556, 0.500, 0.612];
  function zhi(x, z, seed) {                        // 白芷：一根直杆，顶上一把伞
    const y = terrainH(x, z);
    if (y < 0.20) return;
    const h = 0.78 + h2(seed, 2.2) * 0.92;   // 高矮拉开，别长得一样高
    box(x, y + h / 2, z, 0.045, h, 0.045, ZHI_STEM, 0);
    // 伞形花序：一把小伞，伞下还有一两把更小的。伞太小的话，
    // 一丛芷在草里只剩几个白点，认不出是伞形科的花。
    // 伞形花序：一把小伞。试过把它做成拱起来的半球，一丛芷立刻读成一片白蘑菇——
    // 平的那一版才像花序，留平的。
    const umbel = (ux, uy, uz, ur, n) => {
      for (let i = 0; i < n; i++) {
        const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2;
        const k = 0.86 + 0.28 * h2(seed + i, 7.7);
        tri([ux, uy + 0.055, uz],
            [ux + Math.cos(a0) * ur * k, uy, uz + Math.sin(a0) * ur * k],
            [ux + Math.cos(a1) * ur * k, uy, uz + Math.sin(a1) * ur * k],
            ZHI_UMBEL.map(v => v * (0.84 + 0.26 * h2(seed + i, 3.3))), 0);
      }
    };
    umbel(x, y + h, z, 0.28 + h2(seed, 5.1) * 0.13, 11);
    for (let q = 0; q < 2; q++) {
      const a = h2(seed + q, 6.3) * Math.PI * 2, r = 0.16 + h2(seed + q, 8.1) * 0.12;
      const sx = x + Math.cos(a) * r, sz = z + Math.sin(a) * r;
      const sh = y + h * (0.62 + 0.16 * h2(seed + q, 9.7));
      box((x + sx) / 2, (y + h * 0.5 + sh) / 2, (z + sz) / 2, 0.030, h * 0.30, 0.030, ZHI_STEM, 0);
      umbel(sx, sh, sz, 0.17 + h2(seed + q, 11.3) * 0.08, 9);
    }
  }
  function lan(x, z, seed) {                        // 兰：一丛窄叶，从根上弯出去
    const y = terrainH(x, z);
    if (y < 0.20) return;
    const n = 6 + Math.floor(h2(seed, 1.3) * 5);
    for (let i = 0; i < n; i++) {
      const a = h2(seed + i, 2.9) * Math.PI * 2;
      const len = 0.55 + h2(seed + i, 4.4) * 0.60, bend = 0.42 + h2(seed + i, 6.1) * 0.55;
      const tipx = x + Math.cos(a) * len * bend, tipz = z + Math.sin(a) * len * bend;
      const w = 0.030 + h2(seed + i, 8.8) * 0.020;
      const c = LAN_LEAF.map(v => v * (0.82 + 0.34 * h2(seed + i, 9.9)));
      tri([x - Math.sin(a) * w, y, z + Math.cos(a) * w],
          [x + Math.sin(a) * w, y, z - Math.cos(a) * w],
          [tipx, y + len * 0.92, tipz], c, 0);
      tri([x + Math.sin(a) * w, y, z - Math.cos(a) * w],
          [x - Math.sin(a) * w, y, z + Math.cos(a) * w],
          [tipx, y + len * 0.92, tipz], c.map(v => v * 0.70), 0);
    }
    if (h2(seed, 12.1) > 0.62) {                    // 一枝花，很小
      // 兰花是几片细长的瓣张开，不是一块紫色的砖。
      const fh = y + 0.60 + h2(seed, 13.3) * 0.28;
      const fx = x + 0.04, fz = z;
      box(fx, (y + fh) / 2, fz, 0.018, fh - y, 0.018, LAN_LEAF, 0);
      const base = h2(seed, 15.7) * Math.PI * 2;
      for (let q = 0; q < 5; q++) {
        const pa = base + q * 1.2566 + (h2(seed + q, 17.9) - 0.5) * 0.4;
        const pr = 0.105 + h2(seed + q, 19.3) * 0.055;
        const drop = q < 3 ? -0.035 : 0.030;          // 上面两片翘，下面三片垂
        tri([fx, fh + 0.020, fz],
            [fx + Math.cos(pa) * pr, fh + drop, fz + Math.sin(pa) * pr],
            [fx + Math.cos(pa + 0.42) * pr * 0.72, fh + drop * 0.6, fz + Math.sin(pa + 0.42) * pr * 0.72],
            LAN_FLOWER.map(v => v * (0.90 + 0.22 * h2(seed + q, 21.1))), 0);
      }
    }
  }
  B.mark('zhi-and-lan');
  // 沅（西）有芷。原来种在 (-46,-24) 那道沙洲上——那地方水深 0.7 米，
  // 一株都没长出来（zhi() 要求地面高过 0.2）。挪到北渚西岸真正露出水面的那一段。
  for (let i = 0; i < 130; i++) {
    const a = h2(i, 21.1) * Math.PI * 2, r = 2.5 + Math.pow(h2(i, 22.3), 0.6) * 13.0;
    zhi(-31 + Math.cos(a) * r, -60 + Math.sin(a) * r * 1.35, i * 3.7 + 1);
  }
  // 站在骋望的高处往西看，之前只有草：芷都挤在更西边的那一丛里。
  // 顺着西岸的水边再撒一带，让「沅有芷」在望得见的地方成立。
  for (let i = 0; i < 150; i++) {
    const x = -30 + h2(i, 26.1) * 22, z = -70 + h2(i, 27.7) * 24;
    const y = terrainH(x, z);
    if (y > 0.26 && y < 3.2) zhi(x, z, i * 5.9 + 601);
  }

  // 澧（东）有兰：东边那道沙洲刚好露出水面一点点，兰就长在水边上
  for (let i = 0; i < 130; i++) {
    const a = h2(i, 31.7) * Math.PI * 2, r = 2.5 + Math.pow(h2(i, 32.9), 0.6) * 12.0;
    lan(27 + Math.cos(a) * r, -37 + Math.sin(a) * r * 1.20, i * 5.3 + 2);
  }

  // 东岸同理：从骋望往东望，澧上要有兰。两岸对称，一边伞形的白，一边窄叶的绿。
  for (let i = 0; i < 150; i++) {
    const x = 8 + h2(i, 36.3) * 22, z = -70 + h2(i, 37.9) * 24;
    const y = terrainH(x, z);
    if (y > 0.26 && y < 3.2) lan(x, z, i * 6.7 + 701);
  }

  /* 搴汀洲兮杜若，将以遗兮远者 —— 汀洲上的杜若：宽叶、一小簇白花。
     摘下来是要送给远方的那个人的。所以它长在水刚退下去的那一片平沙上，
     伸手就够得着；而且它必须和芷、兰都不一样：芷是伞，兰是窄叶，杜若是宽叶。 */
  const RUO_LEAF = [0.186, 0.232, 0.152], RUO_FLOWER = [0.840, 0.828, 0.772];
  function duruo(x, z, seed) {
    const y = terrainH(x, z);
    if (y < 0.12 || y > 2.60) return;                 // 只长在水退下去的那片湿沙上
    const n = 5 + Math.floor(h2(seed, 1.9) * 4);
    for (let i = 0; i < n; i++) {
      const a = h2(seed + i, 3.7) * Math.PI * 2;
      const len = 0.42 + h2(seed + i, 5.5) * 0.30;
      const w0 = 0.062 + h2(seed + i, 7.1) * 0.026;
      const ca = Math.cos(a), sa = Math.sin(a);
      const c = RUO_LEAF.map(v => v * (0.80 + 0.36 * h2(seed + i, 11.7)));
      const cd = c.map(v => v * 0.54);
      // 一片宽叶：沿着一条从根立起、到梢垂出去的弧走，中间一道折。
      // 两个三角形拼的平板在草里读成一只纸风筝。
      const P = (t) => {
        const up = len * (1.18 * t - 0.26 * t * t * t);
        const out = len * (0.16 * t + 0.72 * t * t * t);
        return { x: x + ca * out, y: y + 0.02 + up, z: z + sa * out,
                 w: w0 * (0.55 + 1.35 * t - 1.35 * t * t), fold: 0.055 * (1 - t) * len };
      };
      let A = P(0);
      for (let q = 1; q <= 4; q++) {
        const B = P(q / 4);
        const al = [A.x - sa * A.w, A.y, A.z + ca * A.w], ar = [A.x + sa * A.w, A.y, A.z - ca * A.w];
        const bl = [B.x - sa * B.w, B.y, B.z + ca * B.w], br = [B.x + sa * B.w, B.y, B.z - ca * B.w];
        const am = [A.x, A.y + A.fold, A.z], bm = [B.x, B.y + B.fold, B.z];
        quad(al, bl, bm, am, c, 0);                 // 左半片
        quad(am, bm, br, ar, cd, 0);                // 右半片：折过去，暗得多——明暗差小了就读成塑料
        A = B;

    // 圈越走越宽、越走越淡。上一版内外两条边一样亮，于是它是一道硬白线；
    // 现在亮度在环心最高、往两边落到零，看起来才像水面自己鼓起来的一道缓坡。
    const wid = 0.045 + u * 0.135;
    const fade = (1 - u) * (1 - u) * 0.335;   // 去掉掠角那层反射之后，环心得补亮回来
    const lift = 0.030 * Math.exp(-u * 3.4);
    for (let i = 0; i < RIPPLE_SEG; i++) {
      const a0 = i / RIPPLE_SEG * Math.PI * 2, a1 = (i + 1) / RIPPLE_SEG * Math.PI * 2;
      const pt = (a, r, h) => {
        const x = R.x + Math.cos(a) * r, z = R.z + Math.sin(a) * r;
        return [x, WATER_Y + waveJS(x, z, t) + lift * h, z];
      };
      const push = (q, g) => {
        rippleData[o++] = q[0]; rippleData[o++] = q[1]; rippleData[o++] = q[2];
        rippleData[o++] = 0; rippleData[o++] = 1; rippleData[o++] = 0;
        rippleData[o++] = 0.300 * g; rippleData[o++] = 0.292 * g; rippleData[o++] = 0.272 * g;
        // aF < 0：和绢一样不吃那层掠角天光。加了它，这圈才真是由内向外淡掉的；
        // 不加，掠角反射会在环上糊一条亮度恒定的边，梯度全白做。
        rippleData[o++] = -1;
      };
      const iA = pt(a0, rad - wid, 0), iB = pt(a1, rad - wid, 0);
      const mA = pt(a0, rad, 1),       mB = pt(a1, rad, 1);
      const oA = pt(a0, rad + wid, 0), oB = pt(a1, rad + wid, 0);
      // 内带：0 → fade
      push(iA, 0); push(mA, fade); push(mB, fade);
      push(iA, 0); push(mB, fade); push(iB, 0);
      // 外带：fade → 0
      push(mA, fade); push(oA, 0); push(oB, 0);
      push(mA, fade); push(oB, 0); push(mB, fade);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, rippleBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, rippleData);
}

/* ---------- 灯晕 ----------
   一盏灯在暮色里不是一个点，是一团慢慢呼吸的光。这团光也是加色画的，
   和涟漪同一遍：中心亮，边上落到零。                                  */
const GLOW_SEG = 14;
const GLOW_N = 64 * GLOW_SEG * 3;      // 上限；实际用到 LAMPS.length * GLOW_SEG * 3
const glowData = new Float32Array(GLOW_N * 10);
const glowBuf = buf(glowData, gl.DYNAMIC_DRAW);
function updateGlow(t) {
  let o = 0;
  const rt = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
  for (let i = 0; i < LAMPS.length; i++) {
    const [lx, ly, lz, k] = LAMPS[i];
    const flick = 0.86 + 0.14 * Math.sin(t * 2.7 + i * 2.1) + 0.06 * Math.sin(t * 6.3 + i);
    // 走到灯跟前的时候，这团晕要收：一米见方的加色圆盘贴到两米处的眼睛上，
    // 就是一块糊住半个画面的白斑。远看是晕，近看只该剩火苗周围一点点。
    const dcam = Math.hypot(lx - cam.x, ly - cam.y, lz - cam.z);
    const near = Math.min(1, Math.max(0.16, (dcam - 0.6) / 3.4));
    const r = (1.05 + 0.07 * Math.sin(t * 1.7 + i)) * k * near;
    const g = 0.78 * flick * (0.32 + 0.68 * near);
    for (let j = 0; j < GLOW_SEG; j++) {
      const a0 = j / GLOW_SEG * Math.PI * 2, a1 = (j + 1) / GLOW_SEG * Math.PI * 2;
      const rim = (a) => [lx + rt[0] * Math.cos(a) * r, ly + Math.sin(a) * r, lz + rt[2] * Math.cos(a) * r];
      const push = (q, w) => {
        glowData[o++] = q[0]; glowData[o++] = q[1]; glowData[o++] = q[2];
        glowData[o++] = 0; glowData[o++] = 1; glowData[o++] = 0;
        glowData[o++] = 1.00 * w; glowData[o++] = 0.62 * w; glowData[o++] = 0.26 * w;
        glowData[o++] = -1;
      };
      push([lx, ly, lz], g); push(rim(a0), 0); push(rim(a1), 0);
    }
  }
  for (let q = o; q < GLOW_N * 10; q++) glowData[q] = 0;
  gl.bindBuffer(gl.ARRAY_BUFFER, glowBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, glowData);
}

/* drag-to-look (no pointer lock) + touch stick */
let isTouch = false, dragId = null, dragX = 0, dragY = 0;
let stick = null;   // {id, ox, oy, dx, dy}
canvas.addEventListener('pointerdown', e => {
  pokeLive();
  if (e.pointerType === 'touch') isTouch = true;
  if (!entered) { enterWorld(); if (e.pointerType === 'touch') return; }
  const leftHalf = e.clientX - canvas.getBoundingClientRect().left < canvas.clientWidth * 0.42;
  if (e.pointerType === 'touch' && leftHalf && !stick) {
    stick = { id: e.pointerId, ox: e.clientX, oy: e.clientY, dx: 0, dy: 0 };
  } else if (dragId === null) {
    dragId = e.pointerId; dragX = e.clientX; dragY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  }
});
canvas.addEventListener('pointermove', e => {
  if (stick && e.pointerId === stick.id) {
    stick.dx = Math.max(-1, Math.min(1, (e.clientX - stick.ox) / 62));
    stick.dy = Math.max(-1, Math.min(1, (e.clientY - stick.oy) / 62));
    return;
  }
  if (e.pointerId !== dragId || pointerLocked) return;
  cam.yaw   -= (e.clientX - dragX) * 0.0040;
  cam.pitch = Math.max(-1.35, Math.min(1.1, cam.pitch - (e.clientY - dragY) * 0.0034));
  dragX = e.clientX; dragY = e.clientY;
});
function endPtr(e) {
  if (stick && e.pointerId === stick.id) stick = null;
  if (e.pointerId === dragId) dragId = null;
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);

const compass = document.getElementById('compass');

/* ---------- loop ---------- */
const vp = M.create(), view = M.create(), proj = M.create(), inv = M.create();
function invert(o, m) {   // full 4x4 inverse (used only for the sky ray)
  const a = m, b = o;
  const a00=a[0],a01=a[1],a02=a[2],a03=a[3],a10=a[4],a11=a[5],a12=a[6],a13=a[7],
        a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  const b00=a00*a11-a01*a10,b01=a00*a12-a02*a10,b02=a00*a13-a03*a10,b03=a01*a12-a02*a11,
        b04=a01*a13-a03*a11,b05=a02*a13-a03*a12,b06=a20*a31-a21*a30,b07=a20*a32-a22*a30,
        b08=a20*a33-a23*a30,b09=a21*a32-a22*a31,b10=a21*a33-a23*a31,b11=a22*a33-a23*a32;
  let det = b00*b11-b01*b10+b02*b09+b03*b08-b04*b07+b05*b06;
  if (!det) return b; det = 1/det;
  b[0]=(a11*b11-a12*b10+a13*b09)*det; b[1]=(a02*b10-a01*b11-a03*b09)*det;
  b[2]=(a31*b05-a32*b04+a33*b03)*det; b[3]=(a22*b04-a21*b05-a23*b03)*det;
  b[4]=(a12*b08-a10*b11-a13*b07)*det; b[5]=(a00*b11-a02*b08+a03*b07)*det;
  b[6]=(a32*b02-a30*b05-a33*b01)*det; b[7]=(a20*b05-a22*b02+a23*b01)*det;
  b[8]=(a10*b10-a11*b08+a13*b06)*det; b[9]=(a01*b08-a00*b10-a03*b06)*det;
  b[10]=(a30*b04-a31*b02+a33*b00)*det; b[11]=(a21*b02-a20*b04-a23*b00)*det;
  b[12]=(a11*b07-a10*b09-a12*b06)*det; b[13]=(a00*b09-a01*b07+a02*b06)*det;
  b[14]=(a31*b01-a30*b03-a32*b00)*det; b[15]=(a20*b03-a21*b01+a22*b00)*det;
  return b;
}

function resize() {
  const dpr = SHOT ? 1 : Math.min(devicePixelRatio || 1, LITE ? 1 : 1.5);
  const cssW = SHOT ? (window.innerWidth || 960) : canvas.clientWidth;
  const cssH = SHOT ? (window.innerHeight || 600) : canvas.clientHeight;
  const w = Math.max(1, Math.round(cssW * dpr));
  const h = Math.max(1, Math.round(cssH * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}

function step(dt, t) {
  // ---- walk ----
  const run = keys.ShiftLeft || keys.ShiftRight ? 2.35 : 1;
  let fx = 0, sx = 0;
  if (keys.KeyW || keys.ArrowUp) fx += 1;
  if (keys.KeyS || keys.ArrowDown) fx -= 1;
  if (keys.KeyD || keys.ArrowRight) sx += 1;
  if (keys.KeyA || keys.ArrowLeft) sx -= 1;
  if (stick) { fx -= stick.dy * 1.2; sx += stick.dx * 1.2; }
  const m = Math.hypot(fx, sx);
  if (m > 1) { fx /= m; sx /= m; }
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const fwd = [-sy, -cy], rgt = [cy, -sy];
  const under = terrainH(cam.x, cam.z);
  const wading = under < WATER_Y ? Math.min(1, (WATER_Y - under) / 1.4) : 0;
  const speed = 4.5 * run * (1 - 0.45 * wading);
  cam.x += (fwd[0] * fx + rgt[0] * sx) * speed * dt;
  cam.z += (fwd[1] * fx + rgt[1] * sx) * speed * dt;
  // keep the wanderer inside the bay
  const R = Math.hypot(cam.x, cam.z + 30);
  if (R > 210) { cam.x *= 210 / R; cam.z = (cam.z + 30) * (210 / R) - 30; }

  // 水中之室：踏级上坛，走到廊下，进不去。
  // 原来这里把人挡在整座台基之外 —— 于是铺好的席、点着的灯、庭中的百草，
  // 谁也走不到跟前。挡的应该是屋（荪壁），不是坛。
  {
    const dx = cam.x - HOUSE.x, dz = cam.z - HOUSE.z;
    const ax = Math.abs(dx) / 5.62, az = Math.abs(dz) / 5.02;     // 荪壁 + 一点余量
    if (ax < 1 && az < 1) {
      if (ax > az) cam.x = HOUSE.x + Math.sign(dx || 1) * 5.62;
      else         cam.z = HOUSE.z + Math.sign(dz || 1) * 5.02;
    }
  }

  // 站在坛上的时候，脚下是坛面不是湖底
  let stand = groundY(cam.x, cam.z);
  {
    const dx = Math.abs(cam.x - HOUSE.x), dz = Math.abs(cam.z - HOUSE.z);
    if (dx < 7.72 && dz < 6.72) stand = Math.max(stand, 1.52);     // 紫坛坛面
    else if (dx < 9.1 && dz < 8.1 && cam.z < HOUSE.z) {
      // 北面那道踏级：从水里一级一级上到坛面
      const t = Math.max(0, Math.min(1, (6.72 + 1.38 - dz) / 1.38));
      stand = Math.max(stand, 1.52 * Math.ceil(t * 3) / 3);
    }
  }
  const target = stand + EYE - wading * 0.42;
  cam.y += (target - cam.y) * Math.min(1, dt * 7.5);

  // ---- leaves ----
  let o = 0;
  for (const L of leaves) {
    L.y += L.vy * dt;
    const s = Math.sin(t * L.sw + L.sp);
    L.x += (WIND[0] * 1.15 + s * 0.85) * dt;
    L.z += (WIND[1] * 1.15 + Math.cos(t * L.sw * 0.83 + L.sp) * 0.85) * dt;
    L.rot += L.rv * dt;
    const surf = groundY(L.x, L.z);
    if (L.y < surf + 0.06 && L.y >= surf - 0.2 && terrainH(L.x, L.z) < WATER_Y - 0.15)
      dropRipple(L.x, L.z, t);                      // 落在水上的那一片，水替它记一笔
    // 贴着镜头的那一片会被近裁剪面切开，糊住半个画面：让它落到别处去
    const near = Math.hypot(L.x - cam.x, L.y - cam.y, L.z - cam.z) < 5.0;
    if (near || L.y < surf - 0.2 || Math.abs(L.x - cam.x) > 68 || Math.abs(L.z - cam.z) > 68) {
      L.x = cam.x + (leafRnd() * 2 - 1) * 62;
      L.z = cam.z + (leafRnd() * 2 - 1) * 62;
      L.y = groundY(L.x, L.z) + 14 + leafRnd() * 16;
    }
    for (let k = 0; k < 6; k++) {
      leafData[o++] = L.x; leafData[o++] = L.y; leafData[o++] = L.z;
      leafData[o++] = CORNERS[k][0]; leafData[o++] = CORNERS[k][1];
      leafData[o++] = L.rot; leafData[o++] = L.tint; leafData[o++] = L.sz;
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, leafBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, leafData);

  updateCloths(t);
  updateFloatLeaves(t);
  updateRipples(t);
  updateGlow(t);

  updateSubtitle();
  const deg = ((-cam.yaw * 180 / Math.PI) % 360 + 360) % 360;
  compass.textContent = ['北','东北','东','东南','南','西南','西','西北'][Math.round(deg / 45) % 8];
}

let sceneT = 0, lastFrameMs = 0;
function draw(t) {
  const frameT0 = performance.now();
  sceneT = t;
  glStats.calls = 0; glStats.tris = 0;
  resize();
  // 两盏灯的位置（廊下一盏、席边一盏）：水、地、草、物件都按它算光
  const LA = LAMPS[0] ? [LAMPS[0][0], LAMPS[0][1], LAMPS[0][2]] : [0, -999, 0];
  const LB = LAMPS[1] ? [LAMPS[1][0], LAMPS[1][1], LAMPS[1][2]] : [0, -999, 0];
  const W = canvas.width, H = canvas.height;
  gl.viewport(0, 0, W, H);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.BLEND);
  gl.clearColor(0.09, 0.10, 0.12, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const cp = Math.cos(cam.pitch), f = [-Math.sin(cam.yaw) * cp, Math.sin(cam.pitch), -Math.cos(cam.yaw) * cp];
  const eye = [cam.x, cam.y, cam.z];
  M.perspective(proj, 1.02, W / H, 0.1, 2600);
  M.lookAt(view, eye, [eye[0] + f[0], eye[1] + f[1], eye[2] + f[2]], [0, 1, 0]);
  M.mul(vp, proj, view);
  invert(inv, vp);

  // sky
  gl.useProgram(skyP);
  gl.uniformMatrix4fv(skyP.u.uInv, false, inv);
  gl.uniform1f(skyP.u.uT, t);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf);
  gl.enableVertexAttribArray(skyP.a.aP);
  gl.vertexAttribPointer(skyP.a.aP, 2, gl.FLOAT, false, 0, 0);
  gl.depthMask(false);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.depthMask(true);

  // peaks
  gl.useProgram(peakP);
  gl.uniformMatrix4fv(peakP.u.uVP, false, vp);
  gl.uniform3fv(peakP.u.uCam, eye);
  gl.bindBuffer(gl.ARRAY_BUFFER, peaks.vb);
  gl.enableVertexAttribArray(peakP.a.aP);
  gl.vertexAttribPointer(peakP.a.aP, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, peaks.n);

  // water
  gl.useProgram(waterP);
  gl.uniformMatrix4fv(waterP.u.uVP, false, vp);
  gl.uniform3fv(waterP.u.uCam, eye);
  gl.uniform1f(waterP.u.uT, t);
  gl.uniform3fv(waterP.u.uLampA, LA);
  gl.uniform3fv(waterP.u.uLampB, LB);
  gl.bindBuffer(gl.ARRAY_BUFFER, water.vb);
  gl.enableVertexAttribArray(waterP.a.aP);
  gl.vertexAttribPointer(waterP.a.aP, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, water.ib);
  gl.drawElements(gl.TRIANGLES, water.n, uintOK ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);

  // terrain
  gl.useProgram(terrP);
  gl.uniformMatrix4fv(terrP.u.uVP, false, vp);
  gl.uniform3fv(terrP.u.uCam, eye);
  gl.uniform1f(terrP.u.uT, t);
  gl.uniform3fv(terrP.u.uLampA, LA);
  gl.uniform3fv(terrP.u.uLampB, LB);
  gl.bindBuffer(gl.ARRAY_BUFFER, terrain.vb);
  gl.enableVertexAttribArray(terrP.a.aP);
  gl.vertexAttribPointer(terrP.a.aP, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(terrP.a.aN);
  gl.vertexAttribPointer(terrP.a.aN, 3, gl.FLOAT, false, 24, 12);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, terrain.ib);
  gl.drawElements(gl.TRIANGLES, terrain.n, uintOK ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT, 0);

  // 水中之室
  gl.useProgram(objP);
  gl.uniformMatrix4fv(objP.u.uVP, false, vp);
  gl.uniform3fv(objP.u.uCam, eye);
  gl.uniform1f(objP.u.uT, t);
  // 两盏灯的位置（廊下一盏、席边一盏）：谁离得近，谁就被它照着
  gl.uniform3fv(objP.u.uLampA, LA);
  gl.uniform3fv(objP.u.uLampB, LB);
  gl.bindBuffer(gl.ARRAY_BUFFER, house.vb);
  gl.enableVertexAttribArray(objP.a.aP);
  gl.vertexAttribPointer(objP.a.aP, 3, gl.FLOAT, false, 40, 0);
  gl.enableVertexAttribArray(objP.a.aN);
  gl.vertexAttribPointer(objP.a.aN, 3, gl.FLOAT, false, 40, 12);
  gl.enableVertexAttribArray(objP.a.aC);
  gl.vertexAttribPointer(objP.a.aC, 3, gl.FLOAT, false, 40, 24);
  gl.enableVertexAttribArray(objP.a.aF);
  gl.vertexAttribPointer(objP.a.aF, 1, gl.FLOAT, false, 40, 36);
  gl.disable(gl.CULL_FACE);
  gl.drawArrays(gl.TRIANGLES, 0, house.n);

  // 错位：罾在木上、鸟在蘋中、麋在庭中、蛟在水裔
  gl.bindBuffer(gl.ARRAY_BUFFER, wrong.vb);
  gl.vertexAttribPointer(objP.a.aP, 3, gl.FLOAT, false, 40, 0);
  gl.vertexAttribPointer(objP.a.aN, 3, gl.FLOAT, false, 40, 12);
  gl.vertexAttribPointer(objP.a.aC, 3, gl.FLOAT, false, 40, 24);
  gl.vertexAttribPointer(objP.a.aF, 1, gl.FLOAT, false, 40, 36);
  gl.drawArrays(gl.TRIANGLES, 0, wrong.n);

  // 捐余袂兮江中
  gl.bindBuffer(gl.ARRAY_BUFFER, clothBuf);
  gl.vertexAttribPointer(objP.a.aP, 3, gl.FLOAT, false, 40, 0);
  gl.vertexAttribPointer(objP.a.aN, 3, gl.FLOAT, false, 40, 12);
  gl.vertexAttribPointer(objP.a.aC, 3, gl.FLOAT, false, 40, 24);
  gl.vertexAttribPointer(objP.a.aF, 1, gl.FLOAT, false, 40, 36);
  gl.drawArrays(gl.TRIANGLES, 0, CLOTH_N);

  // 已经落在水上的木叶
  gl.bindBuffer(gl.ARRAY_BUFFER, floatBuf);
  gl.vertexAttribPointer(objP.a.aP, 3, gl.FLOAT, false, 40, 0);
  gl.vertexAttribPointer(objP.a.aN, 3, gl.FLOAT, false, 40, 12);
  gl.vertexAttribPointer(objP.a.aC, 3, gl.FLOAT, false, 40, 24);
  gl.vertexAttribPointer(objP.a.aF, 1, gl.FLOAT, false, 40, 36);
  gl.drawArrays(gl.TRIANGLES, 0, FLOATN * 6);

  // 落叶在水上荡开的圈
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  gl.depthMask(false);
  gl.bindBuffer(gl.ARRAY_BUFFER, rippleBuf);
  gl.vertexAttribPointer(objP.a.aP, 3, gl.FLOAT, false, 40, 0);
  gl.vertexAttribPointer(objP.a.aN, 3, gl.FLOAT, false, 40, 12);
  gl.vertexAttribPointer(objP.a.aC, 3, gl.FLOAT, false, 40, 24);
  gl.vertexAttribPointer(objP.a.aF, 1, gl.FLOAT, false, 40, 36);
  gl.drawArrays(gl.TRIANGLES, 0, RIPPLE_N);
  // 灯晕：和涟漪同一遍加色
  gl.bindBuffer(gl.ARRAY_BUFFER, glowBuf);
  gl.vertexAttribPointer(objP.a.aP, 3, gl.FLOAT, false, 40, 0);
  gl.vertexAttribPointer(objP.a.aN, 3, gl.FLOAT, false, 40, 12);
  gl.vertexAttribPointer(objP.a.aC, 3, gl.FLOAT, false, 40, 24);
  gl.vertexAttribPointer(objP.a.aF, 1, gl.FLOAT, false, 40, 36);
  gl.drawArrays(gl.TRIANGLES, 0, LAMPS.length * GLOW_SEG * 3);
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  // sedge
  gl.useProgram(bladeP);
  gl.uniformMatrix4fv(bladeP.u.uVP, false, vp);
  gl.uniform3fv(bladeP.u.uCam, eye);
  gl.uniform1f(bladeP.u.uT, t);
  gl.uniform2fv(bladeP.u.uWind, WIND);
  gl.uniform3fv(bladeP.u.uLampA, LA);
  gl.uniform3fv(bladeP.u.uLampB, LB);
  gl.bindBuffer(gl.ARRAY_BUFFER, blades.vb);
  gl.enableVertexAttribArray(bladeP.a.aP);
  gl.vertexAttribPointer(bladeP.a.aP, 3, gl.FLOAT, false, 24, 0);
  gl.enableVertexAttribArray(bladeP.a.aQ);
  gl.vertexAttribPointer(bladeP.a.aQ, 3, gl.FLOAT, false, 24, 12);
  gl.drawArrays(gl.TRIANGLES, 0, blades.n);

  // leaves
  gl.useProgram(leafP);
  gl.uniformMatrix4fv(leafP.u.uVP, false, vp);
  gl.uniform3fv(leafP.u.uCam, eye);
  const right = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
  const up = [f[1] * right[2] - f[2] * right[1], f[2] * right[0] - f[0] * right[2], f[0] * right[1] - f[1] * right[0]];
  gl.uniform3fv(leafP.u.uRight, right);
  gl.uniform3fv(leafP.u.uUp, [-up[0], -up[1], -up[2]]);
  gl.bindBuffer(gl.ARRAY_BUFFER, leafBuf);
  gl.enableVertexAttribArray(leafP.a.aC);
  gl.vertexAttribPointer(leafP.a.aC, 3, gl.FLOAT, false, 32, 0);
  gl.enableVertexAttribArray(leafP.a.aO);
  gl.vertexAttribPointer(leafP.a.aO, 2, gl.FLOAT, false, 32, 12);
  gl.enableVertexAttribArray(leafP.a.aQ);
  gl.vertexAttribPointer(leafP.a.aQ, 3, gl.FLOAT, false, 32, 20);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.drawArrays(gl.TRIANGLES, 0, NLEAF * 6);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  lastFrameMs = performance.now() - frameT0;
}

/* 取证模式下不能挂着 rAF 空转：画 1 帧就停。机位切换走 window.__poemShot，不重建场景。 */
const SHOT_FRAMES = 1, SHOT_DT = 1 / 20, SHOT_T0 = 7.5;

function scatterShotAroundCam() {
  const shotRnd = mkRnd(0x5F356495);
  for (const L of leaves) {
    const a = shotRnd() * Math.PI * 2, d = 3.5 + shotRnd() * 30;
    L.x = cam.x + Math.cos(a) * d;
    L.z = cam.z + Math.sin(a) * d;
    L.y = groundY(L.x, L.z) + shotRnd() * 17;
  }
  ripples.length = 0;
  rippleHead = 0;
  for (let i = 0; i < NRIPPLE; i++) {
    const a = shotRnd() * Math.PI * 2, d = 9 + shotRnd() * 42;
    const x = cam.x + Math.cos(a) * d, z = cam.z + Math.sin(a) * d;
    if (terrainH(x, z) > WATER_Y - 0.15) continue;
    dropRipple(x, z, SHOT_T0 - shotRnd() * RIPPLE_LIFE);
  }
}

function renderShotFrame() {
  resize();
  const t = SHOT_T0;
  step(SHOT_DT, t); draw(t);
  document.documentElement.setAttribute('data-shot-ready', '1');
  document.body.setAttribute('data-shot-ready', '1');
}

window.__poemShot = function (spec) {
  const n = String(spec).split(',').map(Number);
  if (n.length >= 4 && n.every(v => isFinite(v))) {
    cam.x = n[0]; cam.z = n[1]; cam.yaw = n[2]; cam.pitch = n[3];
  }
  cam.y = groundY(cam.x, cam.z) + EYE;
  document.body.classList.add('shot');
  document.body.removeAttribute('data-shot-ready');
  document.documentElement.removeAttribute('data-shot-ready');
  scatterShotAroundCam();
  renderShotFrame();
  return true;
};

/* --------------------------------------------------------------- 调试口 -- */
/* window.__world(): 这一帧里究竟有什么，几 KB 的 JSON。循环的硬门读它，不读图
 * （见 ../shared/worldprobe.js 与 ../AGENTS.md）。手写 WebGL 没有场景图，所以
 * 每一项都读它自己那张表：网格的包围盒从建网格时的顶点来，漂着的东西从更新时
 * 写回的位置来，没有一处是把公式再抄一遍。 */
if (window.PoemProbe) {
  window.PoemProbe.install('xiangfuren', {
    viewport: function () {
      return { w: canvas.width, h: canvas.height,
               dpr: SHOT ? 1 : Math.min(devicePixelRatio || 1, LITE ? 1 : 1.5) };
    },
    project: function (x, y, z) {
      const m = vp;                       // 画这一帧用的那个矩阵，不是另算一个
      const cw = m[3] * x + m[7] * y + m[11] * z + m[15];
      if (!(cw > 1e-4)) return null;      // 在眼睛后面
      const cx = m[0] * x + m[4] * y + m[8] * z + m[12];
      const cy = m[1] * x + m[5] * y + m[9] * z + m[13];
      return { x: (cx / cw * 0.5 + 0.5) * canvas.width,
               y: (-cy / cw * 0.5 + 0.5) * canvas.height };
    }
  }, function (probe) {
    const t = sceneT;

    function meshParts(prefix, mesh) {
      for (const part of mesh.parts || []) {
        if (!part.box) { probe.add(prefix + part.name, null, { tris: part.tris }); continue; }
        probe.box(prefix + part.name, part.box.slice(0, 3), part.box.slice(3),
                  { tris: part.tris });
      }
    }
    meshParts('', house);
    meshParts('', wrong);

    /* 灯：它照得到什么，是看水和席的亮度；灯本身在不在画面里先得能问 */
    probe.add('lamps', LAMPS.map(L => [L[0], L[1], L[2]]), { count: LAMPS.length });

    /* 袂与褋：这个世界里唯一还在走的东西 */
    probe.add('cloths', CLOTHS.filter(C => C.at).map(C => C.at),
              { count: CLOTHS.length, hanging: CLOTHS.filter(C => C.hang).length });

    /* 木叶下：空中的与水上的 */
    probe.add('falling-leaves', leaves.map(L => [L.x, L.y, L.z]), { count: NLEAF });
    probe.add('float-leaves', null, { present: true, count: FLOATN });

    /* 水成文：此刻还开着的圈 */
    const live = ripples.filter(r => r && t - r.t0 < RIPPLE_LIFE && t >= r.t0);
    probe.add('ripples', live.map(r => [r.x, WATER_Y, r.z]),
              { count: live.length, pool: NRIPPLE });

    /* 底下这三张网格总是在的；对它们，硬门问的是预算不是有无 */
    probe.add('water', null, { present: true, tris: water.n / 3, span: WSPAN });
    probe.add('terrain', null, { present: true, tris: terrain.n / 3 });
    probe.add('peaks', null, { present: true, tris: peaks.n / 3 });
    probe.add('blades', null, { present: true, tris: blades.n / 3 });

    return {
      t: PoemProbe.n2(t),
      camera: {
        x: PoemProbe.n2(cam.x), y: PoemProbe.n2(cam.y), z: PoemProbe.n2(cam.z),
        yaw: PoemProbe.n4(cam.yaw), pitch: PoemProbe.n4(cam.pitch),
        /* 机位的 y 是世界绝对高度：这才是眼睛离脚下地面多高 */
        ground: PoemProbe.n2(groundY(cam.x, cam.z)),
        eyeAboveGround: PoemProbe.n2(cam.y - groundY(cam.x, cam.z))
      },
      render: {
        renderer: 'webgl',
        calls: glStats.calls,
        triangles: Math.round(glStats.tris),
        frameMs: PoemProbe.n2(lastFrameMs)
      }
    };
  });
}

function frame(ms) {
  if (SHOT) return;
  if (!wantLive(ms)) { loopOn = false; return; }
  requestAnimationFrame(frame);
  if (ms - lastDrawT < 1000 / LIVE_FPS) return;
  lastDrawT = ms;
  const t = ms / 1000;
  if (!T0) { T0 = t; lastT = t; }
  const dt = Math.min(0.05, t - lastT); lastT = t;
  step(dt, t - T0);
  draw(t - T0);
}

let loopOn = false, lastDrawT = 0, liveUntil = 0, roamHold = false;
function wantLive(now) {
  if (document.hidden) return false;
  if (roamHold) return true;
  if (now < liveUntil) return true;
  if (keys.KeyW || keys.KeyA || keys.KeyS || keys.KeyD ||
      keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight) return true;
  if (stick || dragId !== null) return true;
  return false;
}
function pokeLive() {
  liveUntil = performance.now() + 1400;
  kickLoop();
}
function kickLoop() {
  if (SHOT || document.hidden) return;
  if (!loopOn) { loopOn = true; lastT = performance.now() / 1000; requestAnimationFrame(frame); }
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) loopOn = false;
  else pokeLive();
});
window.__poemPerf = {
  poke: pokeLive,
  roam: function (on) { roamHold = !!on; keys.KeyW = !!on; if (on) pokeLive(); }
};

if (gl) {
  cam.y = groundY(cam.x, cam.z) + EYE;
  if (SHOT) {
    document.body.classList.add('shot');
    scatterShotAroundCam();
    renderShotFrame();
  } else {
    resize();
    const t0 = performance.now() / 1000;
    T0 = t0; lastT = t0;
    step(0.016, 0); draw(0);
  }
}

/* =====================================================================
   右栏：打磨时间线 —— 三个世界共用 shared/timeline.js，读同一份 log.jsonl
   ===================================================================== */
if (!SHOT && window.PolishTimeline) {
  PolishTimeline.mount({
    el: '#tl', log: 'log.jsonl',
    onReady: function (rounds) {
      const n = rounds.length;
      document.getElementById('ft-rounds').textContent = n ? (n + ' 轮（进行中）') : '—';
      // 只认最后一轮上的 stop。第一段在第 10 轮停过一次，第二段又接着跑；
      // 拿「有没有任何一轮 stop 过」判断，页脚会一直挂着上一段的停止原因。
      const last = rounds[n - 1];
      if (last && last.stop) {
        document.getElementById('ft-rounds').textContent = n + ' 轮';
        document.getElementById('ft-stop').textContent = last.stop_reason || last.stop || '循环结束';
      }
    }
  });
}

const railToggle = document.getElementById('railtoggle');
railToggle.addEventListener('click', () => {
  const col = document.body.classList.toggle('rail-collapsed');
  railToggle.textContent = col ? '‹' : '›';
  try { localStorage.setItem('xfr.rail', col ? '1' : '0'); } catch (e) {}
});
try { if (localStorage.getItem('xfr.rail') === '1') railToggle.click(); } catch (e) {}
if (SHOT) document.body.classList.add('shot');
</script>
</body>
